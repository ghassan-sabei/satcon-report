<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3a67">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>التقرير اليومي - SATCON</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#eef1f6;color:#1d2433;font-size:16px}
header.top{background:#2b3a67;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0}
header.top .d{font-size:14px;opacity:.85}
main{padding:12px;max-width:680px;margin:0 auto}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:16px;margin:0 0 10px;color:#2b3a67}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{min-width:110px;font-size:14px;color:#555}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{font:inherit;padding:10px;border:1px solid #c8cfdb;border-radius:8px;flex:1;min-width:0;background:#fff}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:#dfe5f0;color:#1d2433}
button:active{transform:scale(.97)}
.big{width:100%;padding:16px;font-size:18px;font-weight:600}
.pri{background:#2f6fd6;color:#fff}
.ok{background:#1f9d55;color:#fff}
.warn{background:#e08a00;color:#fff}
.dan{background:#d64545;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:#f3f6fb;border-radius:8px;padding:8px 4px}
.stat b{display:block;font-size:20px;color:#2b3a67}
.stat span{font-size:12px;color:#666}
.tm{font-size:13px;color:#555;margin-top:4px;text-align:center}
.paused{background:#fff4e0;border:2px solid #e08a00}
.card{border:2px solid #2f6fd6}
.card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card .hd b{font-size:18px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{padding:10px 6px;text-align:center;line-height:1.3;font-size:14px;background:#eef1f6;color:#888}
.step .t{display:block;font-size:20px;font-weight:700}
.step.done{background:#d8f0e1;color:#14532d}
.step.next{background:#2f6fd6;color:#fff;box-shadow:0 0 0 3px #b7cdf3}
.hint{font-size:12px;color:#777;margin:6px 0 0}
.done-list .it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.done-list .it:last-child{border:0}
.small{padding:8px 10px;font-size:14px}
.zb{width:44px;height:44px;padding:0;font-size:22px;font-weight:700;background:rgba(43,58,103,.88);color:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.muted{color:#888;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .in{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#printArea{display:none}

/* ===== print sheet ===== */
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  header.top,main,.modal{display:none!important}
  #printArea{display:block}
}
.sheet{font-family:Arial,Tahoma,sans-serif;color:#000;width:100%;font-size:12px}
.sheet table{border-collapse:collapse;width:100%}
.sheet td,.sheet th{border:1px solid #1f2a5a;padding:3px 4px;text-align:center;height:26px}
.sheet .blue{background:#5b9bd5;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .logo{background:#2b3a67;color:#fff;font-size:20px;letter-spacing:4px;font-weight:300;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{font-size:16px;font-weight:700}
.sheet .grid th{font-weight:700;font-size:11px}
.sheet .grid td{font-size:15px;padding:0 4px}
.sheet .grid td.nt{font-size:12px;line-height:1.2}
.sheet .pgno{text-align:center;font-size:11px;margin-top:4px}
@media print{
  .pp{width:733px;height:1062px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .sheet.page{position:absolute;top:0;left:0;height:733px;transform-origin:top left;transform:translateX(733px) rotate(90deg)}
  .pp.a3{width:1062px;height:1527px}
  .pp.a3 .sheet.page{height:1062px;transform:translateX(1062px) rotate(90deg)}
}
.sheet .foot{margin-top:6px;text-align:right;font-size:11px}
</style>
</head>
<body>
<header class="top">
  <h1>التقرير اليومي</h1>
  <div class="d" id="hdDate"></div>
</header>

<main id="app"></main>
<div id="printArea"></div>

<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>

<script>
(function(){
"use strict";
var KEY="satcon_daily_v1";
var STEPS=[
 {k:"drillStart",n:"بدء الحفر"},
 {k:"drillEnd",n:"انتهاء الحفر"},
 {k:"concOrder",n:"طلب الكونكريت"},
 {k:"concArrive",n:"وصول الكونكريت"},
 {k:"pourStart",n:"بدء الصب"},
 {k:"pourEnd",n:"انتهاء الصب"}
];
var REASONS=["عطل","انتظار كونكريت","طقس","غيره"];
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

var S=load();
function blankDay(){
  var d=new Date();
  return {date:isoDate(d),block:S&&S.cur?S.cur.block:"",workStart:null,workEnd:null,mortar:"",
          pauses:[],piles:[],nextId:1,depth:S&&S.settings?S.settings.depth:"",steel:S&&S.settings?S.settings.steel:""};
}
function load(){
  var s=null;
  try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!s)s={settings:{project:"OCR PROJECT ",depth:"20.0",steel:"12.0"},cur:null,archive:[]};
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
if(!S.cur){S.cur=blankDay();save();}
/* a current day that has nothing recorded yet always takes today's date */
(function(){var c=S.cur,t=isoDate(new Date());if(c.date!==t&&!c.workStart&&!c.piles.length&&!(c.pauses&&c.pauses.length)&&!c.mortar){c.date=t;save()}})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

function parseTyped(str){var p=String(str).trim().replace(/[٠-٩]/g,function(c){return"٠١٢٣٤٥٦٧٨٩".indexOf(c)}).split(/[\/\-\.\s]+/).filter(function(x){return x});
  if(!p.length||p.length>3)return null;var now=new Date(),d=+p[0],m=p.length>1?+p[1]:now.getMonth()+1,y=p.length>2?+p[2]:now.getFullYear();
  if(y<100)y+=2000;if(!(d>=1&&d<=31&&m>=1&&m<=12))return null;var dt=new Date(y,m-1,d);if(dt.getDate()!==d)return null;return isoDate(dt)}
function pad(n){return(n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hm(ts){if(!ts)return"";var d=new Date(ts),h=d.getHours(),ap=h<12?"ص":"م";h=h%12||12;return h+":"+pad(d.getMinutes())+" "+ap}
function hm24(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dayName(iso){var p=iso.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return DAYS[d.getDay()]}
function fmtDate(iso){var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(v){var x=parseFloat(v);return isNaN(x)?0:x}

function delayMs(day){
  var t=0,now=Date.now();
  day.pauses.forEach(function(p){t+=(p.end||now)-p.start});
  return t;
}
function delayHours(day){return Math.round(delayMs(day)/360000)/10}
function activePause(day){var p=day.pauses[day.pauses.length-1];return p&&!p.end?p:null}
function isDone(p){return p.pourEnd&&p.vol!==""&&p.vol!=null}
function totals(day){
  var n=0,v=0;
  day.piles.forEach(function(p){if(p.pourEnd){n++;v+=num(p.vol)}});
  return{n:n,v:Math.round(v*100)/100};
}

/* ---------- modal helpers ---------- */
var M=document.getElementById("modal"),MI=document.getElementById("modalIn");
function openModal(html){MI.innerHTML=html;M.classList.add("show")}
function closeModal(){M.classList.remove("show");MI.innerHTML=""}
M.addEventListener("click",function(e){if(e.target===M)closeModal()});
function confirmBox(msg,yes,cb){
  openModal('<h3>'+esc(msg)+'</h3><div class="acts"><button id="mY" class="dan">'+esc(yes)+'</button><button id="mN">إلغاء</button></div>');
  document.getElementById("mY").onclick=function(){closeModal();cb()};
  document.getElementById("mN").onclick=closeModal;
}
function timeEdit(title,ts,cb){
  var v=ts?hm24(ts):hm24(Date.now());
  openModal('<h3>'+esc(title)+'</h3><input type="time" id="mT" value="'+v+'" style="width:100%;font-size:22px;direction:ltr">'+
   '<div class="acts"><button id="mS" class="pri">حفظ</button>'+(ts?'<button id="mC" class="dan">مسح</button>':'')+'<button id="mN">إلغاء</button></div>');
  document.getElementById("mS").onclick=function(){
    var val=document.getElementById("mT").value;if(!val)return;
    var base=ts?new Date(ts):new Date();var pr=val.split(":");
    base.setHours(+pr[0],+pr[1],0,0);closeModal();cb(base.getTime());
  };
  if(ts)document.getElementById("mC").onclick=function(){closeModal();cb(null)};
  document.getElementById("mN").onclick=closeModal;
}

/* long press */
function bindPress(el,tap,long){
  var t=null,fired=false;
  function start(){fired=false;t=setTimeout(function(){fired=true;long()},600)}
  function end(e){clearTimeout(t);if(!fired&&e.type!=="pointerleave"&&e.type!=="pointercancel")tap()}
  el.addEventListener("pointerdown",start);
  el.addEventListener("pointerup",end);
  el.addEventListener("pointerleave",function(e){clearTimeout(t)});
  el.addEventListener("pointercancel",function(e){clearTimeout(t)});
  el.addEventListener("contextmenu",function(e){e.preventDefault()});
}

/* ---------- render ---------- */
var view="main";
function render(){
  var day=S.cur;
  document.getElementById("hdDate").textContent=dayName(day.date)+" "+fmtDate(day.date);
  var app=document.getElementById("app");
  if(view==="archive"){renderArchive(app);return}
  if(view==="blocks"){renderBlocks(app);return}
  if(view==="plan"){renderPlan(app);return}
  if(view==="block"){renderBlock(app);return}
  if(view==="settings"){renderSettings(app);return}
  var tt=totals(day),ap=activePause(day);
  var open=day.piles.filter(function(p){return!isDone(p)});
  var done=day.piles.filter(isDone);
  var h="";

  if(S.handedOver)h+='<div class="box" style="background:#fff4e0;border:2px solid #e08a00"><b>⚠️ سلّمت البيانات لمشرف تاني بتاريخ '+fmtDate(isoDate(new Date(S.handedOver)))+'</b><p style="margin:6px 0">أي شي بتسجّله هون بعد التسليم ما بيوصله.</p><button class="small" id="hoX">فهمت، خفّي التنبيه</button></div>';
  h+='<div class="box"><h2>معلومات اليوم</h2>'+
     '<div class="row"><label>تاريخ التقرير</label><input type="date" id="dayDate" value="'+esc(day.date)+'"'+(day.date!==isoDate(new Date())?' style="border-color:#e08a00;background:#fff4e0"':'')+'></div>'+
     (day.date!==isoDate(new Date())?'<p class="hint" style="color:#a15c00;margin:-4px 0 8px">⚠️ تاريخ التقرير مش تاريخ اليوم. إذا غلط صلّحه من هون.</p>':'')+
     '<div class="row"><label>رقم البلوك</label><input type="text" id="block" value="'+esc(day.block)+'"></div>'+
     '<div class="two">'+
       '<div><button class="big '+(day.workStart?'':'ok')+'" data-id="ws">'+(day.workStart?'بدء العمل ✓':'بدء العمل')+'</button><div class="tm">'+(day.workStart?hm(day.workStart):'—')+'</div></div>'+
       '<div><button class="big '+(day.workStart&&!day.workEnd?'dan':'')+'" data-id="we">'+(day.workEnd?'انتهاء العمل ✓':'انتهاء العمل')+'</button><div class="tm">'+(day.workEnd?hm(day.workEnd):'—')+'</div></div>'+
     '</div><p class="hint">ضغطة مطوّلة على أي زر لتعديل الوقت</p></div>';

  h+='<div class="box '+(ap?'paused':'')+'"><h2>التوقف</h2>';
  if(ap){
    h+='<p style="margin:0 0 8px">متوقف منذ <b>'+hm(ap.start)+'</b> — السبب: <b>'+esc(ap.reason)+'</b></p>'+
       '<button class="big ok" id="resume">استئناف</button>';
  }else{
    h+='<button class="big warn" id="pause">توقف</button>';
  }
  if(day.pauses.length){
    h+='<div class="done-list" style="margin-top:8px">';
    day.pauses.forEach(function(p,i){
      h+='<div class="it"><span>'+esc(p.reason)+' &nbsp; <span>'+hm(p.start)+' - '+(p.end?hm(p.end):'...')+'</span> &nbsp; <b>'+durTxt((p.end||Date.now())-p.start)+'</b></span>'+
         '<button class="small" data-delp="'+i+'">حذف</button></div>';
    });
    h+='</div>';
  }
  h+='<div class="tm">مجموع التأخير: <b>'+delayHours(day)+'</b> ساعة</div></div>';

  h+='<button class="big pri" id="newPile" style="margin-bottom:12px">+ حفرة جديدة</button>';

  open.forEach(function(p){
    var nextIdx=-1;for(var i=0;i<STEPS.length;i++){if(!p[STEPS[i].k]){nextIdx=i;break}}
    h+='<div class="box card"><div class="hd"><b>حفرة رقم '+esc(p.no)+'</b><span><button class="small" data-editno="'+p.id+'">✎ تعديل الرقم</button> <button class="small" data-delpile="'+p.id+'">حذف</button></span></div><div class="steps">';
    STEPS.forEach(function(s,i){
      var cls=p[s.k]?"done":(i===nextIdx?"next":"");
      h+='<button class="step '+cls+'" data-pile="'+p.id+'" data-step="'+s.k+'">'+s.n+'<span class="t">'+(p[s.k]?hm(p[s.k]):'--:--')+'</span></button>';
    });
    h+='</div><div class="row" style="margin-top:10px"><label>كمية الصب m3</label><input type="number" inputmode="decimal" step="0.1" data-vol="'+p.id+'" value="'+esc(p.vol)+'"></div>'+
       '<div class="row"><label>ملاحظات</label><input type="text" data-note="'+p.id+'" value="'+esc(p.note)+'"></div>'+
       (p.pourEnd&&(p.vol===""||p.vol==null)?'<p class="hint" style="color:#d64545">اكتب كمية الصب لإغلاق الحفرة</p>':'')+
       '</div>';
  });

  h+='<div class="box"><h2>ملخص اليوم</h2><div class="stat">'+
     '<div><b>'+tt.n+'</b><span>بايلات منفذة</span></div>'+
     '<div><b>'+tt.v+'</b><span>كونكريت m3</span></div>'+
     '<div><b>'+delayHours(day)+'</b><span>تأخير (ساعة)</span></div></div>'+
     '<div class="row" style="margin-top:10px"><label>المورتر m3</label><input type="number" inputmode="decimal" step="0.1" id="mortar" value="'+esc(day.mortar)+'"></div>';
  if(done.length){
    h+='<div class="done-list">';
    done.forEach(function(p){
      h+='<div class="it"><span><b>'+esc(p.no)+'</b> &nbsp; <span>'+hm(p.drillStart)+' ← '+hm(p.pourEnd)+'</span> &nbsp; '+esc(p.vol)+' m3</span>'+
         '<button class="small" data-reopen="'+p.id+'">فتح</button></div>';
    });
    h+='</div>';
  }
  h+='</div>';

  h+='<div class="two" style="margin-bottom:8px"><button class="big ok" id="print">🖨 طباعة</button><button class="big pri" id="pdf">📄 إرسال PDF</button></div>'+
     '<div class="two" style="margin-bottom:8px"><button class="big" id="goBlk">📊 ملخص البلوكات</button><button class="big" id="goPlan">🗺️ المخطط</button></div>'+
     '<div class="two" style="margin-bottom:24px"><button id="goArch">الأيام السابقة</button><button id="goSet">الإعدادات</button></div>'+
     '<button class="big" id="newDay" style="margin-bottom:30px">بدء يوم جديد</button>';

  app.innerHTML=h;
  var hx=document.getElementById("hoX");if(hx)hx.onclick=function(){delete S.handedOver;save();render()};
  wire(app);
}

function findPile(id){id=+id;for(var i=0;i<S.cur.piles.length;i++)if(S.cur.piles[i].id===id)return S.cur.piles[i];return null}

function wire(app){
  var day=S.cur;
  document.getElementById("block").oninput=function(e){day.block=e.target.value;save()};
  document.getElementById("dayDate").onchange=function(e){if(e.target.value){day.date=e.target.value;save();render()}};
  document.getElementById("mortar").oninput=function(e){day.mortar=e.target.value;save()};
  bindPress(app.querySelector('[data-id=ws]'),function(){
    if(!day.workStart){if(!day.piles.length&&day.date!==isoDate(new Date()))day.date=isoDate(new Date());day.workStart=Date.now();save();render()}
  },function(){timeEdit("وقت بدء العمل",day.workStart,function(t){day.workStart=t;save();render()})});
  bindPress(app.querySelector('[data-id=we]'),function(){
    if(!day.workEnd){day.workEnd=Date.now();var ap=activePause(day);if(ap)ap.end=day.workEnd;save();render()}
  },function(){timeEdit("وقت انتهاء العمل",day.workEnd,function(t){day.workEnd=t;save();render()})});

  var pb=document.getElementById("pause");
  if(pb)pb.onclick=function(){
    var h='<h3>سبب التوقف</h3><div class="reasons">';
    REASONS.forEach(function(r){h+='<button class="big" data-r="'+esc(r)+'">'+esc(r)+'</button>'});
    h+='</div><div class="acts"><button id="mN">إلغاء</button></div>';
    openModal(h);
    MI.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){
      var r=b.getAttribute("data-r");
      if(r==="غيره"){
        openModal('<h3>اكتب السبب</h3><input type="text" id="mR"><div class="acts"><button id="mS" class="pri">توقف</button><button id="mN">إلغاء</button></div>');
        document.getElementById("mS").onclick=function(){var v=document.getElementById("mR").value.trim()||"غيره";closeModal();day.pauses.push({start:Date.now(),end:null,reason:v});save();render()};
        document.getElementById("mN").onclick=closeModal;
        return;
      }
      closeModal();day.pauses.push({start:Date.now(),end:null,reason:r});save();render();
    }});
    document.getElementById("mN").onclick=closeModal;
  };
  var rb=document.getElementById("resume");
  if(rb)rb.onclick=function(){activePause(day).end=Date.now();save();render()};
  app.querySelectorAll("[data-delp]").forEach(function(b){b.onclick=function(){
    confirmBox("حذف هذا التوقف؟","حذف",function(){day.pauses.splice(+b.getAttribute("data-delp"),1);save();render()});
  }});

  document.getElementById("newPile").onclick=function(){
    openModal('<h3>رقم الحفرة</h3><input type="text" id="mP" inputmode="text" style="font-size:22px"><div class="acts"><button id="mS" class="pri">إضافة</button><button id="mN">إلغاء</button></div>');
    var inp=document.getElementById("mP");setTimeout(function(){inp.focus()},50);
    document.getElementById("mS").onclick=function(){
      var v=inp.value.trim();if(!v){inp.style.borderColor="#d64545";return}
      var warn=pileWarning(v);
      if(warn&&!inp.dataset.ok){inp.dataset.ok="1";var w=document.getElementById("mW");if(!w){w=document.createElement("p");w.id="mW";w.className="hint";w.style.color="#d64545";inp.after(w)}w.textContent=warn+" — اكبس إضافة مرة تانية إذا متأكد.";return}
      addPile(v);closeModal();save();render();
    };
    document.getElementById("mN").onclick=closeModal;
  };
  function addPile(v){
      day.piles.push({id:day.nextId++,no:v,drillStart:null,drillEnd:null,concOrder:null,concArrive:null,pourStart:null,pourEnd:null,vol:"",note:""});
      if(!day.workStart)day.workStart=Date.now();
  }
  window.__addPile=function(v){addPile(v);save()};

  app.querySelectorAll(".step").forEach(function(b){
    var p=findPile(b.getAttribute("data-pile")),k=b.getAttribute("data-step");
    var name="";STEPS.forEach(function(s){if(s.k===k)name=s.n});
    bindPress(b,function(){

    Promise.all([loadDwg(),file.arrayBuffer()]).then(function(r){
      var L=r[0],dwg=L.l.dwg_read_data(r[1],L.m.Dwg_File_Type.DWG);if(!dwg)throw new Error("read");

        openModal('<h3>تم ✓</h3><p>بلوك <b>'+esc(label)+'</b>: لقيت <b>'+pl.piles.length+'</b> حفرة'+(pl.extra.length?'، و '+pl.extra.length+' داير بلا رقم (رمادية، مش محسوبة)':'')+(pl.dup.length?'. أرقام مكررة: '+esc(pl.dup.join("، ")):'')+'.</p><div class="acts"><button id="mN">تمام</button></div>');document.getElementById("mN").onclick=closeModal}
      if(S.plans[key])confirmBox("في مخطط لبلوك "+label+". بدّل القديم بالجديد؟","بدّل",doSave);else doSave();

  };
}

function utf8b64(str){var bytes=new TextEncoder().encode(str),bin="";for(var i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(bin)}
function shareText(text,name,mime,title){
  if(NATIVE&&window.AndroidBridge.shareFile){var r=window.AndroidBridge.shareFile(utf8b64(text),name,mime);return!r}
  if(NATIVE){window.AndroidBridge.sharePdf(utf8b64(text),name);return true}
  var blob=new Blob([text],{type:mime}),file=new File([blob],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:title}).catch(function(){});return true}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true;
}
function saveText(text,name,mime){
  if(NATIVE&&window.AndroidBridge.saveDownload)return window.AndroidBridge.saveDownload(utf8b64(text),name,mime)==="OK";
  if(!NATIVE){var blob=new Blob([text],{type:mime}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
  return false}
function allDays(st){return[st.cur].concat(st.archive||[]).filter(function(d){return d})}
function summary(st){var ds=allDays(st),dates=ds.map(function(d){return d.date}).sort(),bl={},open=0;
  ds.forEach(function(d){var b=normBlock(d.block);if(b)bl[b]=1});(st.cur&&st.cur.piles||[]).forEach(function(p){if(!p.pourEnd)open++});
  var piles=0;ds.forEach(function(d){d.piles.forEach(function(p){if(p.pourEnd)piles++})});
  return{days:ds.filter(function(d){return d.piles.length||d.workStart||d.mortar}).length,first:dates[0],last:dates[dates.length-1],blocks:Object.keys(bl),plans:Object.keys(st.plans||{}),open:open,piles:piles}}
function handOver(){

        '<div class="acts" style="flex-direction:column"><button id="mR" class="dan">استبدال: امسح اللي عندي وخد الملف</button><button id="mM" class="pri">دمج: ضيف الملف على اللي عندي</button><button id="mN">إلغاء</button></div>');
      document.getElementById("mR").onclick=function(){confirmBox("رح تنمسح كل بياناتك على هالموبايل وتتبدّل ببيانات الملف. أكيد؟","استبدال",function(){applyReplace(inc)})};

function done(msg){save();view="main";render();scrollTo(0,0);openModal('<h3>'+msg+' ✓</h3><p>كمّل الشغل من هون.</p><div class="acts"><button id="mN">تمام</button></div>');document.getElementById("mN").onclick=closeModal}
function applyReplace(inc){
  S.settings=inc.settings||S.settings;S.cur=inc.cur;S.archive=inc.archive||[];S.plans=inc.plans||{};delete S.handedOver;
  done("تم الاستلام")}
function stepCount(p){var n=0;STEPS.forEach(function(st){if(p[st.k])n++});if(p.vol!==""&&p.vol!=null)n++;return n}
function mergeDay(a,b){ /* b = incoming wins on ties */
  var m=JSON.parse(JSON.stringify(a));
  ["workStart","workEnd"].forEach(function(k){if(b[k]&&!m[k])m[k]=b[k];else if(b[k]&&m[k])m[k]=k==="workStart"?Math.min(m[k],b[k]):Math.max(m[k],b[k])});
  if(!m.mortar&&b.mortar)m.mortar=b.mortar;if(!m.block&&b.block)m.block=b.block;
  ["depth","steel"].forEach(function(k){if(!m[k]&&b[k])m[k]=b[k]});
  var ps={};(m.pauses||[]).forEach(function(p){ps[p.start]=p});(b.pauses||[]).forEach(function(p){if(!ps[p.start]||(!ps[p.start].end&&p.end))ps[p.start]=p});
  m.pauses=Object.keys(ps).sort().map(function(k){return ps[k]});
  var byNo={},order=[];m.piles.forEach(function(p){var k=String(p.no).trim();byNo[k]=p;order.push(k)});
  b.piles.forEach(function(p){var k=String(p.no).trim();if(!byNo[k]){byNo[k]=JSON.parse(JSON.stringify(p));order.push(k)}else if(stepCount(p)>=stepCount(byNo[k]))byNo[k]=JSON.parse(JSON.stringify(p))});
  m.piles=order.map(function(k,i){var p=byNo[k];p.id=i+1;return p});m.nextId=m.piles.length+1;
  return m}
function applyMerge(inc){
  var map={},key=function(d){return d.date+"|"+normBlock(d.block)};
  allDays(S).forEach(function(d){map[key(d)]=JSON.parse(JSON.stringify(d))});
  allDays(inc).forEach(function(d){var k=key(d);map[k]=map[k]?mergeDay(map[k],d):JSON.parse(JSON.stringify(d))});
  var curKey=key(inc.cur.date>=S.cur.date?inc.cur:S.cur);
  S.cur=map[curKey];delete map[curKey];
  S.archive=Object.keys(map).map(function(k){return map[k]}).filter(function(d){return d.piles.length||d.workStart||d.mortar||(d.pauses&&d.pauses.length)}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  S.plans=S.plans||{};Object.keys(inc.plans||{}).forEach(function(k){S.plans[k]=inc.plans[k]});
  ["project","depth","steel"].forEach(function(k){if(!S.settings[k]&&inc.settings&&inc.settings[k])S.settings[k]=inc.settings[k]});
  delete S.handedOver;
  done("تم الدمج")}

/* ---------- print ---------- */
function m1(v){var x=parseFloat(v);return isNaN(x)?esc(v):x.toFixed(1)+"m"}
function durTxt(ms){var m=Math.round(ms/60000);if(m<60)return m+" د";var h=Math.floor(m/60),r=m%60;return h+" س"+(r?" "+r+" د":"")}
function pauseNotes(day,piles){
  var map={};
  day.pauses.forEach(function(pa){
    var t=pa.start,best=null;
    piles.forEach(function(p){
      var st=p.drillStart||p.concOrder||p.pourStart;if(!st||st>t)return;
      var en=p.pourEnd||Infinity;if(en<t)return;
      if(!best||st>(best.drillStart||best.concOrder||best.pourStart))best=p;
    });
    if(!best){piles.forEach(function(p){var st=p.drillStart||p.concOrder||p.pourStart;if(st&&st>=t&&(!best||st<(best.drillStart||best.concOrder||best.pourStart)))best=p})}
    if(!best&&piles.length)best=piles[piles.length-1];
    var key=best?best.id:"_";
    map[key]=map[key]||{};
    map[key][pa.reason]=(map[key][pa.reason]||0)+((pa.end||Date.now())-pa.start);
  });
  var out={};
  Object.keys(map).forEach(function(k){out[k]=Object.keys(map[k]).map(function(r){return r+" "+durTxt(map[k][r])}).join("، ")});
  return out;
}

   '<tr><td class="blue">Pile Depth (m):</td><td>'+m1(day.depth||s.depth)+'</td><td class="blue" colspan="2">concrete Consumption (m3 /day):</td><td>'+(t.v||"")+'</td><td class="blue" colspan="2">work End time:</td><td dir="rtl">'+hm(day.workEnd)+'</td></tr>'+
   '<tr><td class="blue">Steel Length (m):</td><td>'+m1(day.steel||s.steel)+'</td><td class="blue" colspan="2">Mortar consumption (m3/ day):</td><td>'+esc(day.mortar)+'</td><td class="blue" colspan="2">Delays (hours):</td><td>'+(day.pauses.length?delayHours(day):"")+'</td></tr>'+
   '</table>'+
   '<table class="grid" dir="rtl" style="margin-top:-1px"><tr>'+
   '<th>العدد</th><th>رقم الحفرة</th><th>وقت بدء الحفر</th><th>وقت إنتهاء الحفر</th><th>وقت طلب الكونكريت</th><th>وقت وصول الكونكريت</th><th>وقت بدء الصب</th><th>وقت إنتهاء الصب</th><th>كمية الصب m3</th><th style="width:18%">الملاحظات</th></tr>';
}
function measureHead(day,withFoot){
  var box=document.createElement("div");
  box.style.cssText="position:fixed;left:-20000px;top:0;width:"+PAGE_W+"px";
  box.innerHTML='<div class="sheet">'+sheetHead(day)+'</table>'+(withFoot?'<div class="foot">x</div>':'')+'</div>';
  document.body.appendChild(box);var h=box.offsetHeight;document.body.removeChild(box);return h;
}
/* returns array of page HTML strings, each exactly one A4 landscape page */
function sheetPages(day){
  var piles=day.piles.slice().sort(function(a,b){return(a.drillStart||9e15)-(b.drillStart||9e15)});
  var pn=pauseNotes(day,piles);
  var foot=pn["_"]?'<div class="foot" dir="rtl"><b>توقفات:</b> '+esc(pn["_"])+'</div>':'';
  var avail=PAGE_H-measureHead(day,!!foot)-4;
  var total=Math.max(MIN_ROWS,Math.ceil(piles.length/12)*12);
  var rowsPer=12,nPages=total/12;
  if(nPages>1)avail-=22;
  var rowH=Math.floor(avail/rowsPer);
  var pages=[];
  for(var pg=0;pg<nPages;pg++){
    var h='<div class="sheet page" style="width:'+PAGE_W+'px">'+sheetHead(day);
    for(var i=pg*rowsPer;i<Math.min(total,(pg+1)*rowsPer);i++){
      var p=piles[i];
      h+='<tr style="height:'+rowH+'px"><td>'+(i+1)+'</td>';
      if(p){h+='<td>'+esc(p.no)+'</td>';STEPS.forEach(function(st){h+='<td>'+hm(p[st.k])+'</td>'});var nt=[p.note,pn[p.id]].filter(function(x){return x}).join(" - ");h+='<td>'+esc(p.vol)+'</td><td class="nt">'+esc(nt)+'</td>'}
      else h+='<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>';
      h+='</tr>';
    }
    h+='</table>'+(pg===nPages-1?foot:'')+(nPages>1?'<div class="pgno">'+(pg+1)+' / '+nPages+'</div>':'')+'</div>';
    pages.push(h);
  }
  return pages;
}
var NATIVE=!!(window.AndroidBridge&&window.AndroidBridge.isNative);
var A3_W=1527,A3_H=1062;
var pageStyle=document.createElement("style");document.head.appendChild(pageStyle);
pageStyle.textContent=NATIVE?"@page{size:A4 landscape;margin:8mm}":"";
function printPages(pages,title,fallback,a3){
  if(NATIVE){
    pageStyle.textContent="@page{size:"+(a3?"A3":"A4")+" landscape;margin:8mm}";
    document.getElementById("printArea").innerHTML=pages.join("");
    setTimeout(function(){if(window.AndroidBridge.printSized)window.AndroidBridge.printSized(title,a3?"A3":"A4");else window.AndroidBridge.print(title)},150);
    return;
  }
  pageStyle.textContent=a3?"@page{size:A3 portrait;margin:8mm}":"";
  document.getElementById("printArea").innerHTML=pages.map(function(x){return'<div class="pp'+(a3?' a3':'')+'">'+x+'</div>'}).join("");
  var opened=false;
  function mark(){opened=true}
  window.addEventListener("beforeprint",mark,{once:true});
  try{window.print()}catch(e){}
  setTimeout(function(){
    window.removeEventListener("beforeprint",mark);
    if(opened)return;
    openModal('<h3>الطباعة المباشرة ما فتحت</h3><p>رح جهّزلك التقرير PDF، اختار تطبيق PDF من القائمة وافتحه واطبع منه.</p><div class="acts"><button id="mS" class="pri">تجهيز PDF</button><button id="mN">إلغاء</button></div>');
    document.getElementById("mS").onclick=function(){closeModal();fallback()};
    document.getElementById("mN").onclick=closeModal;
  },1500);
}
function doPrint(day){printPages(sheetPages(day),"report_"+day.date,function(){sharePdf(day)})}
function sharePdf(day){
  var name="report_"+day.date+(day.block?"_"+String(day.block).replace(/[^\w-]/g,""):"")+".pdf";
  pdfPages(function(){return sheetPages(day)},name,"التقرير اليومي "+fmtDate(day.date));
}
var LIBS=["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
          "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"];
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function busy(msg){openModal('<h3 style="text-align:center">'+esc(msg)+'</h3>')}
function pdfPages(makePages,name,title,a3){
  var PW=a3?A3_W:PAGE_W,PH=a3?A3_H:PAGE_H,FMT=a3?"a3":"a4",MW=a3?404:281;
  busy("جاري تجهيز PDF...");
  var p=window.jspdf&&window.html2canvas?Promise.resolve():Promise.all(LIBS.map(loadScript));
  p.then(function(){
    var pages=makePages();
    var pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:FMT});
    var chain=Promise.resolve();
    pages.forEach(function(html,idx){
      chain=chain.then(function(){
        var box=document.createElement("div");
        box.style.cssText="position:fixed;left:-20000px;top:0;width:"+PW+"px;height:"+PH+"px;background:#fff;overflow:hidden";
        box.innerHTML=html;document.body.appendChild(box);
        return window.html2canvas(box,{scale:2,backgroundColor:"#fff",width:PW,height:PH}).then(function(cv){
          document.body.removeChild(box);
          if(idx>0)pdf.addPage(FMT,"landscape");
          pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",8,8,MW,MW*PH/PW);
        });
      });
    });
    return chain.then(function(){
      if(NATIVE){closeModal();window.AndroidBridge.sharePdf(pdf.output("datauristring").split(",")[1],name);return}
      var blob=pdf.output("blob");
      var file=new File([blob],name,{type:"application/pdf"});
      closeModal();
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        return navigator.share({files:[file],title:title}).catch(function(){});
      }
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    });
  }).catch(function(){
    openModal('<h3>ما قدر يجهّز PDF</h3><p>أول مرة لازم يكون في إنترنت حتى ينزّل أدوات الـPDF، بعدها بيشتغل بدون نت.</p><div class="acts"><button id="mN">تمام</button></div>');
    document.getElementById("mN").onclick=closeModal;
  });
}

/* ---------- block summary ---------- */
function normBlock(b){return String(b||"").replace(/\s+/g,"").toUpperCase()}
function dayDepth(d){return num(d.depth!=null&&d.depth!==""?d.depth:S.settings.depth)}
function dayStats(d){
  var t=totals(d);
  return{date:d.date,piles:t.n,conc:t.v,mortar:num(d.mortar),delay:d.pauses.length?delayHours(d):0,
         meters:Math.round(t.n*dayDepth(d)*10)/10,cur:d===S.cur};
}
function r2(x){return Math.round(x*100)/100}
function blockGroups(){
  var all=[S.cur].concat(S.archive),g={},order=[];
  all.forEach(function(d){
    var k=normBlock(d.block);
    var st=dayStats(d);
    if(!st.piles&&!st.mortar&&!d.workStart)return;
    if(!g[k]){g[k]={key:k,label:k||"بدون رقم",days:[]};order.push(k)}
    g[k].days.push(st);
  });
  return order.map(function(k){
    var b=g[k];
    b.days.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0});
    var dates={};b.days.forEach(function(x){dates[x.date]=1});
    b.nDays=Object.keys(dates).length;
    b.piles=0;b.conc=0;b.mortar=0;b.delay=0;b.meters=0;
    b.days.forEach(function(x){b.piles+=x.piles;b.conc+=x.conc;b.mortar+=x.mortar;b.delay+=x.delay;b.meters+=x.meters});
    b.conc=r2(b.conc);b.mortar=r2(b.mortar);b.delay=Math.round(b.delay*10)/10;b.meters=Math.round(b.meters*10)/10;
    b.first=b.days[0].date;b.last=b.days[b.days.length-1].date;
    return b;
  });
}
function statGrid(b){
  return '<div class="stat">'+
    '<div><b>'+b.nDays+'</b><span>أيام عمل</span></div>'+
    '<div><b>'+b.piles+'</b><span>بايلات</span></div>'+
    '<div><b>'+b.meters+'</b><span>أمتار</span></div>'+
    '<div><b>'+b.conc+'</b><span>كونكريت m3</span></div>'+
    '<div><b>'+b.mortar+'</b><span>مورتر m3</span></div></div>';
}
function renderBlocks(app){
  var gs=blockGroups();
  var h='<button id="back" style="margin-bottom:12px">→ رجوع</button><div class="box"><h2>ملخص البلوكات</h2>';
  if(!gs.length)h+='<p class="muted">لا يوجد بيانات بعد</p>';
  h+='</div>';
  gs.forEach(function(b,i){
    h+='<div class="box" data-blk="'+i+'" style="cursor:pointer"><h2>بلوك '+esc(b.label)+' <span class="muted">('+fmtDate(b.first)+' ← '+fmtDate(b.last)+')</span></h2>'+statGrid(b)+'</div>';
  });
  app.innerHTML=h;
  document.getElementById("back").onclick=function(){view="main";render()};
  app.querySelectorAll("[data-blk]").forEach(function(el){el.onclick=function(){blockSel=gs[+el.getAttribute("data-blk")].key;view="block";render();scrollTo(0,0)}});
}
var blockSel=null;
function renderBlock(app){
  var b=null;blockGroups().forEach(function(x){if(x.key===blockSel)b=x});
  if(!b){view="blocks";render();return}
  var h='<button id="back" style="margin-bottom:12px">→ رجوع</button>'+
    '<div class="box"><h2>بلوك '+esc(b.label)+'</h2>'+statGrid(b)+
    '<div class="two" style="margin-top:10px"><button class="big ok" id="bPrint">🖨 طباعة</button><button class="big pri" id="bPdf">📄 إرسال PDF</button></div></div>'+
    '<div class="box"><h2>الأيام</h2><div class="done-list">';
  b.days.forEach(function(x){
    h+='<div class="it"><span><b>'+dayName(x.date)+' '+fmtDate(x.date)+'</b>'+(x.cur?' <span class="muted">(اليوم الحالي)</span>':'')+
       '<br><span class="muted">'+x.piles+' بايل · '+x.meters+' م · '+x.conc+' m3 كونكريت · '+x.mortar+' m3 مورتر'+'</span></span></div>';
  });
  h+='</div></div>';
  app.innerHTML=h;
  document.getElementById("back").onclick=function(){view="blocks";render()};
  document.getElementById("bPrint").onclick=function(){printPages(blockPages(b),"block_"+b.label,function(){blockPdf(b)})};
  document.getElementById("bPdf").onclick=function(){blockPdf(b)};
}
function blockPdf(b){pdfPages(function(){return blockPages(b)},"block_"+String(b.label).replace(/[^\w-]/g,"")+".pdf","ملخص بلوك "+b.label)}
function blockPages(b){
  var s=S.settings;
  function row(ar,en,v){return '<tr style="height:48px"><td style="font-size:14px;font-weight:700;width:30%" class="blue">'+en+'</td><td style="font-size:22px;font-weight:700">'+v+'</td><td style="font-size:15px;font-weight:700;width:30%" class="blue" dir="rtl">'+ar+'</td></tr>'}
  var h='<div class="sheet page" style="width:'+PAGE_W+'px"><table dir="ltr">'+
   '<tr><td class="logo" style="height:50px;width:30%">SATCON</td><td class="ttl" dir="rtl">'+esc(s.project)+'</td><td style="width:30%"><b>Block Summary</b><br><span dir="rtl">ملخص بلوك</span></td></tr>'+
   '</table><table dir="ltr" style="margin-top:12px">'+
   row("رقم البلوك","Block nb.",esc(b.label))+
   row("من تاريخ","From",fmtDate(b.first))+
   row("إلى تاريخ","To",fmtDate(b.last))+
   row("عدد أيام العمل","Working days",b.nDays)+
   row("عدد البايلات","Nb. of piles",b.piles)+
   row("مجموع الأمتار (m)","Total meters (m)",b.meters)+
   row("كمية الكونكريت (m3)","Concrete (m3)",b.conc)+
   row("كمية المورتر (m3)","Mortar (m3)",b.mortar)+
   '</table></div>';
  return [h];
}

setInterval(function(){if(view==="main"&&activePause(S.cur)&&!M.classList.contains("show")){
  var a=document.activeElement;if(!a||a.tagName!=="INPUT")render();
}},60000);

render();
