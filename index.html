<!DOCTYPE html>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>التقرير اليومي - SATCON</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#eef1f6;color:#1d2433;font-size:16px}
header.top{background:#2b3a67;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0}
header.top .d{font-size:14px;opacity:.85}
main{padding:12px;max-width:680px;margin:0 auto}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:16px;margin:0 0 10px;color:#2b3a67}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{min-width:110px;font-size:14px;color:#555}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{font:inherit;padding:10px;border:1px solid #c8cfdb;border-radius:8px;flex:1;min-width:0;background:#fff}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:#dfe5f0;color:#1d2433}
button:active{transform:scale(.97)}
.big{width:100%;padding:16px;font-size:18px;font-weight:600}
.pri{background:#2f6fd6;color:#fff}
.ok{background:#1f9d55;color:#fff}
.warn{background:#e08a00;color:#fff}
.dan{background:#d64545;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:#f3f6fb;border-radius:8px;padding:8px 4px}
.stat b{display:block;font-size:20px;color:#2b3a67}
.stat span{font-size:12px;color:#666}
.tm{font-size:13px;color:#555;margin-top:4px;text-align:center}
.paused{background:#fff4e0;border:2px solid #e08a00}
.card{border:2px solid #2f6fd6}
.card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card .hd b{font-size:18px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{padding:10px 6px;text-align:center;line-height:1.3;font-size:14px;background:#eef1f6;color:#888}
.step .t{display:block;font-size:20px;font-weight:700}
.step.done{background:#d8f0e1;color:#14532d}
.step.next{background:#2f6fd6;color:#fff;box-shadow:0 0 0 3px #b7cdf3}
.hint{font-size:12px;color:#777;margin:6px 0 0}
.done-list .it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.done-list .it:last-child{border:0}
.small{padding:8px 10px;font-size:14px}
.zb{width:44px;height:44px;padding:0;font-size:22px;font-weight:700;background:rgba(43,58,103,.88);color:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.muted{color:#888;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .in{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#printArea{display:none}

/* ===== print sheet ===== */
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  header.top,main,.modal{display:none!important}
  #printArea{display:block}
}
.sheet{font-family:Arial,Tahoma,sans-serif;color:#000;width:100%;font-size:12px}
.sheet table{border-collapse:collapse;width:100%}
.sheet td,.sheet th{border:1px solid #1f2a5a;padding:3px 4px;text-align:center;height:26px}
.sheet .blue{background:#5b9bd5;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .logo{background:#2b3a67;color:#fff;font-size:20px;letter-spacing:4px;font-weight:300;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{font-size:16px;font-weight:700}
.sheet .grid th{font-weight:700;font-size:11px}
.sheet .grid td{font-size:15px;padding:0 4px}
.sheet .grid td.nt{font-size:12px;line-height:1.2}
.sheet .pgno{text-align:center;font-size:11px;margin-top:4px}
@media print{
  .pp{width:733px;height:1062px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .sheet.page{position:absolute;top:0;left:0;height:733px;transform-origin:top left;transform:translateX(733px) rotate(90deg)}
  .pp.a3{width:1062px;height:1527px}
  .pp.a3 .sheet.page{height:1062px;transform:translateX(1062px) rotate(90deg)}
}
.sheet .foot{margin-top:6px;text-align:right;font-size:11px}
</style>
</head>

/* translate Arabic phrases in an html string for en/fr (Arabic is the source text) */
function trs(html,l){if(!html||l==="ar")return html;var i=l==="en"?1:2;
  html=html.replace(/(\d) ص(?![\u0600-\u06FF])/g,"$1 AM").replace(/(\d) م(?![\u0600-\u06FF])/g,"$1 PM").replace(/(\d) د(?![\u0600-\u06FF])/g,"$1 min");
  DICT.forEach(function(p){if(html.indexOf(p[0])>=0)html=html.split(p[0]).join(p[i])});return html}
/* translate the text on screen (after each render and in dialogs) */
function applyLang(root){if(!root)return;document.documentElement.lang=LANG;document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  if(LANG==="ar")return;var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n;
  while((n=w.nextNode())){if(/[\u0600-\u06FF]/.test(n.nodeValue)){var v=trs(n.nodeValue,LANG);if(v!==n.nodeValue)n.nodeValue=v}}}

}

function ensureUids(){if(!S)return;[S.cur].concat(S.editing&&S.editing.held?[S.editing.held]:[],S.archive||[]).forEach(function(d){if(d&&!d.uid)d.uid=uidNew()});S.plans=S.plans||{}}

}

function parseTyped(str){var p=String(str).trim().replace(/[٠-٩]/g,function(c){return"٠١٢٣٤٥٦٧٨٩".indexOf(c)}).split(/[\/\-\.\s]+/).filter(function(x){return x});
  if(!p.length||p.length>3)return null;var now=new Date(),d=+p[0],m=p.length>1?+p[1]:now.getMonth()+1,y=p.length>2?+p[2]:now.getFullYear();
  if(y<100)y+=2000;if(!(d>=1&&d<=31&&m>=1&&m<=12))return null;var dt=new Date(y,m-1,d);if(dt.getDate()!==d)return null;return isoDate(dt)}
function pad(n){return(n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hm(ts){if(!ts)return"";var d=new Date(ts),h=d.getHours(),ap=h<12?"ص":"م";h=h%12||12;return h+":"+pad(d.getMinutes())+" "+ap}
function hm24(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dayName(iso){var p=iso.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return DAYS[d.getDay()]}
function fmtDate(iso){var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(v){var x=parseFloat(v);return isNaN(x)?0:x}

function delayMs(day){
  var t=0,now=Date.now();
  day.pauses.forEach(function(p){t+=(p.end||now)-p.start});
  return t;
}
function delayHours(day){return Math.round(delayMs(day)/360000)/10}
/* delay as hours and minutes, e.g. 2 ساعة و 5 دقيقة */
function delayTxtMs(ms){var m=Math.round(ms/60000);return Math.floor(m/60)+':'+pad(m%60)}

/* long press */
function bindPress(el,tap,long){
  if(!el)return;
  var t=null,fired=false;
  function start(){fired=false;t=setTimeout(function(){fired=true;long()},600)}
  function end(e){clearTimeout(t);if(!fired&&e.type!=="pointerleave"&&e.type!=="pointercancel")tap()}
  el.addEventListener("pointerdown",start);
  el.addEventListener("pointerup",end);
  el.addEventListener("pointerleave",function(e){clearTimeout(t)});
  el.addEventListener("pointercancel",function(e){clearTimeout(t)});
  el.addEventListener("contextmenu",function(e){e.preventDefault()});
}

function cleanTxt(t){return String(t||"").replace(/\\[A-Za-z][^;\\{}]*;/g,"").replace(/\\P/g," ").replace(/[{}]/g,"").replace(/%%[cC]/g,"Ø").trim()}
/* turn the DWG database into piles + background drawing */
function extractPlan(db){
  var E=db.entities||[],circles=[],texts=[],out={lines:[],polys:[],circ:[],arcs:[],txt:[]};
  E.forEach(function(e){
    if(e.type==="CIRCLE")circles.push(e);
    else if(e.type==="TEXT"&&e.startPoint)texts.push({t:cleanTxt(e.text),x:e.startPoint.x,y:e.startPoint.y,h:e.textHeight||0});
    else if(e.type==="MTEXT"&&e.insertionPoint)texts.push({t:cleanTxt(e.text),x:e.insertionPoint.x,y:e.insertionPoint.y,h:e.textHeight||0,m:1});
  });
  /* a pile = a circle with a number written inside it */
  var num=texts.filter(function(t){return /^\d+[A-Za-z]?$/.test(t.t)}),pairs=[];
  num.forEach(function(t){var cx=t.x+t.t.length*t.h*0.35,cy=t.y+t.h/2,best=null,bd=1e18;
    circles.forEach(function(c){var d=Math.hypot(c.center.x-cx,c.center.y-cy);if(d<c.radius*1.2&&d<bd){bd=d;best=c}});
    if(best)pairs.push({t:t,c:best})});
  if(!pairs.length)return null;
  var rc={};pairs.forEach(function(p){var r=p.c.radius.toFixed(3);rc[r]=(rc[r]||0)+1});
  var R=+Object.keys(rc).sort(function(a,b){return rc[b]-rc[a]})[0];
  var used={},piles=[],seen={},dup=[];
  pairs.forEach(function(p){if(Math.abs(p.c.radius-R)>R*0.02||used[p.c.handle])return;used[p.c.handle]=1;
    if(seen[p.t.t]){dup.push(p.t.t);return}seen[p.t.t]=1;piles.push({n:p.t.t,x:p.c.center.x,y:p.c.center.y})});
  var extra=circles.filter(function(c){return Math.abs(c.radius-R)<=R*0.02&&!used[c.handle]}).map(function(c){return[c.center.x,c.center.y]});
  var minx=1e18,miny=1e18,maxx=-1e18,maxy=-1e18;piles.forEach(function(p){minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y)});
  var m=Math.max(maxx-minx,maxy-miny)*0.12+R*4;minx-=m;miny-=m;maxx+=m;maxy+=m;
  function inb(x,y){return x>=minx&&x<=maxx&&y>=miny&&y<=maxy}
  function X(x){return Math.round((x-minx)*100)/100}function Y(y){return Math.round((maxy-y)*100)/100}
  E.forEach(function(e){
    if(e.type==="LINE"){var a=e.startPoint,b=e.endPoint;if(inb(a.x,a.y)||inb(b.x,b.y))out.lines.push([X(a.x),Y(a.y),X(b.x),Y(b.y)])}
    else if(e.type==="LWPOLYLINE"&&e.vertices&&e.vertices.length){var v=e.vertices,any=false,pts=[];v.forEach(function(q){if(inb(q.x,q.y))any=true;pts.push(X(q.x),Y(q.y))});
      if(any){if(e.flag&1)pts.push(pts[0],pts[1]);out.polys.push(pts)}}
    else if(e.type==="CIRCLE"&&Math.abs(e.radius-R)>R*0.02&&inb(e.center.x,e.center.y))out.circ.push([X(e.center.x),Y(e.center.y),Math.round(e.radius*100)/100]);
    else if(e.type==="ARC"&&e.center&&inb(e.center.x,e.center.y))out.arcs.push([X(e.center.x),Y(e.center.y),e.radius,e.startAngle,e.endAngle]);
  });
  texts.forEach(function(t){if(/^\d+[A-Za-z]?$/.test(t.t)||!t.t||t.t.length>14||!inb(t.x,t.y))return;out.txt.push([X(t.x),Y(t.y),Math.round(Math.max(t.h,R*0.5)*100)/100,t.t])});
  return{R:R,w:X(maxx),h:Y(miny),piles:piles.map(function(p){return{n:p.n,x:X(p.x),y:Y(p.y)}}),extra:extra.map(function(q){return[X(q[0]),Y(q[1])]}),geo:out,dup:dup};
}
/* drawing units are metres; draw at K× so SVG text never falls under a browser's minimum font size */
var PK=100;

function planSvg(pl,done,opts){opts=opts||{};
  function q(v){return Math.round(v*PK*10)/10}
  var R=pl.R,g=pl.geo,sw=q(R*0.06),rot=opts.rot||0,D=planDims(pl,rot),W=q(pl.w),H=q(pl.h);

  var o='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+(opts.vb||('0 0 '+D.w+' '+D.h))+'" '+(opts.attrs||'')+'><rect width="'+D.w+'" height="'+D.h+'" fill="#fff"/><g transform="'+tf+'"><g stroke="#9aa3b5" stroke-width="'+sw+'" fill="none">';
  g.lines.forEach(function(l){o+='<line x1="'+q(l[0])+'" y1="'+q(l[1])+'" x2="'+q(l[2])+'" y2="'+q(l[3])+'"/>'});
  g.polys.forEach(function(p){var s2=[];for(var i=0;i<p.length;i+=2)s2.push(q(p[i])+","+q(p[i+1]));o+='<polyline points="'+s2.join(" ")+'"/>'});
  g.circ.forEach(function(c){o+='<circle cx="'+q(c[0])+'" cy="'+q(c[1])+'" r="'+q(c[2])+'"/>'});
  o+='</g><g fill="#7a8399" font-family="Arial" text-anchor="start">';
  g.txt.forEach(function(t){var x=q(t[0]),y=q(t[1]);o+='<text x="'+x+'" y="'+y+'" font-size="'+q(t[2])+'"'+un(x,y)+'>'+esc(t[3])+'</text>'});
  o+='</g><g stroke="#bbb" stroke-width="'+sw+'" fill="#f1f1f1">';
  pl.extra.forEach(function(e){o+='<circle cx="'+q(e[0])+'" cy="'+q(e[1])+'" r="'+q(R)+'"/>'});
  o+='</g><g font-family="Arial" text-anchor="middle" font-weight="700">';
  var opn=opts.open||{},r=q(R),k=q(R*0.62);
  pl.piles.forEach(function(p){var d=!!done[p.n],x=q(p.x),y=q(p.y);
    o+='<g data-pile="'+esc(p.n)+'">'+(opn[p.n]&&!d?'<circle cx="'+x+'" cy="'+y+'" r="'+q(R*1.4)+'" fill="none" stroke="#e08a00" stroke-width="'+q(R*0.22)+'"/>':'')+(d?'<circle cx="'+x+'" cy="'+y+'" r="'+q(R*0.93)+'" fill="#fff" stroke="#16a34a" stroke-width="'+q(R*0.3)+'"/>':
         '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#fff" stroke="#2b3a67" stroke-width="'+q(R*0.1)+'"/>')+
      '<text x="'+x+'" y="'+q(p.y+R*0.32)+'" font-size="'+q(R*(p.n.length>2?(d?0.66:0.78):(d?0.8:0.95)))+'" fill="'+(d?'#000':'#2b3a67')+'"'+un(x,y)+'>'+esc(p.n)+'</text></g>'});
  return o+'</g></g></svg>';
}

/* the drawing's real extent (piles, lines, labels), so blank margins around it are cut for printing */
function planBox(pl){var g=pl.geo||{},R=pl.R||0,x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  function add(x,y){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  (g.lines||[]).forEach(function(l){add(l[0],l[1]);add(l[2],l[3])});
  (g.polys||[]).forEach(function(p){for(var i=0;i+1<p.length;i+=2)add(p[i],p[i+1])});
  (g.circ||[]).forEach(function(c){add(c[0]-c[2],c[1]-c[2]);add(c[0]+c[2],c[1]+c[2])});
  (g.txt||[]).forEach(function(t){add(t[0],t[1])});
  (pl.piles||[]).forEach(function(p){add(p.x-R,p.y-R);add(p.x+R,p.y+R)});
  (pl.extra||[]).forEach(function(e){add(e[0]-R,e[1]-R);add(e[0]+R,e[1]+R)});
  if(!isFinite(x0))return{x:0,y:0,w:pl.w,h:pl.h};
  var m=R*2;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(pl.w,x1+m);y1=Math.min(pl.h,y1+m);
  return{x:x0,y:y0,w:x1-x0,h:y1-y0}}
function planPages(key,a3){var pl=S.plans[key],st=planStats(key),PW=a3?A3_W:PAGE_W,PH=a3?A3_H:PAGE_H;
  var head=planHead(key,st),bx=planBox(pl);
  var availH=PH-110,availW=PW,sc=Math.min(availW/bx.w,availH/bx.h);
  var vb=[bx.x*PK,bx.y*PK,bx.w*PK,bx.h*PK].join(" ");
  return['<div class="sheet page" style="width:'+PW+'px">'+head+'<div style="text-align:center;margin-top:6px">'+planSvg(pl,st.dn,{vb:vb,attrs:'width="'+Math.floor(bx.w*sc)+'" height="'+Math.floor(bx.h*sc)+'"'})+'</div></div>'];
}
/* print only: plan at 1.5x/2x/3x, cut into several sheets (tiles), each with its own page number */
function planZoomPages(key,a3,z){
  var pl=S.plans[key],st=planStats(key),PW=a3?A3_W:PAGE_W,PH=a3?A3_H:PAGE_H;
  var head=planHead(key,st),availW=PW,availH=PH-130;
  var sc0=Math.min(availW/pl.w,availH/pl.h),sc=sc0*z;
  var nx=Math.ceil(pl.w*sc/availW),ny=Math.ceil(pl.h*sc/availH),total=nx*ny,out=[],n=0;
  var vbPerPx=PK/sc;
  for(var j=0;j<ny;j++)for(var i=0;i<nx;i++){n++;
    var vb=[i*availW*vbPerPx,j*availH*vbPerPx,availW*vbPerPx,availH*vbPerPx].join(" ");
    out.push('<div class="sheet page" style="width:'+PW+'px">'+head+'<div style="text-align:center;margin-top:6px">'+
      planSvg(pl,st.dn,{vb:vb,attrs:'width="'+availW+'" height="'+availH+'"'})+'</div><div class="pgno">صفحة '+n+' من '+total+'</div></div>');
  }
  return out;
}

function dayList(s){var o=[],seen={};[s.cur].concat(s.editing&&s.editing.held?[s.editing.held]:[],s.archive||[]).forEach(function(d){if(d&&d.uid&&!seen[d.uid]){seen[d.uid]=1;o.push(d)}});return o}
function flat(s){var o={},k;

function unflat(o){var r={settings:{},days:[],plans:{}},k,p,v;

      else if(p[0]==="d")r.days.push(JSON.parse(v));

function sortArch(a){return a.sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:0})}
/* put the shared data back into S, keeping this phone's own current day (and the day put aside while editing) */
function rebuild(map){var r=unflat(map),by={},cu=S.cur&&S.cur.uid,hu=S.editing&&S.editing.held&&S.editing.held.uid;

  if(S.editing){if(by[hu]){S.editing.held=by[hu];delete by[hu]}else{S.editing.held=blankDay()}}

function pendN(){return Object.keys(PEND).length}
window.__syncPush=function(){if(!SY.code||!base)return;var now=flat(S),k,ch=0;

function flush(){if(!ready)return;var keys=Object.keys(PEND).filter(function(k){var v=k in base?base[k]:null;return!(k in inflight)||inflight[k]!==v});
  var parts=[],cur=[],size=0;keys.forEach(function(k){var l=(base[k]||"").length;if(cur.length&&(cur.length>=400||size+l>3000000)){parts.push(cur);cur=[];size=0}cur.push(k);size+=l});if(cur.length)parts.push(cur);
  parts.forEach(function(part){var b=fb.writeBatch(db),sent={};
    part.forEach(function(k){var v=k in base?base[k]:null;sent[k]=v;inflight[k]=v;b.set(fb.doc(col,did(k)),{v:v,t:fb.serverTimestamp(),by:SY.dev})});
    b.commit().then(function(){part.forEach(function(k){var v=k in base?base[k]:null;if(inflight[k]===sent[k])delete inflight[k];if(v===sent[k])delete PEND[k]});savePend();updBadge()})
     .catch(function(e){part.forEach(function(k){if(inflight[k]===sent[k])delete inflight[k]});st.err=String(e&&e.code||e);updBadge()})});

function listen(){if(unsub){unsub();unsub=null}

      var x=d.data(),t=x.t&&x.t.toMillis?x.t.toMillis():0,k=decodeURIComponent(d.id);if(t>inboxLast)inboxLast=t;
