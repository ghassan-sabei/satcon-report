<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3a67">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>دوام العمال - SATCON</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#eef1f6;color:#1d2433;font-size:16px}
header.top{background:#2b3a67;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0}
header.top .d{font-size:14px;opacity:.85}
main{padding:12px;max-width:680px;margin:0 auto}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:16px;margin:0 0 10px;color:#2b3a67}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{min-width:110px;font-size:14px;color:#555}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{font:inherit;padding:10px;border:1px solid #c8cfdb;border-radius:8px;flex:1;min-width:0;background:#fff}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:#dfe5f0;color:#1d2433}
button:active{transform:scale(.97)}
.big{width:100%;padding:16px;font-size:18px;font-weight:600}
.pri{background:#2f6fd6;color:#fff}
.ok{background:#1f9d55;color:#fff}
.warn{background:#e08a00;color:#fff}
.dan{background:#d64545;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:#f3f6fb;border-radius:8px;padding:8px 4px}
.stat b{display:block;font-size:20px;color:#2b3a67}
.stat span{font-size:12px;color:#666}
.tm{font-size:13px;color:#555;margin-top:4px;text-align:center}
.paused{background:#fff4e0;border:2px solid #e08a00}
.card{border:2px solid #2f6fd6}
.card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card .hd b{font-size:18px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{padding:10px 6px;text-align:center;line-height:1.3;font-size:14px;background:#eef1f6;color:#888}
.step .t{display:block;font-size:20px;font-weight:700}
.step.done{background:#d8f0e1;color:#14532d}
.step.next{background:#2f6fd6;color:#fff;box-shadow:0 0 0 3px #b7cdf3}
.hint{font-size:12px;color:#777;margin:6px 0 0}
.done-list .it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.done-list .it:last-child{border:0}
.small{padding:8px 10px;font-size:14px}
.muted{color:#888;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .in{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#printArea{display:none}

/* ===== print sheet ===== */
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  header.top,main,.modal{display:none!important}
  #printArea{display:block}
}
.sheet{font-family:Arial,Tahoma,sans-serif;color:#000;width:100%;font-size:12px}
.sheet table{border-collapse:collapse;width:100%}
.sheet td,.sheet th{border:1px solid #1f2a5a;padding:3px 4px;text-align:center;height:26px}
.sheet .blue{background:#5b9bd5;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .logo{background:#2b3a67;color:#fff;font-size:20px;letter-spacing:4px;font-weight:300;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{font-size:16px;font-weight:700}
.sheet .grid th{font-weight:700;font-size:11px}
.sheet .grid td{font-size:15px;padding:0 4px}
.sheet .grid td.nt{font-size:12px;line-height:1.2}
.sheet .pgno{text-align:center;font-size:11px;margin-top:4px}
@media print{
  .pp{width:733px;height:1062px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .sheet.page{position:absolute;top:0;left:0;height:733px;transform-origin:top left;transform:translateX(733px) rotate(90deg)}
}
.sheet .foot{margin-top:6px;text-align:right;font-size:11px}
.wk{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.wk:last-child{border:0}
.wk .nm{flex:1;min-width:0}
.wk .nm b{display:block;font-size:16px}
.wk .nm span{font-size:13px;color:#666}
.wk button{padding:10px 8px;font-size:14px;min-width:62px}
.wk .tbtn{display:flex;flex-direction:column;line-height:1.2}
.wk .tbtn small{font-size:12px;font-weight:700}
.abs{background:#fde2e2!important;color:#a12a2a!important}
.navd{display:flex;gap:8px;align-items:center}
.navd input{text-align:center}
.sheet .tight td{height:auto;padding:0 4px;font-size:13px;line-height:1.1}
</style>
</head>
<body>
<header class="top"><h1>دوام العمال</h1><div class="d" id="hdDate"></div></header>
<main id="app"></main>
<div id="printArea"></div>
<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>
<script>
(function(){
"use strict";
var KEY="satcon_attend_v1";

var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var MONTHS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];

function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s)s={settings:{project:"مشروع مدينة الاخوة السكني - بغداد"},workers:[],nextWid:1,days:{}};return s}
var S=load();
if(!S.machines){S.machines=[{id:1,name:"بوكلن",active:true},{id:2,name:"كرين",active:true}];S.nextMid=3}
if(!S.fuel){S.fuel={opening:0,ins:[],nextIn:1,equip:[],nextEq:1}}
function sigKey(r){return JSON.stringify([r.in||null,r.out||null,r.driver||"",r.diesel||""])}
/* a signature only stays valid for the exact numbers that were signed */
function eqSigKey(r){return JSON.stringify([r.diesel||""])}
function inSigKey(x){return JSON.stringify([x.qty,x.supplier||"",x.receipt||"",x.date])}
function dropStaleSigs(){if(S.fuel)S.fuel.ins.forEach(function(x){if(x.sig&&x.sigFor!==inSigKey(x)){delete x.sig;delete x.sigFor}});
  for(var d in S.days){var mr=S.days[d].mrecs,er=S.days[d].erecs,k,r;
  if(mr)for(k in mr){r=mr[k];if(r.sig&&r.sigFor!==sigKey(r)){delete r.sig;delete r.sigFor}}
  if(er)for(k in er){r=er[k];if(r.sig&&r.sigFor!==eqSigKey(r)){delete r.sig;delete r.sigFor}}}}
function save(){dropStaleSigs();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function sigSvg(sig,h){if(!sig)return"";var W=sig.w,H=sig.h,o='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" style="height:'+h+'px;width:auto;max-width:100%;vertical-align:middle">';
  sig.s.forEach(function(st){var pts=[];for(var i=0;i<st.length;i+=2)pts.push(st[i]+","+st[i+1]);
    o+=(st.length===2?'<circle cx="'+st[0]+'" cy="'+st[1]+'" r="3" fill="#0b2a7a"/>':'<polyline points="'+pts.join(" ")+'" fill="none" stroke="#0b2a7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>')});
  return o+'</svg>'}
function sigPad(title,onSave){
  openModal('<h3>'+esc(title)+'</h3><canvas id="sgC" style="width:100%;height:200px;border:2px dashed #9aa6bf;border-radius:10px;background:#fff;touch-action:none;display:block"></canvas>'+
    '<p class="hint">وقّع بإصبعك داخل المربع</p><div class="acts"><button id="sgS" class="ok">حفظ</button><button id="sgX">مسح</button><button id="mN">إلغاء</button></div>');
  var c=document.getElementById("sgC"),W=600,H=200,ctx,strokes=[],cur=null;
  var rect=c.getBoundingClientRect();c.width=W;c.height=H;ctx=c.getContext("2d");
  ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0b2a7a";
  function pt(e){var r=c.getBoundingClientRect();return[Math.round((e.clientX-r.left)*W/r.width),Math.round((e.clientY-r.top)*H/r.height)]}
  c.addEventListener("pointerdown",function(e){e.preventDefault();c.setPointerCapture(e.pointerId);var p=pt(e);cur=[p[0],p[1]];strokes.push(cur);ctx.beginPath();ctx.arc(p[0],p[1],2.5,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(p[0],p[1])});
  c.addEventListener("pointermove",function(e){if(!cur)return;var p=pt(e),lx=cur[cur.length-2],ly=cur[cur.length-1];if(Math.abs(p[0]-lx)+Math.abs(p[1]-ly)<3)return;cur.push(p[0],p[1]);ctx.lineTo(p[0],p[1]);ctx.stroke()});
  function up(){cur=null}
  c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
  ctx.fillStyle="#0b2a7a";
  document.getElementById("sgX").onclick=function(){strokes=[];ctx.clearRect(0,0,W,H)};
  document.getElementById("sgS").onclick=function(){if(!strokes.length){c.style.borderColor="#d64545";return}closeModal();onSave({w:W,h:H,s:strokes})};
  document.getElementById("mN").onclick=closeModal;
}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

function pad(n){return(n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseIso(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmtDate(iso){var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function dayName(iso){return DAYS[parseIso(iso).getDay()]}
function hm(ts){if(!ts)return"";var d=new Date(ts),h=d.getHours(),ap=h<12?"ص":"م";h=h%12||12;return h+":"+pad(d.getMinutes())+" "+ap}
function hm24(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dur(min){if(min==null)return"";min=Math.max(0,Math.round(min));return Math.floor(min/60)+":"+pad(min%60)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var curDate=isoDate(new Date());
/* night shift: if yesterday still has workers inside and today is empty, open yesterday */
(function(){var y=parseIso(curDate);y.setDate(y.getDate()-1);var yd=isoDate(y),D=S.days[yd],T=S.days[curDate];
  if(D&&!(T&&Object.keys(T.recs).length)){for(var k in D.recs){var r=D.recs[k];if(r.in&&!r.out&&!r.absent){curDate=yd;break}}}})();
function dayRec(date,create){if(!S.days[date]){if(!create)return null;S.days[date]={recs:{}}}return S.days[date]}
function rec(date,wid,create){var d=dayRec(date,create);if(!d)return null;if(!d.recs[wid]){if(!create)return null;d.recs[wid]={in:null,out:null,absent:false,note:""}}return d.recs[wid]}
function worked(r){if(!r||r.absent||!r.in||!r.out)return null;return(r.out-r.in)/60000}
function machineById(id){for(var i=0;i<S.machines.length;i++)if(S.machines[i].id===id)return S.machines[i];return null}
function mrec(date,mid,create){var d=dayRec(date,create);if(!d)return null;if(!d.mrecs){if(!create)return null;d.mrecs={}}if(!d.mrecs[mid]){if(!create)return null;d.mrecs[mid]={in:null,out:null,note:""}}return d.mrecs[mid]}
function dayMachines(date){var d=dayRec(date,false),ids={},list=[];
  S.machines.forEach(function(m){if(m.active!==false){ids[m.id]=1;list.push(m)}});
  if(d&&d.mrecs)Object.keys(d.mrecs).forEach(function(k){var id=+k;if(!ids[id]){var m=machineById(id);if(m){ids[id]=1;list.push(m)}}});
  return list}
function parseTyped(str){var p=String(str).trim().replace(/[٠-٩]/g,function(c){return"٠١٢٣٤٥٦٧٨٩".indexOf(c)}).split(/[\/\-\.\s]+/).filter(function(x){return x});
  if(!p.length||p.length>3)return null;var now=new Date(),d=+p[0],m=p.length>1?+p[1]:now.getMonth()+1,y=p.length>2?+p[2]:now.getFullYear();
  if(y<100)y+=2000;if(!(d>=1&&d<=31&&m>=1&&m<=12))return null;var dt=new Date(y,m-1,d);if(dt.getDate()!==d)return null;return isoDate(dt)}
function blockFor(date){if(S.days[date]&&S.days[date].block!=null)return S.days[date].block;
  var ks=Object.keys(S.days).filter(function(k){return k<date&&S.days[k].block}).sort();return ks.length?S.days[ks[ks.length-1]].block:""}
function workerById(id){for(var i=0;i<S.workers.length;i++)if(S.workers[i].id===id)return S.workers[i];return null}
function dayWorkers(date){
  var d=dayRec(date,false),ids={},list=[];
  S.workers.forEach(function(w){if(w.active!==false){ids[w.id]=1;list.push(w)}});
  if(d)Object.keys(d.recs).forEach(function(k){var id=+k;if(!ids[id]){var w=workerById(id);if(w){ids[id]=1;list.push(w)}}});
  return list;
}

/* ---------- modal ---------- */
var M=document.getElementById("modal"),MI=document.getElementById("modalIn");
function openModal(h){MI.innerHTML=h;M.classList.add("show")}
function closeModal(){M.classList.remove("show");MI.innerHTML=""}
M.addEventListener("click",function(e){if(e.target===M)closeModal()});
function confirmBox(msg,yes,cb){
  openModal('<h3>'+esc(msg)+'</h3><div class="acts"><button id="mY" class="dan">'+esc(yes)+'</button><button id="mN">إلغاء</button></div>');
  document.getElementById("mY").onclick=function(){closeModal();cb()};document.getElementById("mN").onclick=closeModal;
}
/* time picker; base = the record's day; returns timestamp on that day */
function timeEdit(title,ts,baseDate,cb){
  var v=ts?hm24(ts):hm24(Date.now());
  openModal('<h3>'+esc(title)+'</h3><input type="time" id="mT" value="'+v+'" style="width:100%;font-size:22px;direction:ltr">'+
   '<div class="acts"><button id="mS" class="pri">حفظ</button>'+(ts?'<button id="mC" class="dan">مسح</button>':'')+'<button id="mN">إلغاء</button></div>');
  document.getElementById("mS").onclick=function(){var val=document.getElementById("mT").value;if(!val)return;
    var b=parseIso(baseDate),p=val.split(":");b.setHours(+p[0],+p[1],0,0);closeModal();cb(b.getTime())};
  if(ts)document.getElementById("mC").onclick=function(){closeModal();cb(null)};
  document.getElementById("mN").onclick=closeModal;
}
function bindPress(el,tap,long){
  var t=null,fired=false;
  el.addEventListener("pointerdown",function(){fired=false;t=setTimeout(function(){fired=true;long()},600)});
  el.addEventListener("pointerup",function(){clearTimeout(t);if(!fired)tap()});
  el.addEventListener("pointerleave",function(){clearTimeout(t)});
  el.addEventListener("pointercancel",function(){clearTimeout(t)});
  el.addEventListener("contextmenu",function(e){e.preventDefault()});
}
/* exit must be after entry; an earlier clock time means after midnight */
function fixOut(r){if(r.in&&r.out){while(r.out<=r.in)r.out+=86400000;while(r.out-r.in>86400000)r.out-=86400000}}

/* ---------- views ---------- */
var view="day",monthSel=curDate.slice(0,7),mFrom=null,mTo=null;
function render(){
  document.getElementById("hdDate").textContent=dayName(isoDate(new Date()))+" "+fmtDate(isoDate(new Date()));
  var app=document.getElementById("app");
  if(view==="workers")return renderWorkers(app);
  if(view==="month")return renderMonth(app);
  if(view==="settings")return renderSettings(app);
  if(view==="fuel")return renderFuel(app);
  renderDay(app);
}

function renderDay(app){
  var ws=dayWorkers(curDate),pres=0,abs=0,ot=0;
  ws.forEach(function(w){var r=rec(curDate,w.id,false);if(r){if(r.absent)abs++;else if(r.in)pres++;var k=worked(r);if(k)ot+=k}});
  var h='<div class="box"><div class="navd"><button id="prev">→</button><input type="date" id="dPick" value="'+curDate+'"><button id="next">←</button></div>'+
    '<div class="tm" style="font-size:15px;margin-top:8px"><b>'+dayName(curDate)+'</b> '+fmtDate(curDate)+(curDate===isoDate(new Date())?' (اليوم)':'')+'</div>'+
    '<div class="row" style="margin:10px 0 0"><input type="text" id="dFind" inputmode="numeric" placeholder="🔍 التاريخ: 13-11"><button class="pri" id="dGo">اذهب</button></div>'+
    '<div class="row" style="margin:10px 0 0"><label>رقم البلوك</label><input type="text" id="dBlock" value="'+esc(blockFor(curDate))+'"></div></div>';
  if(!S.workers.length){
    h+='<div class="box"><p>ما في عمال بعد. ضيف العمال أول مرة من هون:</p><button class="big pri" id="goW2">+ إضافة عمال</button></div>';
  }else{
    h+='<div class="box"><div class="stat"><div><b>'+pres+'</b><span>حاضر</span></div><div><b>'+abs+'</b><span>غائب</span></div><div><b>'+dur(ot)+'</b><span>مجموع الساعات</span></div></div>'+
       '<button class="big ok" id="allIn" style="margin-top:10px">دخول الكل</button></div>';
    h+='<div class="box"><h2>العمال</h2>';
    ws.forEach(function(w){
      var r=rec(curDate,w.id,false)||{},wk=worked(r);
      var info=r.absent?'<span style="color:#d64545">غائب</span>':(wk!=null?'ساعات '+dur(wk):(r.in?'داخل':''));
      if(r.note)info+=(info?' · ':'')+esc(r.note);
      h+='<div class="wk"><div class="nm" data-note="'+w.id+'"><b>'+esc(w.name)+'</b><span>'+(w.job?esc(w.job)+(info?' · ':''):'')+info+'</span></div>'+
        '<button class="tbtn '+(r.in?'ok':'')+'" data-in="'+w.id+'">دخول<small>'+(r.in?hm(r.in):'')+'</small></button>'+
        '<button class="tbtn '+(r.out?'ok':(r.in&&!r.absent?'pri':''))+'" data-out="'+w.id+'">خروج<small>'+(r.out?hm(r.out):'')+'</small></button>'+
        '<button class="'+(r.absent?'abs':'')+'" data-abs="'+w.id+'">غائب</button></div>';
    });
    h+='<p class="hint">كبسة = الوقت الحالي · ضغطة مطوّلة = تعديل الوقت · كبسة على الاسم = ملاحظة</p></div>';
  }
    var ms=dayMachines(curDate);
    if(ms.length){
      h+='<div class="box"><h2>الآليات</h2>';
      ms.forEach(function(m){var r=mrec(curDate,m.id,false)||{},wk=worked(r);
        h+='<div class="wk" style="border:0;padding-bottom:6px"><div class="nm" data-mnote="'+m.id+'"><b>'+esc(m.name)+'</b><span>'+(wk!=null?'ساعات '+dur(wk):(r.in?'شغّالة':''))+'</span></div>'+
          '<button class="tbtn '+(r.in?'ok':'')+'" data-min="'+m.id+'">بداية<small>'+(r.in?hm(r.in):'')+'</small></button>'+
          '<button class="tbtn '+(r.out?'ok':(r.in?'pri':''))+'" data-mout="'+m.id+'">نهاية<small>'+(r.out?hm(r.out):'')+'</small></button>'+
          '<button class="tbtn '+(r.sig?'ok':'')+'" data-msig="'+m.id+'" style="min-width:70px">'+(r.sig?sigSvg(r.sig,26):'✍️')+'<small>'+(r.sig?'موقّع':'توقيع')+'</small></button></div>'+
          '<div class="row" style="margin:0;gap:6px;padding-bottom:12px;border-bottom:1px solid #eee"><input type="text" data-mdrv="'+m.id+'" placeholder="اسم السائق" value="'+esc(r.driver!=null&&r.driver!==""?r.driver:(r.in?"":(m.lastDriver||"")))+'">'+
          '<input type="number" inputmode="decimal" step="any" data-mdsl="'+m.id+'" placeholder="⛽ المازوت (لتر)" value="'+esc(r.diesel||"")+'"></div>';
      });
      h+='</div>';
    }
    h+='<div class="two" style="margin-bottom:8px"><button class="big ok" id="print">🖨 طباعة</button><button class="big pri" id="pdf">📄 إرسال PDF</button></div>';
  h+='<div class="two" style="margin-bottom:8px"><button class="big" id="goM">📊 الملخص</button><button class="big" id="goF">⛽ المازوت</button></div>'+
     '<div class="two" style="margin-bottom:30px"><button id="goW">العمال</button><button id="goS">الإعدادات</button></div>';
  app.innerHTML=h;

  function setDate(d){curDate=d;render()}
  function go(){var inp=document.getElementById("dFind"),d=parseTyped(inp.value);if(!d){inp.style.borderColor="#d64545";return}setDate(d)}
  document.getElementById("dGo").onclick=go;
  document.getElementById("dFind").onkeydown=function(e){if(e.key==="Enter")go()};

/* ================= fuel ================= */
function num2(v){var x=parseFloat(v);return isNaN(x)?0:x}
function lit(v){return(Math.round(v*100)/100).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function eqById(id){for(var i=0;i<S.fuel.equip.length;i++)if(S.fuel.equip[i].id===id)return S.fuel.equip[i];return null}
function erec(date,eid,create){var d=dayRec(date,create);if(!d)return null;if(!d.erecs){if(!create)return null;d.erecs={}}if(!d.erecs[eid]){if(!create)return null;d.erecs[eid]={diesel:""}}return d.erecs[eid]}
/* sums over [from,to] (inclusive); beforeOnly=true means all dates < to */
function inRange(d,from,to,beforeOnly){return beforeOnly?d<to:((!from||d>=from)&&(!to||d<=to))}
function sumIn(from,to,beforeOnly){var t=0;S.fuel.ins.forEach(function(x){if(inRange(x.date,from,to,beforeOnly))t+=num2(x.qty)});return t}
function consumers(from,to,beforeOnly){var m={},e={};
  Object.keys(S.days).forEach(function(d){if(!inRange(d,from,to,beforeOnly))return;var D=S.days[d];
    if(D.mrecs)for(var k in D.mrecs){var q=num2(D.mrecs[k].diesel);if(q)m[k]=(m[k]||0)+q}
    if(D.erecs)for(var k2 in D.erecs){var q2=num2(D.erecs[k2].diesel);if(q2)e[k2]=(e[k2]||0)+q2}});
  return{m:m,e:e}}
function sumOut(from,to,beforeOnly){var c=consumers(from,to,beforeOnly),t=0;for(var k in c.m)t+=c.m[k];for(var j in c.e)t+=c.e[j];return t}
function balanceAt(date){return num2(S.fuel.opening)+sumIn(null,date,false)-sumOut(null,date,false)}
var fFrom=null,fTo=null;

function fuelPages(from,to){

  var open=balanceAt(isoDate(prev)),inQ=sumIn(from,to),c=consumers(from,to),outQ=sumOut(from,to),close=open+inQ-outQ;

  var cons=[];S.machines.forEach(function(m){if(c.m[m.id])cons.push([m.name,c.m[m.id]])});

/* ---------- monthly summary ---------- */
function rangeStats(from,to){
  var rows={},order=[];if(from>to){var t=from;from=to;to=t}
  Object.keys(S.days).filter(function(d){return d>=from&&d<=to}).sort().forEach(function(d){
    var recs=S.days[d].recs;
    Object.keys(recs).forEach(function(k){var r=recs[k],id=+k;
      if(!r.absent&&!r.in)return;
      if(!rows[id]){rows[id]={w:workerById(id),pres:0,abs:0,min:0,pay:{},open:0};order.push(id)}
      var x=rows[id];
      if(r.absent){x.abs++;return}
      x.pres++;var wk=worked(r);if(wk==null){x.open++;return}x.min+=wk;
    });
  });
  var list=order.map(function(id){return rows[id]}).filter(function(x){return x.w});
  var idx={};S.workers.forEach(function(w,i){idx[w.id]=i});
  list.sort(function(a,b){return idx[a.w.id]-idx[b.w.id]});
  return list;
}

/* ---------- sheets (12 workers per page) ---------- */
var PAGE_W=1062,PAGE_H=733,PER=12,ROW_H=40;
function headTable(title,en,dateTxt,extra){
  return '<table dir="ltr">'+
   '<tr><td class="logo" style="height:44px;width:22%">SATCON</td><td class="ttl" dir="rtl">'+esc(S.settings.project)+'</td><td style="width:22%"><b>'+en+'</b><br><span dir="rtl">'+title+'</span></td></tr>'+
   '<tr><td><b>'+(extra?extra[0]:'Day and Date')+'</b></td><td>'+dateTxt+'</td><td dir="rtl"><b>'+(extra?extra[1]:'اليوم والتاريخ')+'</b></td></tr></table>';
}
function paginate(rows,head,cols,totalRow,tail,rowH){
  rowH=rowH||ROW_H;
  var n=Math.max(1,Math.ceil(rows.length/PER)),pages=[];
  for(var p=0;p<n;p++){
    var h='<div class="sheet page" style="width:'+PAGE_W+'px">'+head+'<table class="grid" dir="rtl" style="margin-top:-1px"><tr>'+cols+'</tr>';
    for(var i=p*PER;i<(p+1)*PER;i++){
      h+='<tr style="height:'+rowH+'px">'+(rows[i]!=null?rows[i](i+1):'<td>'+(i+1)+'</td>'+new Array(cols.split("<th").length-1).join('<td></td>'))+'</tr>';
    }
    if(totalRow&&p===n-1)h+=totalRow;
    h+='</table>'+(tail&&p===n-1?tail:'')+(n>1?'<div class="pgno">'+(p+1)+' / '+n+'</div>':'')+'</div>';
    pages.push(h);
  }
  return pages;
}

    tail+='</table>';
  }
  var used=150+(ms.length?36+ms.length*MROW:0)+22;
  var rh=Math.max(24,Math.min(ROW_H,Math.floor((PAGE_H-used)/PER)));
  return paginate(rows,head,cols,null,tail,rh);
}
function rangePages(from,to){
  if(from>to){var t=from;from=to;to=t}
  var list=rangeStats(from,to),tp=0,ta=0,tm=0;
  var rows=list.map(function(x){tp+=x.pres;ta+=x.abs;tm+=x.min;
    return function(n){return '<td>'+n+'</td><td style="text-align:right;padding-right:8px">'+esc(x.w.name)+'</td><td>'+esc(x.w.job||"")+'</td><td>'+x.pres+'</td><td>'+x.abs+'</td><td><b>'+dur(x.min)+'</b></td>'}});
  var head=headTable("ملخص دوام","Attendance Summary",'من '+fmtDate(from)+' &nbsp; إلى '+fmtDate(to),["Period","الفترة"]);
  var cols='<th style="width:5%">العدد</th><th style="width:24%">الاسم</th><th style="width:13%">المهنة</th><th>أيام الحضور</th><th>أيام الغياب</th><th>مجموع الساعات</th>';
  var total='<tr style="height:'+ROW_H+'px;font-weight:700;background:#dde8f6"><td colspan="3">المجموع</td><td>'+tp+'</td><td>'+ta+'</td><td>'+dur(tm)+'</td></tr>';
  return paginate(rows,head,cols,total);
}
function machineRange(mid,from,to){var days=0,min=0,dsl=0,blocks=[],drivers=[];
  if(from>to){var t=from;from=to;to=t}
  Object.keys(S.days).filter(function(d){return d>=from&&d<=to}).sort().forEach(function(d){var r=S.days[d].mrecs&&S.days[d].mrecs[mid];
    if(!r)return;dsl+=parseFloat(r.diesel)||0;if(!r.in)return;days++;var wk=worked(r);if(wk)min+=wk;
    var bl=blockFor(d);if(bl&&blocks.indexOf(bl)<0)blocks.push(bl);if(r.driver&&drivers.indexOf(r.driver)<0)drivers.push(r.driver)});
  return{days:days,min:min,diesel:Math.round(dsl*100)/100,blocks:blocks,drivers:drivers,from:from,to:to}}
function machinePages(mid,from,to){var m=machineById(mid),st=machineRange(mid,from,to);
  function row(ar,en,v){return '<tr style="height:50px"><td style="font-size:14px;font-weight:700;width:30%" class="blue">'+en+'</td><td style="font-size:20px;font-weight:700">'+v+'</td><td style="font-size:15px;font-weight:700;width:30%" class="blue" dir="rtl">'+ar+'</td></tr>'}
  var h='<div class="sheet page" style="width:'+PAGE_W+'px"><table dir="ltr">'+
   '<tr><td class="logo" style="height:50px;width:30%">SATCON</td><td class="ttl" dir="rtl">'+esc(S.settings.project)+'</td><td style="width:30%"><b>Machine Summary</b><br><span dir="rtl">ملخص آلية</span></td></tr>'+
   '</table><table dir="ltr" style="margin-top:12px">'+
   row("الآلية","Machine",esc(m.name))+
   row("اسم السائق","Driver",esc(st.drivers.join("، ")))+
   row("من تاريخ","From",fmtDate(st.from))+
   row("إلى تاريخ","To",fmtDate(st.to))+
   row("البلوك","Block nb.",esc(st.blocks.join("، ")))+
   row("عدد أيام العمل","Working days",st.days)+
   row("مجموع الساعات","Total hours",dur(st.min))+
   row("مجموع المازوت (لتر)","Total diesel (L)",st.diesel)+
   '</table></div>';
  return[h]}
function machinePdf(mid,from,to){var m=machineById(mid);pdfPages(function(){return machinePages(mid,from,to)},"machine_"+from+"_"+to+".pdf","ملخص "+m.name)}
function dayPdf(date){pdfPages(function(){return dayPages(date)},"attendance_"+date+".pdf","دوام "+fmtDate(date))}
function rangePdf(from,to){pdfPages(function(){return rangePages(from,to)},"attendance_"+from+"_"+to+".pdf","ملخص دوام")}

/* ---------- print / pdf (same as report app) ---------- */
var NATIVE=!!(window.AndroidBridge&&window.AndroidBridge.isNative);
if(NATIVE){var st=document.createElement("style");st.textContent="@page{size:A4 landscape;margin:8mm}";document.head.appendChild(st)}
function printPages(pages,title,fallback){
  if(NATIVE){document.getElementById("printArea").innerHTML=pages.join("");setTimeout(function(){window.AndroidBridge.print(title)},150);return}
  document.getElementById("printArea").innerHTML=pages.map(function(x){return'<div class="pp">'+x+'</div>'}).join("");
  var opened=false;function mark(){opened=true}
  window.addEventListener("beforeprint",mark,{once:true});
  try{window.print()}catch(e){}
  setTimeout(function(){window.removeEventListener("beforeprint",mark);if(opened)return;
    openModal('<h3>الطباعة المباشرة ما فتحت</h3><p>رح جهّزلك PDF، افتحه بتطبيق PDF واطبع منه.</p><div class="acts"><button id="mS" class="pri">تجهيز PDF</button><button id="mN">إلغاء</button></div>');
    document.getElementById("mS").onclick=function(){closeModal();fallback()};document.getElementById("mN").onclick=closeModal},1500);
}
var LIBS=["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"];
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function pdfPages(makePages,name,title){
  openModal('<h3 style="text-align:center">جاري تجهيز PDF...</h3>');
  var p=window.jspdf&&window.html2canvas?Promise.resolve():Promise.all(LIBS.map(loadScript));
  p.then(function(){
    var pages=makePages(),pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"}),chain=Promise.resolve();
    pages.forEach(function(html,idx){chain=chain.then(function(){
      var box=document.createElement("div");
      box.style.cssText="position:fixed;left:-20000px;top:0;width:"+PAGE_W+"px;height:"+PAGE_H+"px;background:#fff;overflow:hidden";
      box.innerHTML=html;document.body.appendChild(box);
      return window.html2canvas(box,{scale:2,backgroundColor:"#fff",width:PAGE_W,height:PAGE_H}).then(function(cv){
        document.body.removeChild(box);if(idx>0)pdf.addPage("a4","landscape");
        pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",8,8,281,281*PAGE_H/PAGE_W)})})});
    return chain.then(function(){
      if(NATIVE){closeModal();window.AndroidBridge.sharePdf(pdf.output("datauristring").split(",")[1],name);return}
      var blob=pdf.output("blob"),file=new File([blob],name,{type:"application/pdf"});closeModal();
      if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:title}).catch(function(){});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()});
  }).catch(function(){
    openModal('<h3>ما قدر يجهّز PDF</h3><p>'+(window.jspdf?'صار خطأ بتجهيز الملف، جرّب مرة تانية.':'أول مرة لازم يكون في إنترنت حتى ينزّل أدوات الـPDF.')+'</p><div class="acts"><button id="mN">تمام</button></div>');
    document.getElementById("mN").onclick=closeModal});
}

window.__updateReady=function(){
  if(document.getElementById("updBar"))return;
  var b=document.createElement("div");b.id="updBar";
  b.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#1f9d55;color:#fff;padding:12px;display:flex;align-items:center;justify-content:space-between;z-index:60;font-size:15px";
  b.innerHTML='<span>في نسخة جديدة من التطبيق</span><button style="background:#fff;color:#1f9d55;font-weight:700">تحديث الآن</button>';
  b.querySelector("button").onclick=function(){location.reload()};document.body.appendChild(b);
};
render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!NATIVE){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
