plugins { id 'com.android.application' }
android {
    namespace 'com.satcon.report'
    compileSdk 34
    defaultConfig {
        applicationId(System.getenv('APP_ID') ?: 'com.satcon.report')
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '2.' + (System.getenv('VERSION_CODE') ?: '1')
        resValue 'string', 'app_name', (System.getenv('APP_NAME') ?: 'التقرير اليومي')
        buildConfigField 'String', 'REMOTE', '"' + (System.getenv('APP_REMOTE') ?: 'https://ghassan-sabei.github.io/satcon-report/') + '"'
        buildConfigField 'String', 'MARKER', '"' + (System.getenv('APP_MARKER') ?: 'satcon_daily_v1') + '"'
    }
    signingConfigs {
        release {
            storeFile file('../.keys/satcon.jks')
            storePassword 'satconReport2026'
            keyAlias 'satcon'
            keyPassword 'satconReport2026'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
