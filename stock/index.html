<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>المخزن - SATCON</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;direction:rtl;background:#eef1f6;color:#1d2433;font-size:16px}
header.top{background:#0f6b5c;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0;cursor:pointer}
header.top .d{font-size:14px;opacity:.9}
main{padding:12px;max-width:720px;margin:0 auto;padding-bottom:40px}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:16px;margin:0 0 10px;color:#0f6b5c}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row label{min-width:96px;font-size:14px;color:#555}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{font:inherit;padding:10px;border:1px solid #c8cfdb;border-radius:8px;flex:1;min-width:0;background:#fff}
input.bad,select.bad{border-color:#d64545;background:#fff5f5}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:#dfe5f0;color:#1d2433}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
.big{width:100%;padding:16px;font-size:18px;font-weight:600}
.pri{background:#2f6fd6;color:#fff}
.ok{background:#1f9d55;color:#fff}
.dan{background:#d64545;color:#fff}
.bret{background:#7a4fd6;color:#fff}
.bcnt{background:#e08a00;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.small{padding:8px 10px;font-size:14px}
.muted{color:#888;font-size:13px}
.hint{font-size:12px;color:#777;margin:4px 0 0}
.err{color:#d64545;font-size:13px;margin:4px 0 0;min-height:1em}
.it{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #eee;cursor:pointer}
.it:last-child{border:0}
.it .mid{flex:1;min-width:0}
.it .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mid span{font-size:12px;color:#777}
.it .q{font-weight:700;white-space:nowrap;font-size:16px;color:#0f6b5c;text-align:left}
.it .q small{font-weight:400;color:#777;font-size:12px}
.it.neg{background:#fde2e2}
.it.neg .q{color:#c62828}
.tx{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eee;cursor:pointer}
.tx:last-child{border:0}
.tx .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ic.in{background:#d8f0e1;color:#1f9d55}.ic.out{background:#fde2e2;color:#d64545}.ic.ret{background:#e6dcfb;color:#7a4fd6}.ic.adj{background:#ffe9c7;color:#b26a00}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:12px;color:#777}
.tx .am{font-weight:700;white-space:nowrap;font-size:15px;text-align:left}
.am.in{color:#1f9d55}.am.out{color:#d64545}.am.ret{color:#7a4fd6}.am.adj{color:#b26a00}
.tx .am small{display:block;font-weight:400;color:#888;font-size:11px}
.seg{display:grid;gap:6px}
.seg button{padding:10px 4px;font-weight:600;background:#eef1f6;color:#555;border:2px solid transparent;font-size:14px}
.seg button.on{background:#d7efe9;color:#0b4d42;border-color:#0f6b5c}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chips button{padding:10px 14px;background:#eef1f6;border:2px solid transparent;font-weight:600;min-width:52px}
.chips button.on{background:#d7efe9;color:#0b4d42;border-color:#0f6b5c}
.chips button.gen{font-weight:400;font-style:italic}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer}
.fl b{font-size:15px}.fl span{font-size:12px;color:#777}
.fl .n{font-weight:700;color:#0f6b5c;white-space:nowrap}
.bal1{background:#f3f6fb;border-radius:10px;padding:12px;text-align:center}
.bal1 span{display:block;font-size:13px;color:#666}
.bal1 b{display:block;font-size:26px;color:#0f6b5c;margin-top:4px}
.bal1.neg{background:#fde2e2}.bal1.neg b{color:#c62828}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-top:8px}
.sum div{background:#f3f6fb;border-radius:8px;padding:6px 8px}
.sum b{display:inline-block}
.warnbar{background:#fff4e0;border:1px solid #e08a00;color:#7a4b00;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.negbar{background:#fde2e2;border:1px solid #d64545;color:#8a1c1c;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px}
.balnow{font-size:14px;font-weight:700;color:#0f6b5c;margin:-4px 0 10px;min-height:1.2em}
.balnow.neg{color:#c62828}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .in{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
.kv b{white-space:nowrap}
.kv.neg b{color:#c62828}
.grp{font-weight:700;color:#0f6b5c;margin:14px 0 4px;font-size:14px;border-bottom:2px solid #d7efe9;padding-bottom:3px}
.grp2{font-weight:600;color:#555;margin:8px 8px 2px 0;font-size:13px}
.kv.ind{padding-right:16px}
#printArea{display:none}
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  header.top,main,.modal,#updBar{display:none!important}
  #printArea{display:block}
}
.sheet{font-family:Arial,Tahoma,sans-serif;color:#000;width:100%;font-size:12px;direction:rtl}
.sheet .hdr{display:flex;align-items:stretch;border:1px solid #1f2a5a;margin-bottom:6px}
.sheet .logo{background:#0f6b5c;color:#fff;font-size:20px;letter-spacing:4px;font-weight:300;padding:0 18px;display:flex;align-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{flex:1;text-align:center;padding:6px}
.sheet .ttl b{font-size:18px;display:block}
.sheet .ttl span{font-size:13px}
.sheet .per{padding:6px 12px;font-size:13px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid #1f2a5a;min-width:210px;text-align:center}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #1f2a5a;padding:2px 4px;text-align:center;vertical-align:middle;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:22px}
.sheet th{background:#8fd0c2;font-weight:700;font-size:11px;height:28px;white-space:normal;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet td.n{direction:ltr}
.sheet td.l{text-align:right}
.sheet .neg{color:#c00;font-weight:700}
.sheet tr.g td{background:#e2f2ee;font-weight:700;text-align:right;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet tr.tot td{background:#dde6f3;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ft{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
@media print{
  .pp{width:733px;height:1062px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .sheet.page{position:absolute;top:0;left:0;height:733px;transform-origin:top left;transform:translateX(733px) rotate(90deg)}
}
</style>
</head>
<body>
<header class="top"><h1 id="hdP">المخزن</h1><div class="d"><span id="syncB" style="cursor:pointer"></span> <span id="hdDate"></span></div></header>
<main id="app"></main>
<div id="printArea"></div>
<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>
<script>
(function(){
"use strict";
/* All storage keys start with satcon_stock_ so this app never touches the report,
   attendance or cash box data (they share the same site in the browser). */
var KEY="satcon_stock_v1",LAST_KEY="satcon_stock_last";

/* ---------- data ----------
   items: materials {id,name,unit}
   blds:  buildings {id,name,floors:[{id,name,r,flats:[{id,name}]}]}  (r = sort rank: basements < ground < 1..n < custom < villa)
   tx:    movements {id,type,item,qty,date,at, ...}
          in : sup (supplier), rcpt, note
          out: bld, fl, flat, who (receiver), note     fl "" = whole building, flat "" = whole floor
          ret: same place fields as out, who (returned by), note
          adj: qty is the signed difference found by a stock count, cnt = counted quantity, note = reason
   Balances are never stored: balance = in + returns - out + count adjustments. */
function blank(){return{v:1,project:"",items:[],blds:[],tx:[],lastBackup:0}}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!Array.isArray(s.tx))s=blank();var b=blank(),k;for(k in b)if(s[k]===undefined)s[k]=b[k];return s}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Could not save. The device storage may be full.")}syncChanged()}
var LAST=(function(){try{return JSON.parse(localStorage.getItem(LAST_KEY))||{}}catch(e){return{}}})();
function saveLast(){try{localStorage.setItem(LAST_KEY,JSON.stringify(LAST))}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return(n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return isoDate(new Date())}
function fmtDate(iso){if(!iso)return"";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function r3(x){return Math.round(x*1000)/1000}
/* Arabic-Indic digits and separators typed on an Arabic keyboard -> plain digits */
function normDigits(s){return String(s||"").replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/٫/g,".").replace(/[٬،]/g,",")}
function parseQty(s){s=normDigits(s).replace(/[,\s]/g,"");if(!/^\d*\.?\d*$/.test(s)||s===""||s===".")return NaN;return parseFloat(s)}
/* numbers keep left-to-right order inside Arabic text (so -3 does not show as 3-) */
function fmtQ(n){var neg=n<0;n=Math.abs(n);return"\u2066"+(neg?"-":"")+n.toLocaleString("en-US",{maximumFractionDigits:3})+"\u2069"}
function clean(s){return normDigits(s).trim().replace(/\s+/g," ")}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function byName(a,b){return a.localeCompare(b,"ar",{numeric:true})}
function $(id){return document.getElementById(id)}
function each(sel,f){Array.prototype.forEach.call(document.querySelectorAll(sel),f)}

var TL={in:"داخل",out:"خارج",ret:"إرجاع",adj:"جرد"};
var TS={in:"+",out:"−",ret:"↩",adj:"⚖"};
function itemById(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null}
function itemName(id){var i=itemById(id);return i?i.name:"(مادة محذوفة)"}
function itemUnit(id){var i=itemById(id);return i?i.unit:""}
function itemsSorted(){return S.items.slice().sort(function(a,b){return byName(a.name,b.name)})}
function bldById(id){for(var i=0;i<S.blds.length;i++)if(S.blds[i].id===id)return S.blds[i];return null}
function bldsSorted(){return S.blds.slice().sort(function(a,b){return byName(a.name,b.name)})}
function floorsOf(b){return(b&&b.floors||[]).slice().sort(function(x,y){return x.r!==y.r?x.r-y.r:byName(x.name,y.name)})}
function flById(b,id){if(!b)return null;for(var i=0;i<b.floors.length;i++)if(b.floors[i].id===id)return b.floors[i];return null}
function flatById(f,id){if(!f)return null;for(var i=0;i<f.flats.length;i++)if(f.flats[i].id===id)return f.flats[i];return null}
function flatsOf(f){return(f&&f.flats||[]).slice().sort(function(a,b){return byName(a.name,b.name)})}
function bldLabel(b){return!b?"?":(/^[0-9]/.test(b.name)?"بناية "+b.name:b.name)}
/* where an outgoing or return went, as text */
function place(t,short){var b=bldById(t.bld);if(!b)return t.bld?"(بناية محذوفة)":"";
  var s=bldLabel(b);if(!t.fl)return s+" · عام للبناية";
  var f=flById(b,t.fl);s+=" · "+(f?f.name:"?");if(!t.flat)return s+" · عام للطابق";
  var x=flatById(f,t.flat);return s+" · شقة "+(x?x.name:"?")}
function sgn(t){return t.type==="out"?-t.qty:t.qty}
function byOrder(a,b){if(a.date!==b.date)return a.date<b.date?-1:1;return(a.at||0)-(b.at||0)}
function sorted(){return S.tx.slice().sort(byOrder)}
function txById(id){for(var i=0;i<S.tx.length;i++)if(S.tx[i].id===id)return S.tx[i];return null}
/* balance of every material, optionally only movements before a date, optionally leaving one movement out */
function balances(before,skipId){var m={};S.items.forEach(function(i){m[i.id]=0});
  S.tx.forEach(function(t){if(t.id===skipId)return;if(before&&t.date>=before)return;m[t.item]=r3((m[t.item]||0)+sgn(t))});return m}
function balOf(item,skipId){var b=0;S.tx.forEach(function(t){if(t.item===item&&t.id!==skipId)b=r3(b+sgn(t))});return b}
function usesOf(f){return S.tx.filter(f).length}

/* ---------- modal ---------- */
var modal=$("modal"),modalIn=$("modalIn");
function openModal(h){modalIn.innerHTML=h;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show");modalIn.innerHTML=""}
function info(title,body){openModal('<h3>'+title+'</h3>'+(body?'<p>'+body+'</p>':'')+'<div class="acts"><button id="mN">تمام</button></div>');$("mN").onclick=closeModal}
function confirmBox(title,body,yes,cls,cb){openModal('<h3>'+title+'</h3>'+(body?'<p>'+body+'</p>':'')+'<div class="acts"><button id="mY" class="'+(cls||"pri")+'">'+yes+'</button><button id="mN">إلغاء</button></div>');
  $("mN").onclick=closeModal;$("mY").onclick=function(){closeModal();cb()}}

/* ---------- navigation: each screen is a #hash so the phone's back button works ---------- */
function go(h){location.hash=h}
window.addEventListener("hashchange",function(){closeModal();render();scrollTo(0,0)});
var app=$("app");
function render(){
  updBadge();$("syncB").onclick=function(){go("settings")};
  $("hdP").textContent="المخزن"+(S.project?" - "+S.project:"");$("hdP").onclick=function(){go("")};
  $("hdDate").textContent=fmtDate(today());
  var h=location.hash.replace(/^#/,""),m;
  if(m=/^new-(in|out|ret|adj)$/.exec(h))return formView(null,m[1]);
  if(/^edit-.+$/.test(h)){var t=txById(h.slice(5));if(t)return formView(t,t.type)}
  if(/^item-.+$/.test(h)&&itemById(h.slice(5)))return itemView(h.slice(5));
  if(h==="items")return itemsView();
  if(h==="blds")return bldsView();
  if(/^bld-.+$/.test(h)&&bldById(h.slice(4)))return bldView(h.slice(4));
  if(h==="rep")return repView();
  if(h==="log")return logView();
  if(h==="print")return printView();
  if(h==="settings")return settingsView();
  mainView();
}

/* ---------- rows ---------- */
function txTitle(t){return itemName(t.item)}
function txSub(t){var a=[fmtDate(t.date)];
  if(t.type==="in"){if(t.sup)a.push(esc(t.sup));if(t.rcpt)a.push("وصل "+esc(t.rcpt))}
  else if(t.type==="out"||t.type==="ret"){a.push(esc(place(t,true)));if(t.who)a.push(esc(t.who))}
  else a.push("الجرد: "+fmtQ(t.cnt)+(t.note?" · "+esc(t.note):""));
  return a.join(" · ")}
function txRow(t,run){
  return'<div class="tx" data-id="'+t.id+'"><div class="ic '+t.type+'">'+TS[t.type]+'</div>'+
    '<div class="mid"><b dir="auto">'+esc(txTitle(t))+'</b><span dir="auto">'+txSub(t)+'</span></div>'+
    '<div class="am '+t.type+'"><bdi dir="ltr">'+(sgn(t)>=0?"+":"−")+fmtQ(Math.abs(t.qty))+'</bdi> <span style="font-weight:400;font-size:12px">'+esc(itemUnit(t.item))+'</span>'+(run!=null?'<small'+(run<0?' style="color:#c62828"':'')+'>الرصيد '+fmtQ(run)+'</small>':'')+'</div></div>'}
function bindRows(){each("#app .tx",function(el){el.onclick=function(){go("edit-"+el.getAttribute("data-id"))}})}
function itemRow(i,b){return'<div class="it'+(b<0?' neg':'')+'" data-item="'+i.id+'" data-name="'+esc(i.name.toLowerCase())+'"><div class="mid"><b dir="auto">'+esc(i.name)+'</b></div><div class="q">'+fmtQ(b)+' <small>'+esc(i.unit)+'</small></div></div>'}
function bindItems(){each("#app .it",function(el){el.onclick=function(){go("item-"+el.getAttribute("data-item"))}})}

/* ---------- main screen ---------- */
function mainView(){
  var bal=balances(),its=itemsSorted(),negs=its.filter(function(i){return bal[i.id]<0}),h="";
  var days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(S.tx.length&&(days===null||days>=7))
    h+='<div class="warnbar"><span>'+(days===null?'لم تُعمل نسخة احتياطية بعد.':'آخر نسخة احتياطية قبل '+days+' يوم.')+'</span><button class="small" id="bkNow">نسخ الآن</button></div>';
  if(negs.length)h+='<div class="negbar">⚠ '+(negs.length>1?negs.length+' مواد رصيدها':'مادة واحدة رصيدها')+' بالسالب. ربما يوجد داخل لم يُسجَّل.</div>';
  h+='<div class="four" style="margin-bottom:12px"><button class="big ok" style="font-size:15px;padding:16px 2px" id="bIn">+ داخل</button><button class="big dan" style="font-size:15px;padding:16px 2px" id="bOut">− خارج</button>'+
    '<button class="big bret" style="font-size:15px;padding:16px 2px" id="bRet">↩ إرجاع</button><button class="big bcnt" style="font-size:15px;padding:16px 2px" id="bAdj">⚖ جرد</button></div>';
  h+='<div class="box"><h2>أرصدة المخزن</h2>';
  if(!its.length)h+='<p class="muted">لا توجد مواد بعد. أضف موادك أولاً (سمنت، حديد، طابوق...).</p><button class="pri" id="bAddM">+ إضافة مواد</button>';
  else h+=(its.length>8?'<input type="text" id="iQ" dir="auto" placeholder="🔍 بحث عن مادة" style="width:100%;margin-bottom:4px">':'')+its.map(function(i){return itemRow(i,bal[i.id])}).join("");
  h+='</div>';
  var last=sorted().reverse().slice(0,12);
  h+='<div class="box"><h2>آخر الحركات</h2>'+(last.length?last.map(function(t){return txRow(t)}).join(""):'<p class="muted">لا توجد حركات بعد.</p>')+'</div>';
  h+='<div class="three" style="margin-bottom:8px"><button id="bIt">📦 المواد</button><button id="bBl">🏢 البنايات</button><button id="bRep">📊 التقارير</button></div>'+
    '<div class="three"><button id="bLog">📋 السجل</button><button id="bPr">🖨 طباعة</button><button id="bSet">⚙ الإعدادات</button></div>';
  app.innerHTML=h;bindRows();bindItems();
  var q=$("iQ");if(q)q.oninput=function(){var v=q.value.trim().toLowerCase();each("#app .it",function(el){el.style.display=!v||el.getAttribute("data-name").indexOf(v)>=0?"":"none"})};
  $("bIn").onclick=function(){go("new-in")};$("bOut").onclick=function(){go("new-out")};
  $("bRet").onclick=function(){go("new-ret")};$("bAdj").onclick=function(){go("new-adj")};
  $("bIt").onclick=function(){go("items")};$("bBl").onclick=function(){go("blds")};$("bRep").onclick=function(){go("rep")};
  $("bLog").onclick=function(){go("log")};$("bPr").onclick=function(){go("print")};$("bSet").onclick=function(){go("settings")};
  var a=$("bAddM");if(a)a.onclick=function(){go("items")};
  var bk=$("bkNow");if(bk)bk.onclick=backup;
}

/* ---------- materials ---------- */
function itemModal(it,done){
  openModal('<h3>'+(it?'تعديل مادة':'مادة جديدة')+'</h3>'+
    '<div class="row"><label>الاسم</label><input type="text" id="mNm" dir="auto" value="'+esc(it?it.name:"")+'" placeholder="مثلاً: سمنت"></div>'+
    '<div class="row"><label>الوحدة</label><input type="text" id="mUn" dir="auto" value="'+esc(it?it.unit:"")+'" placeholder="مثلاً: كيس، طن، م³، قطعة"></div>'+
    '<div class="chips" id="mUs" style="margin-bottom:8px">'+["كيس","طن","كغم","م³","م²","متر","قطعة","لفة","كارتون","لتر"].map(function(u){return'<button class="small" data-u="'+u+'">'+u+'</button>'}).join("")+'</div>'+
    '<p class="err" id="mErr"></p><div class="acts"><button id="mY" class="ok">حفظ</button>'+(it?'<button id="mD" class="dan">حذف</button>':'')+'<button id="mN">إلغاء</button></div>');
  each("#mUs button",function(b){b.onclick=function(){$("mUn").value=b.getAttribute("data-u")}});
  $("mN").onclick=closeModal;
  if(!it)setTimeout(function(){var x=$("mNm");if(x)x.focus()},50);
  $("mY").onclick=function(){var nm=clean($("mNm").value),un=clean($("mUn").value),e=$("mErr");
    if(!nm){e.textContent="اكتب اسم المادة.";return}if(!un){e.textContent="اكتب الوحدة.";return}
    if(S.items.some(function(x){return x!==it&&x.name.toLowerCase()===nm.toLowerCase()})){e.textContent="توجد مادة بنفس الاسم.";return}
    if(it){it.name=nm;it.unit=un}else{it={id:newId("i"),name:nm,unit:un};S.items.push(it)}
    save();closeModal();done(it)};
  var d=$("mD");if(d)d.onclick=function(){var n=usesOf(function(t){return t.item===it.id});
    if(n){info("لا يمكن الحذف",'على "'+esc(it.name)+'" '+n+' حركة مسجلة. احذف الحركات أولاً.');return}
    S.items=S.items.filter(function(x){return x!==it});save();closeModal();done(null)};
}
function itemsView(){
  var bal=balances(),its=itemsSorted();
  app.innerHTML='<div class="box"><h2>المواد</h2><p class="hint" style="margin:-6px 0 8px">اضغط على مادة لتغيير اسمها أو وحدتها.</p>'+
    (its.length?its.map(function(i){return'<div class="fl" data-item="'+i.id+'"><div><b dir="auto">'+esc(i.name)+'</b><br><span>الوحدة: '+esc(i.unit)+'</span></div><div class="n">'+fmtQ(bal[i.id])+' '+esc(i.unit)+'</div></div>'}).join(""):'<p class="muted">لا توجد مواد بعد.</p>')+
    '</div><button class="big ok" id="iAdd">+ إضافة مادة</button><button class="big" id="iBack" style="margin-top:8px">رجوع</button>';
  each("#app .fl",function(el){el.onclick=function(){itemModal(itemById(el.getAttribute("data-item")),function(){itemsView()})}});
  $("iAdd").onclick=function(){itemModal(null,function(){itemsView()})};
  $("iBack").onclick=function(){history.back()};
}
/* one material: its balance and every movement with the running balance */
var ITEM_TAB="all";
function itemView(id){
  var it=itemById(id),run=0,rows=[],tot={in:0,out:0,ret:0,adj:0};
  sorted().forEach(function(t){if(t.item!==id)return;run=r3(run+sgn(t));tot[t.type]=r3(tot[t.type]+t.qty);rows.push({t:t,run:run})});
  var b=run,list=rows.slice().reverse().filter(function(r){return ITEM_TAB==="all"||r.t.type===ITEM_TAB});
  app.innerHTML='<div class="box"><h2 dir="auto">'+esc(it.name)+'</h2><div class="bal1'+(b<0?' neg':'')+'"><span>الرصيد في المخزن</span><b>'+fmtQ(b)+' '+esc(it.unit)+'</b></div>'+
    '<div class="sum"><div>مجموع الداخل: <b>'+fmtQ(tot.in)+'</b></div><div>مجموع الخارج: <b>'+fmtQ(tot.out)+'</b></div><div>الإرجاع: <b>'+fmtQ(tot.ret)+'</b></div><div>فروقات الجرد: <b>'+"<bdi dir=\"ltr\">"+(tot.adj>0?"+":"")+fmtQ(tot.adj)+"</bdi>"+'</b></div></div></div>'+
    '<div class="box"><div class="seg" style="grid-template-columns:repeat(5,1fr);margin-bottom:8px" id="itT">'+["all","in","out","ret","adj"].map(function(k){return'<button data-k="'+k+'" class="'+(ITEM_TAB===k?"on":"")+'">'+(k==="all"?"الكل":k==="adj"?"جرد":k==="ret"?"إرجاع":k==="in"?"داخل":"خارج")+'</button>'}).join("")+'</div>'+
    (list.length?list.map(function(r){return txRow(r.t,r.run)}).join(""):'<p class="muted">لا توجد حركات.</p>')+'</div>'+
    '<div class="two" style="margin-bottom:8px"><button class="ok" id="iIn">+ داخل</button><button class="dan" id="iOut">− خارج</button></div>'+
    '<div class="two" style="margin-bottom:8px"><button id="iPr">🖨 طباعة كارت المادة</button><button id="iEd">✏ تعديل المادة</button></div>'+
    '<button class="big" id="iBack">رجوع</button>';
  bindRows();
  each("#itT button",function(x){x.onclick=function(){ITEM_TAB=x.getAttribute("data-k");itemView(id)}});
  $("iIn").onclick=function(){LAST.item=id;saveLast();go("new-in")};
  $("iOut").onclick=function(){LAST.item=id;saveLast();go("new-out")};
  $("iPr").onclick=function(){PF.kind="card";PF.item=id;PF.from="";PF.to=today();go("print")};
  $("iEd").onclick=function(){itemModal(it,function(x){if(x)itemView(id);else go("")})};
  $("iBack").onclick=function(){history.back()};
}

/* ---------- recording a movement ---------- */
function formView(t,type){
  var isNew=!t,isPlace=type==="out"||type==="ret";
  if(!S.items.length){app.innerHTML='<div class="box"><h2>'+TL[type]+'</h2><p>أضف موادك أولاً.</p><button class="pri" id="fM">+ إضافة مادة</button></div><button class="big" id="fBack">رجوع</button>';
    $("fM").onclick=function(){itemModal(null,function(){render()})};$("fBack").onclick=function(){history.back()};return}
  if(isPlace&&!S.blds.length){app.innerHTML='<div class="box"><h2>'+TL[type]+'</h2><p>جهّز البنايات والطوابق والشقق أولاً.</p><button class="pri" id="fB">🏢 إعداد البنايات</button></div><button class="big" id="fBack">رجوع</button>';
    $("fB").onclick=function(){go("blds")};$("fBack").onclick=function(){history.back()};return}
  var F=t?{item:t.item,qty:type==="adj"?t.cnt:t.qty,date:t.date,sup:t.sup||"",rcpt:t.rcpt||"",who:t.who||"",note:t.note||"",bld:t.bld||"",fl:t.fl||"",flat:t.flat||""}:
    {item:itemById(LAST.item)?LAST.item:"",qty:"",date:today(),sup:"",rcpt:"",who:"",note:"",bld:bldById(LAST.bld)?LAST.bld:"",fl:"",flat:""};
  if(isNew&&F.bld&&LAST.fl&&flById(bldById(F.bld),LAST.fl)){F.fl=LAST.fl;if(LAST.flat&&flatById(flById(bldById(F.bld),F.fl),LAST.flat))F.flat=LAST.flat}
  var col={in:"ok",out:"dan",ret:"bret",adj:"bcnt"}[type];
  var h='<div class="box"><h2>'+(isNew?'تسجيل ':'تعديل ')+TL[type]+'</h2>'+
    '<div class="row"><label>المادة</label><select id="fI"><option value="">— اختر المادة —</option>'+itemsSorted().map(function(i){return'<option value="'+i.id+'"'+(i.id===F.item?' selected':'')+'>'+esc(i.name)+' ('+esc(i.unit)+')</option>'}).join("")+'</select><button class="small" id="fNI">+ جديدة</button></div>'+
    '<div class="balnow" id="fBal"></div>'+
    '<div class="row"><label>'+(type==="adj"?'الكمية المعدودة':'الكمية')+'</label><input type="text" id="fQ" inputmode="decimal" value="'+(F.qty===""?"":F.qty)+'" placeholder="0"><span id="fU" class="muted" style="min-width:40px"></span></div>'+
    (type==="adj"?'<p class="hint" style="margin:-6px 0 10px">اكتب الكمية التي عددتها فعلاً في المخزن، والبرنامج يسجل الفرق عن الرصيد.</p><div class="balnow" id="fDiff"></div>':'')+
    '<div class="row"><label>التاريخ</label><input type="date" id="fD" value="'+F.date+'"></div>';
  if(type==="in")h+='<div class="row"><label>المورّد</label><input type="text" id="fSup" dir="auto" value="'+esc(F.sup)+'"></div>'+
    '<div class="row"><label>رقم الوصل</label><input type="text" id="fR" value="'+esc(F.rcpt)+'" placeholder="اختياري"></div>';
  if(isPlace)h+='<div class="row"><label>البناية</label><div class="chips" id="fBl"></div></div>'+
    '<div class="row"><label>الطابق</label><select id="fFl"></select></div>'+
    '<div class="row" id="fFtR"><label>الشقة</label><div class="chips" id="fFt"></div></div>'+
    '<div class="row"><label>'+(type==="out"?'المستلم':'أرجعها')+'</label><input type="text" id="fW" dir="auto" value="'+esc(F.who)+'" placeholder="اختياري"></div>';
  h+='<div class="row"><label>'+(type==="adj"?'السبب':'ملاحظة')+'</label><input type="text" id="fN" dir="auto" value="'+esc(F.note)+'" placeholder="'+(type==="adj"?'مثلاً: تالف، ضائع، خطأ عدّ':'اختياري')+'"></div>'+
    '<p class="err" id="fErr"></p><button class="big '+col+'" id="fSave">حفظ</button></div>'+
    (isNew?'':'<button class="big" id="fDel" style="background:#fff;color:#d64545;border:2px solid #d64545;margin-bottom:8px">🗑 حذف هذه الحركة</button>')+
    '<button class="big" id="fBack">رجوع</button>';
  app.innerHTML=h;
  var skip=t?t.id:null;
  function showBal(){var id=$("fI").value,el=$("fBal");$("fU").textContent=id?itemUnit(id):"";
    if(!id){el.textContent="";el.className="balnow";return}
    var b=balOf(id,skip);el.className="balnow"+(b<0?" neg":"");el.textContent="الرصيد في المخزن: "+fmtQ(b)+" "+itemUnit(id)+(skip?" (بدون هذه الحركة)":"");
    if(type==="adj"){var q=parseQty($("fQ").value),d=$("fDiff");if(isNaN(q)){d.textContent="";return}var df=r3(q-b);d.className="balnow"+(df<0?" neg":"");d.textContent=df===0?"لا يوجد فرق.":"الفرق: "+(df>0?"+":"")+fmtQ(df)+" "+itemUnit(id)}}
  $("fI").onchange=showBal;$("fQ").oninput=function(){$("fQ").classList.remove("bad");if(type==="adj")showBal()};showBal();
  $("fNI").onclick=function(){itemModal(null,function(it){F.item=it.id;var s=$("fI"),o=document.createElement("option");o.value=it.id;o.textContent=it.name+" ("+it.unit+")";s.appendChild(o);s.value=it.id;showBal()})};
  if(isPlace){
    var paintB=function(){$("fBl").innerHTML=bldsSorted().map(function(b){return'<button data-b="'+b.id+'" class="'+(b.id===F.bld?"on":"")+'">'+esc(b.name)+'</button>'}).join("");
      each("#fBl button",function(x){x.onclick=function(){if(F.bld!==x.getAttribute("data-b")){F.bld=x.getAttribute("data-b");F.fl="";F.flat=""}paintB();paintF()}})};
    var paintF=function(){var b=bldById(F.bld),s=$("fFl");
      s.innerHTML=b?'<option value="">— عام للبناية —</option>'+floorsOf(b).map(function(f){return'<option value="'+f.id+'"'+(f.id===F.fl?' selected':'')+'>'+esc(f.name)+(f.flats.length?' ('+f.flats.length+' شقق)':'')+'</option>'}).join(""):'<option value="">اختر البناية أولاً</option>';
      s.disabled=!b;paintT()};
    var paintT=function(){var f=flById(bldById(F.bld),F.fl),r=$("fFtR");if(!f){r.style.display="none";F.flat="";return}r.style.display="";
      if(F.flat&&!flatById(f,F.flat))F.flat="";
      $("fFt").innerHTML='<button data-t="" class="gen'+(!F.flat?" on":"")+'">عام للطابق</button>'+flatsOf(f).map(function(x){return'<button data-t="'+x.id+'" class="'+(x.id===F.flat?"on":"")+'">'+esc(x.name)+'</button>'}).join("");
      each("#fFt button",function(x){x.onclick=function(){F.flat=x.getAttribute("data-t");paintT()}})};
    $("fFl").onchange=function(){F.fl=$("fFl").value;F.flat="";paintT()};
    paintB();paintF();
  }
  $("fBack").onclick=function(){history.back()};
  if(!isNew)$("fDel").onclick=function(){confirmBox("حذف هذه الحركة؟",esc(TL[type])+": "+esc(itemName(t.item))+" "+fmtQ(Math.abs(t.qty))+" "+esc(itemUnit(t.item))+" بتاريخ "+fmtDate(t.date),"حذف","dan",function(){
    S.tx=S.tx.filter(function(x){return x!==t});save();history.back()})};
  $("fSave").onclick=function(){
    var e=$("fErr"),item=$("fI").value,q=parseQty($("fQ").value),date=$("fD").value;e.textContent="";
    if(!item){e.textContent="اختر المادة.";$("fI").classList.add("bad");return}
    if(isNaN(q)||(type!=="adj"&&q<=0)){e.textContent="اكتب كمية صحيحة.";$("fQ").classList.add("bad");return}
    if(!date){e.textContent="اختر التاريخ.";return}
    if(isPlace&&!F.bld){e.textContent="اختر البناية.";return}
    var rec={id:t?t.id:newId("t"),type:type,item:item,date:date,at:t?(t.at||Date.now()):Date.now(),note:clean($("fN").value)};
    var b=balOf(item,skip);
    if(type==="adj"){rec.cnt=r3(q);rec.qty=r3(q-b);if(rec.qty===0){e.textContent="الكمية المعدودة تساوي الرصيد، لا يوجد شيء للتسجيل.";return}}
    else rec.qty=r3(q);
    if(type==="in"){rec.sup=clean($("fSup").value);rec.rcpt=clean($("fR").value)}
    if(isPlace){rec.bld=F.bld;rec.fl=F.fl||"";rec.flat=F.fl?F.flat||"":"";rec.who=clean($("fW").value)}
    if(t)rec.edited=Date.now();
    function commit(){
      if(t){var i=S.tx.indexOf(t);S.tx[i]=rec}else S.tx.push(rec);
      LAST.item=item;if(isPlace){LAST.bld=rec.bld;LAST.fl=rec.fl;LAST.flat=rec.flat}saveLast();save();
      if(isNew){var nb=balOf(item);go("");setTimeout(function(){info("✓ تم الحفظ",esc(TL[type])+": "+esc(itemName(item))+" "+fmtQ(Math.abs(rec.qty))+" "+esc(itemUnit(item))+(isPlace?"<br>"+esc(place(rec)):"")+'<br>الرصيد الآن: <b style="color:'+(nb<0?"#c62828":"#0f6b5c")+'">'+fmtQ(nb)+" "+esc(itemUnit(item))+"</b>")},80)}
      else history.back()}
    if(type==="out"&&b-rec.qty<0){
      openModal('<h3>⚠ الكمية غير موجودة في المخزن</h3><p>رصيد <b dir="auto">'+esc(itemName(item))+'</b> هو <b>'+fmtQ(b)+' '+esc(itemUnit(item))+'</b> وأنت تُخرج <b>'+fmtQ(rec.qty)+'</b>.</p>'+
        '<p>سيصبح الرصيد <b style="color:#c62828">'+fmtQ(r3(b-rec.qty))+' '+esc(itemUnit(item))+'</b>.</p><p class="hint">هذا يعني غالباً أن هناك داخل لم يُسجَّل.</p>'+
        '<div class="acts"><button id="mY" class="dan">احفظ على أي حال</button><button id="mN">رجوع</button></div>');
      $("mN").onclick=closeModal;$("mY").onclick=function(){closeModal();commit()};return}
    commit()};
}

/* ---------- buildings, floors and flats (typed by the user from the flat distribution plan) ---------- */
function bldsView(){
  var bs=bldsSorted();
  app.innerHTML='<div class="box"><h2>البنايات</h2><p class="hint" style="margin:-6px 0 8px">أضف كل بناية، ثم طوابقها، ثم شقق كل طابق.</p>'+
    (bs.length?bs.map(function(b){var nf=b.floors.length,nt=b.floors.reduce(function(a,f){return a+f.flats.length},0);
      return'<div class="fl" data-b="'+b.id+'"><div><b dir="auto">'+esc(bldLabel(b))+'</b><br><span>'+nf+' طابق · '+nt+' شقة</span></div><div class="n">‹</div></div>'}).join(""):'<p class="muted">لا توجد بنايات بعد.</p>')+
    '<div class="row" style="margin-top:12px"><input type="text" id="nbN" dir="auto" placeholder="اسم أو رقم البناية الجديدة"><button class="ok small" id="nbA">+ إضافة</button></div><p class="err" id="nbE"></p></div>'+
    '<button class="big" id="bBack">رجوع</button>';
  each("#app .fl",function(el){el.onclick=function(){go("bld-"+el.getAttribute("data-b"))}});
  $("nbA").onclick=function(){var nm=clean($("nbN").value);
    if(!nm){$("nbE").textContent="اكتب اسم البناية.";return}
    if(S.blds.some(function(b){return b.name.toLowerCase()===nm.toLowerCase()})){$("nbE").textContent="هذه البناية موجودة.";return}
    var b={id:newId("b"),name:nm,floors:[]};S.blds.push(b);save();go("bld-"+b.id)};
  $("bBack").onclick=function(){history.back()};
}
function floorRank(kind,n){return kind==="bas"?-n:kind==="gnd"?0:kind==="num"?n:kind==="vil"?10000:5000}
function bldView(id){
  var b=bldById(id),fs=floorsOf(b),nums=fs.filter(function(f){return f.r>0&&f.r<5000}).map(function(f){return f.r}),hasG=fs.some(function(f){return f.r===0}),
    nB=fs.filter(function(f){return f.r<0}).length,hasV=fs.some(function(f){return f.r===10000}),nextN=nums.length?Math.max.apply(null,nums)+1:1;
  app.innerHTML='<div class="box"><h2 dir="auto">'+esc(bldLabel(b))+'</h2>'+
    '<div class="row"><label>الاسم</label><input type="text" id="bN" dir="auto" value="'+esc(b.name)+'"><button class="small" id="bNS">تغيير الاسم</button></div>'+
    '<div class="grp">الطوابق ('+fs.length+')</div>'+
    (fs.length?fs.map(function(f){var fl=flatsOf(f);return'<div class="fl" data-f="'+f.id+'"><div style="min-width:0"><b dir="auto">'+esc(f.name)+'</b><br><span dir="auto">'+(fl.length?fl.length+' شقة: '+esc(fl.map(function(x){return x.name}).join("، ")):'بدون شقق')+'</span></div><div class="n">‹</div></div>'}).join(""):'<p class="muted">لا توجد طوابق بعد. أضفها من الأسفل.</p>')+
    '</div><div class="box"><h2>إضافة طوابق</h2>'+
    '<div class="three" style="margin-bottom:10px"><button class="small" id="aB">+ سرداب'+(nB?' '+(nB+1):'')+'</button><button class="small" id="aG"'+(hasG?' disabled':'')+'>+ طابق أرضي</button><button class="small" id="aV"'+(hasV?' disabled':'')+'>+ فيلا السطح</button></div>'+
    '<div class="row"><label>الطوابق من</label><input type="text" id="aF" inputmode="numeric" value="'+nextN+'" style="max-width:70px"><span>إلى</span><input type="text" id="aT" inputmode="numeric" placeholder="مثلاً 20" style="max-width:70px"><button class="ok small" id="aN">+ إضافة</button></div>'+
    '<div class="row"><label>اسم آخر</label><input type="text" id="aC" dir="auto" placeholder="مثلاً: ميزانين"><button class="small" id="aCA">+ إضافة</button></div><p class="err" id="aE"></p></div>'+
    '<button class="big" id="bDel" style="background:#fff;color:#d64545;border:2px solid #d64545;margin-bottom:8px">🗑 حذف البناية</button><button class="big" id="bBack">رجوع</button>';
  function add(name,r){if(b.floors.some(function(f){return f.name.toLowerCase()===name.toLowerCase()}))return false;b.floors.push({id:newId("f"),name:name,r:r,flats:[]});return true}
  each("#app .fl",function(el){el.onclick=function(){floorModal(b,flById(b,el.getAttribute("data-f")))}});
  $("bNS").onclick=function(){var nm=clean($("bN").value);if(!nm)return;
    if(S.blds.some(function(x){return x!==b&&x.name.toLowerCase()===nm.toLowerCase()})){info("الاسم مستخدم","توجد بناية أخرى بنفس الاسم.");return}b.name=nm;save();bldView(id)};
  $("aB").onclick=function(){add(nB?"سرداب "+(nB+1):"سرداب",floorRank("bas",nB+1));save();bldView(id)};
  $("aG").onclick=function(){add("الطابق الأرضي",0);save();bldView(id)};
  $("aV").onclick=function(){add("فيلا السطح",10000);save();bldView(id)};
  $("aN").onclick=function(){var a=parseQty($("aF").value),z=$("aT").value.trim()?parseQty($("aT").value):a,e=$("aE");
    if(isNaN(a)||isNaN(z)||a<1||z<a||a%1||z%1){e.textContent="اكتب أرقام طوابق صحيحة، مثلاً من 1 إلى 20.";return}
    if(z-a>99){e.textContent="عدد كبير جداً من الطوابق مرة واحدة.";return}
    var n=0;for(var k=a;k<=z;k++)if(add("الطابق "+k,k))n++;
    if(!n){e.textContent="هذه الطوابق موجودة.";return}save();bldView(id)};
  $("aCA").onclick=function(){var nm=clean($("aC").value);if(!nm){$("aE").textContent="اكتب اسم الطابق.";return}
    if(!add(nm,5000)){$("aE").textContent="يوجد طابق بنفس الاسم.";return}save();bldView(id)};
  $("bDel").onclick=function(){var n=usesOf(function(t){return t.bld===id});

/* ---------- printing (A4 landscape sheets, same layout as the other SATCON apps) ---------- */
var PAGE_W=1062,PAGE_H=733,TOP_H=74,TH_H=30,FT_H=22,ROW_H=22;
var PF={kind:"bal",item:"",bld:"",fl:"",flat:"*",from:"",to:""};
var PK={bal:"أرصدة المخزن",in:"المواد الداخلة",out:"المواد الخارجة",ret:"المواد المُرجعة",card:"كارت مادة",rep:"تقرير الاستهلاك"};
function monthRange(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);var a=isoDate(d);d.setMonth(d.getMonth()+1);d.setDate(0);return[a,isoDate(d)]}
function nC(v,cls){return'<td class="n'+(cls?" "+cls:"")+(typeof v==="number"&&v<0?" neg":"")+'">'+(v===""||v==null?"":fmtQ(v))+'</td>'}
function tC(v,l){return'<td'+(l?' class="l"':'')+' dir="auto">'+esc(v)+'</td>'}
function paginate(o){
  var cap=PAGE_H-TOP_H-TH_H-FT_H,pages=[],cur=[],used=0;
  o.rows.forEach(function(r){var hh=r.h||ROW_H;if(used+hh>cap&&cur.length){pages.push(cur);cur=[];used=0}cur.push(r);used+=hh});
  var lastH=(o.last||[]).reduce(function(a,r){return a+(r.h||ROW_H)},0);
  if(used+lastH>cap&&cur.length){pages.push(cur);cur=[];used=0}
  (o.last||[]).forEach(function(r){cur.push(r)});pages.push(cur);
  var N=pages.length,printed=fmtDate(today());
  var per=o.per||(!o.from?'حتى <b>'+fmtDate(o.to)+'</b>':o.from===o.to?'التاريخ: <b>'+fmtDate(o.from)+'</b>':'من <b>'+fmtDate(o.from)+'</b> إلى <b>'+fmtDate(o.to)+'</b>');
  return pages.map(function(pg,pi){
    return'<div class="sheet page" style="width:'+PAGE_W+'px">'+
      '<div class="hdr" style="height:'+(TOP_H-8)+'px"><div class="logo">SATCON</div><div class="ttl"><b>'+o.title+'</b><span dir="auto">'+esc(o.sub||S.project||"")+'</span></div>'+
      '<div class="per"><div>'+per+'</div></div></div>'+
      '<table>'+o.colg+o.head+pg.map(function(r){return r.html}).join("")+'</table>'+
      '<div class="ft"><span>تاريخ الطباعة: '+printed+'</span><span>صفحة '+(pi+1)+' من '+N+'</span></div></div>'});
}
function txRange(type){return sorted().filter(function(t){return t.type===type&&inRange(t,PF.from,PF.to)&&(type==="in"||!PF.bld||(t.bld===PF.bld&&(!PF.fl||(t.fl===PF.fl&&(PF.flat==="*"||t.flat===PF.flat)))))})}
function placeParts(t){var b=bldById(t.bld),f=flById(b,t.fl),x=flatById(f,t.flat);return[b?b.name:"?",t.fl?(f?f.name:"?"):"عام للبناية",t.fl?(t.flat?(x?x.name:"?"):"عام للطابق"):""]}
function scopeText(){var b=bldById(PF.bld);if(!b)return S.project||"";var f=flById(b,PF.fl),s=bldLabel(b);if(f){s+=" · "+f.name;if(PF.flat!=="*"){var x=flatById(f,PF.flat);s+=" · "+(x?"شقة "+x.name:"عام للطابق")}}return s}

    matList(tot).forEach(function(i){last.push({html:'<tr class="tot"><td colspan="2">المجموع</td>'+tC(itemName(i),1)+tC(itemUnit(i))+nC(tot[i])+'<td colspan="3"></td></tr>'})});

  if(k==="out"||k==="ret"){var L2=txRange(k),tot2={};

    matList(tot2).forEach(function(i){last.push({html:'<tr class="tot"><td colspan="2">المجموع</td>'+tC(itemName(i),1)+tC(itemUnit(i))+nC(tot2[i])+'<td colspan="5"></td></tr>'})});

function applyRec(id,data){var k=kindOf(id);
  if(k==="m"){if(!data.deleted&&(data.project||"")!==(S.project||"")){S.project=data.project||"";return true}return false}
  var L=S[LISTS[k]];if(!L)return false;var i=-1;for(var j=0;j<L.length;j++)if(L[j].id===id){i=j;break}
  if(data.deleted){if(i<0)return false;L.splice(i,1);return true}
  var rec=canon(data);rec.id=id;if(i<0){L.push(rec);return true}
  if(JSON.stringify(L[i])===JSON.stringify(rec))return false;L[i]=rec;return true}
function listen(){stopListen();
  unsub=fbx.onSnapshot(colOf(SY.code),{includeMetadataChanges:true},function(snap){
    SST.cache=snap.metadata.fromCache;if(!SST.cache)SST.lastOk=Date.now();
    var ch=false;
    snap.docChanges().forEach(function(c){var id=c.doc.id;if(PEND[id])return;if(c.type==="removed")return;
      var d=c.doc.data()||{};delete d.k;if(applyRec(id,d))ch=true});
    if(ch){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}shadowInit();needRender=true}
    updBadge();
  },function(e){SST.err=String(e&&e.code||e);updBadge();stopListen();setTimeout(function(){if(SST.ready&&!unsub)listen()},20000)});
}
/* send what is in PEND; a change made while sending stays in PEND for the next round */
function flush(){
  if(!SY.code||!SST.ready||SST.flushing||!pendN())return;
  SST.flushing=true;var b=fbx.writeBatch(fdb),taken=[],n=0;
  for(var key in PEND){if(n>=400)break;var r=recById(key),k=kindOf(key);
    b.set(fbx.doc(fdb,"p",SY.code,"d",key),r?Object.assign({k:k},canon(r)):{k:k,id:key,deleted:true,at:Date.now()});taken.push([key,PEND[key]]);n++}
  b.commit().then(function(){
    taken.forEach(function(x){if(PEND[x[0]]===x[1])delete PEND[x[0]]});
    savePend();SST.flushing=false;SST.lastOk=Date.now();SST.err="";updBadge();if(pendN())setTimeout(flush,200);
  },function(e){SST.flushing=false;SST.err=String(e&&e.code||e);updBadge();setTimeout(flush,15000)});
}
setInterval(function(){if(SY.code&&SST.ready&&pendN()&&!SST.flushing)flush()},20000);
/* redraw lists when the other device changed something, but never under the user's fingers */
setInterval(function(){if(!needRender)return;
  var h=location.hash.replace(/^#/,""),busy=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(modal.classList.contains("show")||busy)return;
  if(h===""||h==="log"||h==="items"||h==="blds"||h==="rep"||/^item-/.test(h)||/^bld-/.test(h)){needRender=false;render()}
},1500);
function badgeTxt(){if(!SY.code)return"";var n=pendN();
  if(SST.err==="nofb")return"⚪";
  if(!SST.ready||SST.cache)return"🟠"+(n?" "+n:"");return n?"🟠 "+n:"🟢"}
function updBadge(){var b=$("syncB");if(b)b.textContent=badgeTxt();var x=$("syS");if(x)x.innerHTML=syncStatus()}
function hm(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())+" "+fmtDate(isoDate(d))}
function syncStatus(){var n=pendN();
  if(SST.err==="nofb")return"⚪ مكونات المزامنة غير موجودة في هذه النسخة. نصّب آخر APK.";
  if(!SST.ready)return"🟠 جارٍ الاتصال...";
  return(SST.cache?"🟠 بدون إنترنت. التغييرات تُرفع تلقائياً عند رجوع الاتصال.":"🟢 متصل")+
    (n?"<br>بانتظار الرفع: <b>"+n+"</b>":"<br>كل التغييرات مرفوعة ✓")+(SST.lastOk?"<br><span class='muted'>آخر اتصال: "+hm(SST.lastOk)+"</span>":"")}
function netMsg(e){var c=String(e&&e.code||e&&e.message||e);
  if(/noconfig/.test(c))return"المزامنة غير مفعلة في هذه النسخة.";
  if(/admin-restricted|operation-not-allowed/.test(c))return"الدخول المجهول (Anonymous) غير مفعّل على السيرفر.";
  return"لا يوجد إنترنت أو الاتصال ضعيف. حاول مرة أخرى."}
function syncBox(){
  if(!FB_CFG)return'<div class="box"><h2>☁ المزامنة بين الأجهزة</h2><p class="muted" style="margin:0">المزامنة بين الموبايل واللابتوب ستُفعَّل في تحديث قادم.</p></div>';
  if(!SY.code)return'<div class="box"><h2>☁ المزامنة بين الأجهزة</h2><p class="muted" style="margin-top:0">كل جهاز (موبايل أو لابتوب) يستعمل نفس <b>رمز المشروع</b> يرى نفس المخزن. لا يحتاج إيميل ولا كلمة سر.</p>'+
    '<div class="row"><label>رمز المشروع</label><input type="text" id="syC" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="مثلاً satcon-stock-2026"></div><p class="err" id="syErr"></p>'+
    '<button class="big pri" id="syU">📤 أول جهاز: رفع بيانات هذا الجهاز</button>'+
    '<button class="big" id="syJ" style="margin-top:8px">📥 انضمام: تنزيل بيانات المشروع</button>'+
    '<p class="hint">الإنترنت مطلوب وقت الاتصال فقط. بعدها يعمل البرنامج بدون إنترنت ويزامن عند رجوع الاتصال.</p></div>';
  return'<div class="box"><h2>☁ المزامنة</h2><p style="margin-top:0">رمز المشروع: <b dir="ltr">'+esc(SY.code)+'</b></p><p id="syS">'+syncStatus()+'</p>'+
    '<div class="two"><button id="syNow">🔄 مزامنة الآن</button><button class="dan" id="syOut">فصل الجهاز</button></div></div>'}
function bindSyncBox(){
  var c=$("syC");
  function code(){var v=c.value.trim().toLowerCase(),e=$("syErr");
    if(!/^[a-z0-9_-]{6,40}$/.test(v)){e.textContent="الرمز لازم يكون 6 أحرف إنكليزية أو أرقام على الأقل (يُسمح بالشرطة -)، بدون فراغات.";return null}e.textContent="";return v}
  function connected(v){SY.code=v;saveSY();SST.ready=true;shadowInit();listen();flush()}
  if(c){
    $("syU").onclick=function(){var v=code();if(!v)return;
      openModal('<h3 style="text-align:center">جارٍ الاتصال...</h3>');
      withNet(ensureFb().then(function(){return fbx.getDocsFromServer(fbx.query(colOf(v),fbx.limit(1)))})).then(function(q){
        if(!q.empty){info("الرمز مستعمل","توجد بيانات بهذا الرمز. استعمل <b>انضمام</b> لتنزيلها، أو اختر رمزاً جديداً.");return}
        PEND={};var all=allRecs();for(var k in all)mark(k);savePend();connected(v);closeModal();render();
        info("✓ تم الاتصال","جارٍ رفع بيانات هذا الجهاز ("+pendN()+" عنصر). أبقِ البرنامج مفتوحاً ومتصلاً حتى يصير المؤشر 🟢. بعدها على الجهاز الثاني: الإعدادات ← اكتب نفس الرمز <b dir=\"ltr\">"+esc(v)+"</b> ← انضمام.")
      }).catch(function(e){info("تعذّر الاتصال",netMsg(e))})};
    $("syJ").onclick=function(){var v=code();if(!v)return;
      var local=S.tx.length+S.items.length+S.blds.length;
      function go2(){download(v)}
      if(!local)return go2();
      openModal('<h3>استبدال بيانات هذا الجهاز؟</h3><p>سيُنزّل هذا الجهاز بيانات المشروع، و<b>البيانات الموجودة عليه ('+S.items.length+' مادة، '+S.tx.length+' حركة) ستُستبدل</b>.</p><p class="hint">إذا كان على هذا الجهاز شيء غير موجود على السيرفر، اعمل نسخة احتياطية أولاً.</p>'+
        '<div class="acts" style="flex-direction:column"><button id="mBk">💾 نسخة احتياطية أولاً</button><button id="mY" class="dan">متابعة وتنزيل</button><button id="mN">إلغاء</button></div>');
      $("mBk").onclick=backup;$("mN").onclick=closeModal;$("mY").onclick=function(){closeModal();go2()}};
  }
  var bNow=$("syNow");if(bNow)bNow.onclick=function(){if(!SST.ready)startSync();else{flush();listen()}updBadge()};
  var bOut=$("syOut");if(bOut)bOut.onclick=function(){var n=pendN();
    openModal('<h3>فصل هذا الجهاز؟</h3><p>البيانات تبقى على الجهاز لكنها لن تتزامن بعد الآن.</p>'+(n?'<p class="err">'+n+' تغيير لم يُرفع بعد ولن يصل للسيرفر.</p>':'')+
      '<div class="acts"><button id="mY" class="dan">فصل</button><button id="mN">إلغاء</button></div>');
    $("mN").onclick=closeModal;
    $("mY").onclick=function(){stopListen();SY.code=null;saveSY();PEND={};savePend();SST.ready=false;closeModal();render()}};
}
/* joining device: take the project's data in place of this device's */
function download(v){
  openModal('<h3 style="text-align:center">جارٍ تنزيل البيانات...</h3>');
  withNet(ensureFb().then(function(){return fbx.getDocsFromServer(colOf(v))})).then(function(q){
    if(q.empty){info("لا توجد بيانات بهذا الرمز","تأكد من الرمز. إذا كان هذا أول جهاز، استعمل <b>أول جهاز: رفع</b>.");return}
    var ns=blank();ns.lastBackup=S.lastBackup;var keep=S;S=ns;
    q.docs.forEach(function(d){var x=d.data()||{};delete x.k;if(!x.deleted)applyRec(d.id,x)});
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){S=keep;throw e}
    PEND={};savePend();SY.code=v;saveSY();SST.ready=true;shadowInit();listen();
    closeModal();go("");render();
    setTimeout(function(){info("✓ تم الاتصال","نزلت "+S.items.length+" مادة و"+S.blds.length+" بناية و"+S.tx.length+" حركة. أي شيء تسجله هنا يظهر على الجهاز الثاني.")},150);
  }).catch(function(e){info("فشل التنزيل",netMsg(e))});
}

window.__updateReady=function(){
  if($("updBar"))return;
  var b=document.createElement("div");b.id="updBar";
  b.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#1f9d55;color:#fff;padding:12px;display:flex;align-items:center;justify-content:space-between;z-index:60;font-size:15px";
  b.innerHTML='<span>يوجد إصدار جديد من البرنامج</span><button style="background:#fff;color:#1f9d55;font-weight:700">تحديث الآن</button>';
  b.querySelector("button").onclick=function(){location.reload()};document.body.appendChild(b);
};
if(SY.code)shadowInit();
render();
startSync();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!NATIVE){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})}
})();
</script>
