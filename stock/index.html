<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Stock - SATCON</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#eef1f6;color:#1d2433;font-size:16px}
header.top{background:#0f6b5c;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0;cursor:pointer}
header.top .d{font-size:14px;opacity:.9}
main{padding:12px;max-width:720px;margin:0 auto;padding-bottom:40px}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:16px;margin:0 0 10px;color:#0f6b5c}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row label{min-width:96px;font-size:14px;color:#555}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{font:inherit;padding:10px;border:1px solid #c8cfdb;border-radius:8px;flex:1;min-width:0;background:#fff}
input.bad,select.bad{border-color:#d64545;background:#fff5f5}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:#dfe5f0;color:#1d2433}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
.big{width:100%;padding:16px;font-size:18px;font-weight:600}
.pri{background:#2f6fd6;color:#fff}
.ok{background:#1f9d55;color:#fff}
.dan{background:#d64545;color:#fff}
.bret{background:#7a4fd6;color:#fff}
.bcnt{background:#e08a00;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.small{padding:8px 10px;font-size:14px}
.muted{color:#888;font-size:13px}
.hint{font-size:12px;color:#777;margin:4px 0 0}
.err{color:#d64545;font-size:13px;margin:4px 0 0;min-height:1em}
.it{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #eee;cursor:pointer}
.it:last-child{border:0}
.it .mid{flex:1;min-width:0}
.it .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mid span{font-size:12px;color:#777}
.it .q{font-weight:700;direction:ltr;white-space:nowrap;font-size:16px;color:#0f6b5c;text-align:right}
.it .q small{font-weight:400;color:#777;font-size:12px}
.it.neg{background:#fde2e2}
.it.neg .q{color:#c62828}
.tx{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eee;cursor:pointer}
.tx:last-child{border:0}
.tx .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ic.in{background:#d8f0e1;color:#1f9d55}.ic.out{background:#fde2e2;color:#d64545}.ic.ret{background:#e6dcfb;color:#7a4fd6}.ic.adj{background:#ffe9c7;color:#b26a00}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:12px;color:#777}
.tx .am{font-weight:700;direction:ltr;white-space:nowrap;font-size:15px;text-align:right}
.am.in{color:#1f9d55}.am.out{color:#d64545}.am.ret{color:#7a4fd6}.am.adj{color:#b26a00}
.tx .am small{display:block;font-weight:400;color:#888;font-size:11px}
.seg{display:grid;gap:6px}
.seg button{padding:10px 4px;font-weight:600;background:#eef1f6;color:#555;border:2px solid transparent;font-size:14px}
.seg button.on{background:#d7efe9;color:#0b4d42;border-color:#0f6b5c}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chips button{padding:10px 14px;background:#eef1f6;border:2px solid transparent;font-weight:600;min-width:52px}
.chips button.on{background:#d7efe9;color:#0b4d42;border-color:#0f6b5c}
.chips button.gen{font-weight:400;font-style:italic}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer}
.fl b{font-size:15px}.fl span{font-size:12px;color:#777}
.fl .n{font-weight:700;color:#0f6b5c;white-space:nowrap}
.bal1{background:#f3f6fb;border-radius:10px;padding:12px;text-align:center}
.bal1 span{display:block;font-size:13px;color:#666}
.bal1 b{display:block;font-size:26px;color:#0f6b5c;direction:ltr;margin-top:4px}
.bal1.neg{background:#fde2e2}.bal1.neg b{color:#c62828}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-top:8px}
.sum div{background:#f3f6fb;border-radius:8px;padding:6px 8px}
.sum b{direction:ltr;display:inline-block}
.warnbar{background:#fff4e0;border:1px solid #e08a00;color:#7a4b00;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.negbar{background:#fde2e2;border:1px solid #d64545;color:#8a1c1c;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px}
.balnow{font-size:14px;font-weight:700;color:#0f6b5c;margin:-4px 0 10px;min-height:1.2em}
.balnow.neg{color:#c62828}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .in{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
.kv b{direction:ltr;white-space:nowrap}
.kv.neg b{color:#c62828}
.grp{font-weight:700;color:#0f6b5c;margin:14px 0 4px;font-size:14px;border-bottom:2px solid #d7efe9;padding-bottom:3px}
.grp2{font-weight:600;color:#555;margin:8px 0 2px 8px;font-size:13px}
.kv.ind{padding-left:16px}
#printArea{display:none}
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  header.top,main,.modal,#updBar{display:none!important}
  #printArea{display:block}
}
.sheet{font-family:Arial,Tahoma,sans-serif;color:#000;width:100%;font-size:12px;direction:ltr}
.sheet .hdr{display:flex;align-items:stretch;border:1px solid #1f2a5a;margin-bottom:6px}
.sheet .logo{background:#0f6b5c;color:#fff;font-size:20px;letter-spacing:4px;font-weight:300;padding:0 18px;display:flex;align-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{flex:1;text-align:center;padding:6px}
.sheet .ttl b{font-size:18px;display:block}
.sheet .ttl span{font-size:13px}
.sheet .per{padding:6px 12px;font-size:13px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid #1f2a5a;min-width:210px;text-align:center}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #1f2a5a;padding:2px 4px;text-align:center;vertical-align:middle;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:22px}
.sheet th{background:#8fd0c2;font-weight:700;font-size:11px;height:28px;white-space:normal;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet td.n{direction:ltr}
.sheet td.l{text-align:left}
.sheet .neg{color:#c00;font-weight:700}
.sheet tr.g td{background:#e2f2ee;font-weight:700;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet tr.tot td{background:#dde6f3;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ft{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
@media print{
  .pp{width:733px;height:1062px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .sheet.page{position:absolute;top:0;left:0;height:733px;transform-origin:top left;transform:translateX(733px) rotate(90deg)}
}
</style>
</head>
<body>
<header class="top"><h1 id="hdP">Stock</h1><div class="d"><span id="syncB" style="cursor:pointer"></span> <span id="hdDate"></span></div></header>
<main id="app"></main>
<div id="printArea"></div>
<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>
<script>
(function(){
"use strict";
/* All storage keys start with satcon_stock_ so this app never touches the report,
   attendance or cash box data (they share the same site in the browser). */
var KEY="satcon_stock_v1",LAST_KEY="satcon_stock_last";

/* ---------- data ----------
   items: materials {id,name,unit}
   blds:  buildings {id,name,floors:[{id,name,r,flats:[{id,name}]}]}  (r = sort rank: basements < ground < 1..n < custom < villa)
   tx:    movements {id,type,item,qty,date,at, ...}
          in : sup (supplier), rcpt, note
          out: bld, fl, flat, who (receiver), note     fl "" = whole building, flat "" = whole floor
          ret: same place fields as out, who (returned by), note
          adj: qty is the signed difference found by a stock count, cnt = counted quantity, note = reason
   Balances are never stored: balance = in + returns - out + count adjustments. */
function blank(){return{v:1,project:"",items:[],blds:[],tx:[],lastBackup:0}}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!Array.isArray(s.tx))s=blank();var b=blank(),k;for(k in b)if(s[k]===undefined)s[k]=b[k];return s}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Could not save. The device storage may be full.")}syncChanged()}
var LAST=(function(){try{return JSON.parse(localStorage.getItem(LAST_KEY))||{}}catch(e){return{}}})();
function saveLast(){try{localStorage.setItem(LAST_KEY,JSON.stringify(LAST))}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return(n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return isoDate(new Date())}
function fmtDate(iso){if(!iso)return"";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function r3(x){return Math.round(x*1000)/1000}
/* Arabic-Indic digits and separators typed on an Arabic keyboard -> plain digits */
function normDigits(s){return String(s||"").replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/٫/g,".").replace(/[٬،]/g,",")}
function parseQty(s){s=normDigits(s).replace(/[,\s]/g,"");if(!/^\d*\.?\d*$/.test(s)||s===""||s===".")return NaN;return parseFloat(s)}
function fmtQ(n){var neg=n<0;n=Math.abs(n);return(neg?"-":"")+n.toLocaleString("en-US",{maximumFractionDigits:3})}
function clean(s){return normDigits(s).trim().replace(/\s+/g," ")}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function byName(a,b){return a.localeCompare(b,"ar",{numeric:true})}
function $(id){return document.getElementById(id)}
function each(sel,f){Array.prototype.forEach.call(document.querySelectorAll(sel),f)}

var TL={in:"Incoming",out:"Outgoing",ret:"Return",adj:"Stock Count"};
var TS={in:"+",out:"−",ret:"↩",adj:"⚖"};
function itemById(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null}
function itemName(id){var i=itemById(id);return i?i.name:"(deleted material)"}
function itemUnit(id){var i=itemById(id);return i?i.unit:""}
function itemsSorted(){return S.items.slice().sort(function(a,b){return byName(a.name,b.name)})}
function bldById(id){for(var i=0;i<S.blds.length;i++)if(S.blds[i].id===id)return S.blds[i];return null}
function bldsSorted(){return S.blds.slice().sort(function(a,b){return byName(a.name,b.name)})}
function floorsOf(b){return(b&&b.floors||[]).slice().sort(function(x,y){return x.r!==y.r?x.r-y.r:byName(x.name,y.name)})}
function flById(b,id){if(!b)return null;for(var i=0;i<b.floors.length;i++)if(b.floors[i].id===id)return b.floors[i];return null}
function flatById(f,id){if(!f)return null;for(var i=0;i<f.flats.length;i++)if(f.flats[i].id===id)return f.flats[i];return null}
function flatsOf(f){return(f&&f.flats||[]).slice().sort(function(a,b){return byName(a.name,b.name)})}
function bldLabel(b){return!b?"?":(/^[0-9]/.test(b.name)?"Building "+b.name:b.name)}
/* where an outgoing or return went, as text */
function place(t,short){var b=bldById(t.bld);if(!b)return t.bld?"(deleted building)":"";
  var s=short?(/^[0-9]/.test(b.name)?"Bldg "+b.name:b.name):bldLabel(b);if(!t.fl)return s+" · Whole building";
  var f=flById(b,t.fl);s+=" · "+(f?f.name:"?");if(!t.flat)return s+" · Whole floor";
  var x=flatById(f,t.flat);return s+" · Flat "+(x?x.name:"?")}
function sgn(t){return t.type==="out"?-t.qty:t.qty}
function byOrder(a,b){if(a.date!==b.date)return a.date<b.date?-1:1;return(a.at||0)-(b.at||0)}
function sorted(){return S.tx.slice().sort(byOrder)}
function txById(id){for(var i=0;i<S.tx.length;i++)if(S.tx[i].id===id)return S.tx[i];return null}
/* balance of every material, optionally only movements before a date, optionally leaving one movement out */
function balances(before,skipId){var m={};S.items.forEach(function(i){m[i.id]=0});
  S.tx.forEach(function(t){if(t.id===skipId)return;if(before&&t.date>=before)return;m[t.item]=r3((m[t.item]||0)+sgn(t))});return m}
function balOf(item,skipId){var b=0;S.tx.forEach(function(t){if(t.item===item&&t.id!==skipId)b=r3(b+sgn(t))});return b}
function usesOf(f){return S.tx.filter(f).length}

/* ---------- modal ---------- */
var modal=$("modal"),modalIn=$("modalIn");
function openModal(h){modalIn.innerHTML=h;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show");modalIn.innerHTML=""}
function info(title,body){openModal('<h3>'+title+'</h3>'+(body?'<p>'+body+'</p>':'')+'<div class="acts"><button id="mN">OK</button></div>');$("mN").onclick=closeModal}
function confirmBox(title,body,yes,cls,cb){openModal('<h3>'+title+'</h3>'+(body?'<p>'+body+'</p>':'')+'<div class="acts"><button id="mY" class="'+(cls||"pri")+'">'+yes+'</button><button id="mN">Cancel</button></div>');
  $("mN").onclick=closeModal;$("mY").onclick=function(){closeModal();cb()}}

/* ---------- navigation: each screen is a #hash so the phone's back button works ---------- */
function go(h){location.hash=h}
window.addEventListener("hashchange",function(){closeModal();render();scrollTo(0,0)});
var app=$("app");
function render(){
  updBadge();$("syncB").onclick=function(){go("settings")};
  $("hdP").textContent="Stock"+(S.project?" - "+S.project:"");$("hdP").onclick=function(){go("")};
  $("hdDate").textContent=fmtDate(today());
  var h=location.hash.replace(/^#/,""),m;
  if(m=/^new-(in|out|ret|adj)$/.exec(h))return formView(null,m[1]);
  if(/^edit-.+$/.test(h)){var t=txById(h.slice(5));if(t)return formView(t,t.type)}
  if(/^item-.+$/.test(h)&&itemById(h.slice(5)))return itemView(h.slice(5));
  if(h==="items")return itemsView();
  if(h==="blds")return bldsView();
  if(/^bld-.+$/.test(h)&&bldById(h.slice(4)))return bldView(h.slice(4));
  if(h==="rep")return repView();
  if(h==="log")return logView();
  if(h==="print")return printView();
  if(h==="settings")return settingsView();
  mainView();
}

/* ---------- rows ---------- */
function txTitle(t){return itemName(t.item)}
function txSub(t){var a=[fmtDate(t.date)];
  if(t.type==="in"){if(t.sup)a.push(esc(t.sup));if(t.rcpt)a.push("Rcpt "+esc(t.rcpt))}
  else if(t.type==="out"||t.type==="ret"){a.push(esc(place(t,true)));if(t.who)a.push(esc(t.who))}
  else a.push("Count: "+fmtQ(t.cnt)+(t.note?" · "+esc(t.note):""));
  return a.join(" · ")}
function txRow(t,run){
  return'<div class="tx" data-id="'+t.id+'"><div class="ic '+t.type+'">'+TS[t.type]+'</div>'+
    '<div class="mid"><b dir="auto">'+esc(txTitle(t))+'</b><span dir="auto">'+txSub(t)+'</span></div>'+
    '<div class="am '+t.type+'">'+(sgn(t)>=0?"+":"−")+fmtQ(Math.abs(t.qty))+' <span style="font-weight:400;font-size:12px">'+esc(itemUnit(t.item))+'</span>'+(run!=null?'<small'+(run<0?' style="color:#c62828"':'')+'>Bal. '+fmtQ(run)+'</small>':'')+'</div></div>'}
function bindRows(){each("#app .tx",function(el){el.onclick=function(){go("edit-"+el.getAttribute("data-id"))}})}
function itemRow(i,b){return'<div class="it'+(b<0?' neg':'')+'" data-item="'+i.id+'" data-name="'+esc(i.name.toLowerCase())+'"><div class="mid"><b dir="auto">'+esc(i.name)+'</b></div><div class="q">'+fmtQ(b)+' <small>'+esc(i.unit)+'</small></div></div>'}
function bindItems(){each("#app .it",function(el){el.onclick=function(){go("item-"+el.getAttribute("data-item"))}})}

/* ---------- main screen ---------- */
function mainView(){
  var bal=balances(),its=itemsSorted(),negs=its.filter(function(i){return bal[i.id]<0}),h="";
  var days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(S.tx.length&&(days===null||days>=7))
    h+='<div class="warnbar"><span>'+(days===null?'No backup has been made yet.':'Last backup was '+days+' days ago.')+'</span><button class="small" id="bkNow">Back up now</button></div>';
  if(negs.length)h+='<div class="negbar">⚠ '+negs.length+' material'+(negs.length>1?'s have':' has')+' a negative balance. An incoming delivery may not have been recorded.</div>';
  h+='<div class="four" style="margin-bottom:12px"><button class="big ok" style="font-size:15px;padding:16px 2px" id="bIn">+ In</button><button class="big dan" style="font-size:15px;padding:16px 2px" id="bOut">− Out</button>'+
    '<button class="big bret" style="font-size:15px;padding:16px 2px" id="bRet">↩ Return</button><button class="big bcnt" style="font-size:15px;padding:16px 2px" id="bAdj">⚖ Count</button></div>';
  h+='<div class="box"><h2>Stock Balances</h2>';
  if(!its.length)h+='<p class="muted">No materials yet. Add your materials first (cement, steel, blocks, ...).</p><button class="pri" id="bAddM">+ Add Materials</button>';
  else h+=(its.length>8?'<input type="text" id="iQ" dir="auto" placeholder="🔍 Search material" style="width:100%;margin-bottom:4px">':'')+its.map(function(i){return itemRow(i,bal[i.id])}).join("");
  h+='</div>';
  var last=sorted().reverse().slice(0,12);
  h+='<div class="box"><h2>Recent Movements</h2>'+(last.length?last.map(function(t){return txRow(t)}).join(""):'<p class="muted">No movements recorded yet.</p>')+'</div>';
  h+='<div class="three" style="margin-bottom:8px"><button id="bIt">📦 Materials</button><button id="bBl">🏢 Buildings</button><button id="bRep">📊 Reports</button></div>'+
    '<div class="three"><button id="bLog">📋 Records</button><button id="bPr">🖨 Print</button><button id="bSet">⚙ Settings</button></div>';
  app.innerHTML=h;bindRows();bindItems();
  var q=$("iQ");if(q)q.oninput=function(){var v=q.value.trim().toLowerCase();each("#app .it",function(el){el.style.display=!v||el.getAttribute("data-name").indexOf(v)>=0?"":"none"})};
  $("bIn").onclick=function(){go("new-in")};$("bOut").onclick=function(){go("new-out")};
  $("bRet").onclick=function(){go("new-ret")};$("bAdj").onclick=function(){go("new-adj")};
  $("bIt").onclick=function(){go("items")};$("bBl").onclick=function(){go("blds")};$("bRep").onclick=function(){go("rep")};
  $("bLog").onclick=function(){go("log")};$("bPr").onclick=function(){go("print")};$("bSet").onclick=function(){go("settings")};
  var a=$("bAddM");if(a)a.onclick=function(){go("items")};
  var bk=$("bkNow");if(bk)bk.onclick=backup;
}

/* ---------- materials ---------- */
function itemModal(it,done){
  openModal('<h3>'+(it?'Edit Material':'New Material')+'</h3>'+
    '<div class="row"><label>Name</label><input type="text" id="mNm" dir="auto" value="'+esc(it?it.name:"")+'" placeholder="e.g. Cement"></div>'+
    '<div class="row"><label>Unit</label><input type="text" id="mUn" dir="auto" value="'+esc(it?it.unit:"")+'" placeholder="e.g. bag, ton, m³, piece"></div>'+

/* one material: its balance and every movement with the running balance */
var ITEM_TAB="all";

  sorted().forEach(function(t){if(t.item!==id)return;run=r3(run+sgn(t));tot[t.type]=r3(tot[t.type]+t.qty);rows.push({t:t,run:run})});

    '<div class="sum"><div>Total in: <b>'+fmtQ(tot.in)+'</b></div><div>Total out: <b>'+fmtQ(tot.out)+'</b></div><div>Returns: <b>'+fmtQ(tot.ret)+'</b></div><div>Count adjustments: <b>'+(tot.adj>0?"+":"")+fmtQ(tot.adj)+'</b></div></div></div>'+

    (list.length?list.map(function(r){return txRow(r.t,r.run)}).join(""):'<p class="muted">No movements.</p>')+'</div>'+
    '<div class="two" style="margin-bottom:8px"><button class="ok" id="iIn">+ In</button><button class="dan" id="iOut">− Out</button></div>'+

    '<button class="big" id="iBack">Back</button>';

  app.innerHTML=h;

  function showBal(){var id=$("fI").value,el=$("fBal");$("fU").textContent=id?itemUnit(id):"";

  if(isPlace){
    var paintB=function(){$("fBl").innerHTML=bldsSorted().map(function(b){return'<button data-b="'+b.id+'" class="'+(b.id===F.bld?"on":"")+'">'+esc(b.name)+'</button>'}).join("");
      each("#fBl button",function(x){x.onclick=function(){if(F.bld!==x.getAttribute("data-b")){F.bld=x.getAttribute("data-b");F.fl="";F.flat=""}paintB();paintF()}})};

/* "301" on floor 3 becomes "401" on floor 4 */
function renum(name,from,to){var s=String(from);if(from>0&&name.length>s.length&&name.indexOf(s)===0&&/^\d+$/.test(name.slice(s.length)))return to+name.slice(s.length);return name}

    '<div class="row"><input type="text" id="fmN" dir="auto" value="'+esc(f.name)+'"><button class="small" id="fmNS">Rename</button></div>'+

    '<div class="chips" id="fmF" style="margin-bottom:10px">'+(fl.length?fl.map(function(x){return'<button data-t="'+x.id+'">'+esc(x.name)+'</button>'}).join(""):'<span class="muted">No flats on this floor.</span>')+'</div>'+
    '<div class="row"><input type="text" id="fmA" dir="auto" placeholder="e.g. 301, 302, 303 or A, B, C"><button class="ok small" id="fmAB">+ Add</button></div>'+
    (isNum&&fl.length?'<div class="grp">Copy these flats to other floors</div><div class="row"><span>Floors</span><input type="text" id="cpF" inputmode="numeric" value="'+(f.r+1)+'" style="max-width:64px"><span>to</span><input type="text" id="cpT" inputmode="numeric" style="max-width:64px"><button class="pri small" id="cpB">Copy</button></div>'+

/* ---------- reports: what each building, floor and flat consumed (outgoing minus returns) ---------- */
var RF={bld:"",fl:"",flat:"*",from:"",to:"",item:""};
function inRange(t,from,to){return(!from||t.date>=from)&&(!to||t.date<=to)}
/* net consumption per material for the movements that pass "f" */
function consume(f){var m={};S.tx.forEach(function(t){if((t.type!=="out"&&t.type!=="ret")||!f(t))return;m[t.item]=r3((m[t.item]||0)+(t.type==="out"?t.qty:-t.qty))});return m}
function matList(m){return Object.keys(m).filter(function(k){return m[k]!==0}).sort(function(a,b){return byName(itemName(a),itemName(b))})}
function kvMat(m,cls){var ks=matList(m);if(!ks.length)return'<p class="muted" style="margin:4px 0 4px 8px">Nothing.</p>';
  return ks.map(function(k){return'<div class="kv'+(cls?" "+cls:"")+'"><span dir="auto">'+esc(itemName(k))+'</span><b>'+fmtQ(m[k])+' '+esc(itemUnit(k))+'</b></div>'}).join("")}
function repView(){

    (b?'<div class="row"><label>Floor</label><select id="rF"><option value="">All floors</option>'+floorsOf(b).map(function(x){return'<option value="'+x.id+'"'+(x.id===RF.fl?' selected':'')+'>'+esc(x.name)+'</option>'}).join("")+'</select></div>':'')+
    (f?'<div class="row"><label>Flat</label><select id="rT"><option value="*">All flats</option><option value=""'+(RF.flat===""?' selected':'')+'>Whole floor (general)</option>'+flatsOf(f).map(function(x){return'<option value="'+x.id+'"'+(x.id===RF.flat?' selected':'')+'>Flat '+esc(x.name)+'</option>'}).join("")+'</select></div>':'')+
    '<div class="row"><label>From</label><input type="date" id="rFr" value="'+RF.from+'"></div><div class="row"><label>To</label><input type="date" id="rTo" value="'+RF.to+'"></div>'+
    '<p class="hint" style="margin:-4px 0 0">Leave the dates empty for all time. Quantities are outgoing minus returns.</p></div><div class="box" id="rOut"></div>'+
    '<div class="two"><button class="pri" id="rPr">🖨 Print this report</button><button id="rBack">Back</button></div>';
  app.innerHTML=h;
  function rd(){RF.from=$("rFr").value;RF.to=$("rTo").value;var o="",fr=RF.from,to=RF.to;
    if(!b){o='<h2>All buildings</h2>';var all=consume(function(t){return inRange(t,fr,to)});o+='<div class="grp">Total</div>'+kvMat(all);
      bs.forEach(function(x){o+='<div class="grp">'+esc(bldLabel(x))+'</div>'+kvMat(consume(function(t){return t.bld===x.id&&inRange(t,fr,to)}))})}
    else if(!f){o='<h2 dir="auto">'+esc(bldLabel(b))+'</h2><div class="grp">Building total</div>'+kvMat(consume(function(t){return t.bld===b.id&&inRange(t,fr,to)}));
      var g=consume(function(t){return t.bld===b.id&&!t.fl&&inRange(t,fr,to)});if(matList(g).length)o+='<div class="grp">Whole building (general)</div>'+kvMat(g);
      floorsOf(b).forEach(function(x){var m=consume(function(t){return t.bld===b.id&&t.fl===x.id&&inRange(t,fr,to)});if(matList(m).length)o+='<div class="grp">'+esc(x.name)+'</div>'+kvMat(m)})}
    else{o='<h2 dir="auto">'+esc(bldLabel(b))+' · '+esc(f.name)+'</h2>';
      var base=function(t){return t.bld===b.id&&t.fl===f.id&&inRange(t,fr,to)};
      if(RF.flat==="*"){o+='<div class="grp">Floor total</div>'+kvMat(consume(base));
        var g2=consume(function(t){return base(t)&&!t.flat});if(matList(g2).length)o+='<div class="grp">Whole floor (general)</div>'+kvMat(g2);

/* ---------- printing (A4 landscape sheets, same layout as the other SATCON apps) ---------- */
var PAGE_W=1062,PAGE_H=733,TOP_H=74,TH_H=30,FT_H=22,ROW_H=22;
var PF={kind:"bal",item:"",bld:"",fl:"",flat:"*",from:"",to:""};
var PK={bal:"Stock Balances",in:"Incoming Materials",out:"Outgoing Materials",ret:"Returned Materials",card:"Material Card",rep:"Consumption Report"};
function monthRange(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);var a=isoDate(d);d.setMonth(d.getMonth()+1);d.setDate(0);return[a,isoDate(d)]}
function nC(v,cls){return'<td class="n'+(cls?" "+cls:"")+(typeof v==="number"&&v<0?" neg":"")+'">'+(v===""||v==null?"":fmtQ(v))+'</td>'}
function tC(v,l){return'<td'+(l?' class="l"':'')+' dir="auto">'+esc(v)+'</td>'}
function paginate(o){
  var cap=PAGE_H-TOP_H-TH_H-FT_H,pages=[],cur=[],used=0;
  o.rows.forEach(function(r){var hh=r.h||ROW_H;if(used+hh>cap&&cur.length){pages.push(cur);cur=[];used=0}cur.push(r);used+=hh});
  var lastH=(o.last||[]).reduce(function(a,r){return a+(r.h||ROW_H)},0);
  if(used+lastH>cap&&cur.length){pages.push(cur);cur=[];used=0}
  (o.last||[]).forEach(function(r){cur.push(r)});pages.push(cur);
  var N=pages.length,printed=fmtDate(today());
  var per=o.per||(!o.from?'Up to <b>'+fmtDate(o.to)+'</b>':o.from===o.to?'Date: <b>'+fmtDate(o.from)+'</b>':'From <b>'+fmtDate(o.from)+'</b> to <b>'+fmtDate(o.to)+'</b>');
  return pages.map(function(pg,pi){
    return'<div class="sheet page" style="width:'+PAGE_W+'px">'+
      '<div class="hdr" style="height:'+(TOP_H-8)+'px"><div class="logo">SATCON</div><div class="ttl"><b>'+o.title+'</b><span dir="auto">'+esc(o.sub||S.project||"")+'</span></div>'+
      '<div class="per"><div>'+per+'</div></div></div>'+
      '<table>'+o.colg+o.head+pg.map(function(r){return r.html}).join("")+'</table>'+
      '<div class="ft"><span>Printed on: '+printed+'</span><span>Page '+(pi+1)+' of '+N+'</span></div></div>'});
}
function txRange(type){return sorted().filter(function(t){return t.type===type&&inRange(t,PF.from,PF.to)&&(type==="in"||!PF.bld||(t.bld===PF.bld&&(!PF.fl||(t.fl===PF.fl&&(PF.flat==="*"||t.flat===PF.flat)))))})}
function placeParts(t){var b=bldById(t.bld),f=flById(b,t.fl),x=flatById(f,t.flat);return[b?b.name:"?",t.fl?(f?f.name:"?"):"Whole building",t.fl?(t.flat?(x?x.name:"?"):"Whole floor"):""]}
function scopeText(){var b=bldById(PF.bld);if(!b)return S.project||"";var f=flById(b,PF.fl),s=bldLabel(b);if(f){s+=" · "+f.name;if(PF.flat!=="*"){var x=flatById(f,PF.flat);s+=" · "+(x?"Flat "+x.name:"Whole floor (general)")}}return s}
function makePages(){var k=PF.kind,rows=[],last=[];
  if(k==="bal"){var bal=balances(addDays(PF.to,1));
    itemsSorted().forEach(function(i,n){rows.push({html:'<tr><td>'+(n+1)+'</td>'+tC(i.name,1)+tC(i.unit)+nC(bal[i.id],"")+'</tr>'})});
    if(!rows.length)rows.push({html:'<tr><td colspan="4">No materials</td></tr>'});
    return paginate({title:PK.bal,per:'Balances as of <b>'+fmtDate(PF.to)+'</b>',rows:rows,
      colg:'<colgroup><col style="width:44px"><col><col style="width:140px"><col style="width:180px"></colgroup>',head:'<tr><th>No.</th><th>Material</th><th>Unit</th><th>Balance in Store</th></tr>'})}
  if(k==="in"){var L=txRange("in"),tot={};
    L.forEach(function(t,n){tot[t.item]=r3((tot[t.item]||0)+t.qty);rows.push({html:'<tr><td>'+(n+1)+'</td><td>'+fmtDate(t.date)+'</td>'+tC(itemName(t.item),1)+tC(itemUnit(t.item))+nC(t.qty)+tC(t.sup,1)+tC(t.rcpt)+tC(t.note,1)+'</tr>'})});
    if(!L.length)rows.push({html:'<tr><td colspan="8">No incoming materials in this period</td></tr>'});
    matList(tot).forEach(function(i){last.push({html:'<tr class="tot"><td colspan="2">Total</td>'+tC(itemName(i),1)+tC(itemUnit(i))+nC(tot[i])+'<td colspan="3"></td></tr>'})});
    return paginate({title:PK.in,from:PF.from,to:PF.to,rows:rows,last:last,
      colg:'<colgroup><col style="width:40px"><col style="width:84px"><col style="width:190px"><col style="width:70px"><col style="width:90px"><col style="width:170px"><col style="width:90px"><col></colgroup>',
      head:'<tr><th>No.</th><th>Date</th><th>Material</th><th>Unit</th><th>Quantity</th><th>Supplier</th><th>Receipt No.</th><th>Note</th></tr>'})}
  if(k==="out"||k==="ret"){var L2=txRange(k),tot2={};
    L2.forEach(function(t,n){var p=placeParts(t);tot2[t.item]=r3((tot2[t.item]||0)+t.qty);
      rows.push({html:'<tr><td>'+(n+1)+'</td><td>'+fmtDate(t.date)+'</td>'+tC(itemName(t.item),1)+tC(itemUnit(t.item))+nC(t.qty)+tC(p[0])+tC(p[1])+tC(p[2])+tC(t.who,1)+tC(t.note,1)+'</tr>'})});
    if(!L2.length)rows.push({html:'<tr><td colspan="10">Nothing in this period</td></tr>'});
    matList(tot2).forEach(function(i){last.push({html:'<tr class="tot"><td colspan="2">Total</td>'+tC(itemName(i),1)+tC(itemUnit(i))+nC(tot2[i])+'<td colspan="5"></td></tr>'})});
    return paginate({title:PK[k],sub:scopeText(),from:PF.from,to:PF.to,rows:rows,last:last,
      colg:'<colgroup><col style="width:36px"><col style="width:80px"><col style="width:170px"><col style="width:62px"><col style="width:80px"><col style="width:80px"><col style="width:100px"><col style="width:80px"><col style="width:130px"><col></colgroup>',
      head:'<tr><th>No.</th><th>Date</th><th>Material</th><th>Unit</th><th>Quantity</th><th>Building</th><th>Floor</th><th>Flat</th><th>'+(k==="out"?"Received by":"Returned by")+'</th><th>Note</th></tr>'})}
  if(k==="card"){var it=itemById(PF.item),open=0,run;if(!it)return[];
    S.tx.forEach(function(t){if(t.item===it.id&&PF.from&&t.date<PF.from)open=r3(open+sgn(t))});run=open;
    if(PF.from)rows.push({html:'<tr class="g"><td colspan="6">Balance brought forward before '+fmtDate(PF.from)+'</td>'+nC(open)+'</tr>'});
    sorted().forEach(function(t){if(t.item!==it.id||!inRange(t,PF.from,PF.to))return;run=r3(run+sgn(t));
      var d=t.type==="in"?[t.sup,t.rcpt?"Rcpt "+t.rcpt:"",t.note].filter(Boolean).join(" · "):t.type==="adj"?"Stock count: "+fmtQ(t.cnt)+(t.note?" · "+t.note:""):place(t,true)+(t.who?" · "+t.who:"")+(t.note?" · "+t.note:"");
      rows.push({html:'<tr><td>'+fmtDate(t.date)+'</td>'+tC(TL[t.type])+tC(d,1)+nC(t.type==="in"||t.type==="ret"||(t.type==="adj"&&t.qty>0)?Math.abs(t.qty):"")+nC(t.type==="out"||(t.type==="adj"&&t.qty<0)?Math.abs(t.qty):"")+'<td></td>'+nC(run)+'</tr>'})});
    last.push({html:'<tr class="tot"><td colspan="6">Balance at '+fmtDate(PF.to)+'</td>'+nC(run)+'</tr>'});
    return paginate({title:PK.card+': '+esc(it.name)+' ('+esc(it.unit)+')',from:PF.from,to:PF.to,rows:rows,last:last,
      colg:'<colgroup><col style="width:84px"><col style="width:90px"><col><col style="width:100px"><col style="width:100px"><col style="width:0"><col style="width:110px"></colgroup>',
      head:'<tr><th>Date</th><th>Type</th><th>Details</th><th>In</th><th>Out</th><th></th><th>Balance</th></tr>'})}
  if(k==="rep"){var b=bldById(PF.bld),fr=PF.from,to=PF.to,grp=function(title,m){var ks=matList(m);if(!ks.length)return;rows.push({html:'<tr class="g"><td colspan="3" dir="auto">'+esc(title)+'</td></tr>'});
      ks.forEach(function(i){rows.push({html:'<tr>'+tC(itemName(i),1)+tC(itemUnit(i))+nC(m[i])+'</tr>'})})};
    var f=flById(b,PF.fl),scope=function(t){return inRange(t,fr,to)&&(!b||t.bld===b.id)&&(!f||t.fl===f.id)&&(!f||PF.flat==="*"||t.flat===PF.flat)};
    if(!b)bldsSorted().forEach(function(x){grp(bldLabel(x),consume(function(t){return t.bld===x.id&&inRange(t,fr,to)}))});
    else if(!f){grp("Whole building (general)",consume(function(t){return scope(t)&&!t.fl}));floorsOf(b).forEach(function(x){grp(x.name,consume(function(t){return scope(t)&&t.fl===x.id}))})}
    else if(PF.flat==="*"){grp("Whole floor (general)",consume(function(t){return scope(t)&&!t.flat}));flatsOf(f).forEach(function(x){grp("Flat "+x.name,consume(function(t){return scope(t)&&t.flat===x.id}))})}

/* ---------- sync between devices (Firebase) ----------
   Everything lives in one collection "d": one document per material (i...), building (b...)
   and movement (t...), plus "__meta" for the project name. The phone and the laptop keep their
   own copy in localStorage and work without internet. Every local change is noted in PEND until
   the server confirms it, so nothing is lost if the app closes while offline. Changes from the
   server never overwrite a record that still has an unsent local change. */
var FB_CFG=null; /* filled in once the Firebase project for the stock app exists */

function allRecs(){var m={"__meta":JSON.stringify({project:S.project||""})};
  S.items.forEach(function(x){m[x.id]=JSON.stringify(x)});S.blds.forEach(function(x){m[x.id]=JSON.stringify(x)});S.tx.forEach(function(x){m[x.id]=JSON.stringify(x)});return m}

function withNet(p){return Promise.race([p,new Promise(function(r,j){setTimeout(function(){j(new Error("timeout"))},25000)})])}

    withNet(ensureFb().then(function(){return fbx.signInWithEmailAndPassword(fauth,em,pw)})).then(function(cred){
      SY.email=em;SY.uid=cred.user.uid;saveSY();
      if(SY.on){SST.err="";SST.ready=true;shadowInit();listen();flush();render();return}
      return withNet(fbx.getDocsFromServer(fbx.query(fbx.collection(fdb,"d"),fbx.limit(1)))).then(function(q){
        if(q.empty)return firstUpload();
        var local=S.tx.length+S.items.length+S.blds.length;
        if(!local)return download();
        openModal('<h3>Data found on the server</h3><p>This device will load the server data, and <b>the data on this device ('+S.items.length+' materials, '+S.tx.length+' movements) will be replaced</b>.</p><p class="hint">If this device holds anything not on the server, create a backup first.</p>'+
          '<div class="acts" style="flex-direction:column"><button id="mBk">💾 Create Backup First</button><button id="mY" class="dan">Continue and Load Server Data</button><button id="mN">Cancel</button></div>');
        $("mBk").onclick=backup;
        $("mN").onclick=function(){closeModal();fbx.signOut(fauth);render()};
        $("mY").onclick=function(){closeModal();download()};
      });
    }).catch(function(e){bIn.disabled=false;er.style.color="";er.textContent=authMsg(e)});
  };
  var bNow=$("syNow");if(bNow)bNow.onclick=function(){if(!SST.ready)startSync();else flush();updBadge()};
  var bOut=$("syOut");if(bOut)bOut.onclick=function(){var n=pendN();
    openModal('<h3>Sign out of sync?</h3><p>Your data stays on this device but will no longer sync.</p>'+(n?'<p class="err">'+n+' change(s) have not been uploaded yet and will not reach the server.</p>':'')+
      '<div class="acts"><button id="mY" class="dan">Sign Out</button><button id="mN">Cancel</button></div>');
    $("mN").onclick=closeModal;
    $("mY").onclick=function(){stopListen();try{fbx.signOut(fauth)}catch(e){}SY.on=false;saveSY();PEND={};savePend();SST.ready=false;closeModal();render()}};
}
/* first device: send everything on this device */
function firstUpload(){var all=allRecs();for(var k in all)mark(k);
  savePend();SY.on=true;saveSY();SST.ready=true;shadowInit();listen();flush();
  info("✓ Connected","Uploading this device's data ("+pendN()+" items). Keep the app open and online until the indicator turns 🟢, then sign in on the other device.");render()}
/* other devices: take the server's data in place of this device's */
function download(){
  openModal('<h3 style="text-align:center">Downloading data...</h3>');
  withNet(fbx.getDocsFromServer(fbx.collection(fdb,"d"))).then(function(q){
    var ns=blank();ns.lastBackup=S.lastBackup;var keep=S;S=ns;
    q.docs.forEach(function(d){var x=d.data()||{};delete x.k;if(!x.deleted)applyRec(d.id,x)});
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){S=keep;throw e}
    PEND={};savePend();SY.on=true;saveSY();SST.ready=true;shadowInit();listen();
    closeModal();go("");render();
    setTimeout(function(){info("✓ Connected",S.items.length+" materials, "+S.blds.length+" buildings and "+S.tx.length+" movements downloaded. Anything recorded here will appear on the other device.")},150);
  }).catch(function(e){closeModal();info("Download failed",authMsg(e));try{fbx.signOut(fauth)}catch(x){}});
}

window.__updateReady=function(){
  if($("updBar"))return;
  var b=document.createElement("div");b.id="updBar";
  b.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#1f9d55;color:#fff;padding:12px;display:flex;align-items:center;justify-content:space-between;z-index:60;font-size:15px";
  b.innerHTML='<span>A new version of the app is available</span><button style="background:#fff;color:#1f9d55;font-weight:700">Update Now</button>';
  b.querySelector("button").onclick=function(){location.reload()};document.body.appendChild(b);
};
if(SY.on)shadowInit();
render();
startSync();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!NATIVE){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})}
})();
</script>
