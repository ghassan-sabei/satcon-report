<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3a67">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>الصندوق - SATCON</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#eef1f6;color:#1d2433;font-size:16px}
header.top{background:#2b3a67;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0}
header.top .d{font-size:14px;opacity:.85}
main{padding:12px;max-width:680px;margin:0 auto;padding-bottom:40px}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:16px;margin:0 0 10px;color:#2b3a67}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row label{min-width:96px;font-size:14px;color:#555}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;padding:10px;border:1px solid #c8cfdb;border-radius:8px;flex:1;min-width:0;background:#fff}
input.bad{border-color:#d64545;background:#fff5f5}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:#dfe5f0;color:#1d2433}
button:active{transform:scale(.97)}
.big{width:100%;padding:16px;font-size:18px;font-weight:600}
.pri{background:#2f6fd6;color:#fff}
.ok{background:#1f9d55;color:#fff}
.dan{background:#d64545;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.small{padding:8px 10px;font-size:14px}
.muted{color:#888;font-size:13px}
.hint{font-size:12px;color:#777;margin:4px 0 0}
.err{color:#d64545;font-size:13px;margin:4px 0 0;min-height:1em}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.bal div{background:#f3f6fb;border-radius:10px;padding:12px 4px}
.bal span{display:block;font-size:13px;color:#666}
.bal b{display:block;font-size:24px;color:#2b3a67;direction:ltr;margin-top:4px}
.bal .neg{background:#fde2e2}
.bal .neg b{color:#c62828}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.seg button{padding:12px 6px;font-weight:600;background:#eef1f6;color:#555;border:2px solid transparent}
.seg button.on.in{background:#d8f0e1;color:#14532d;border-color:#1f9d55}
.seg button.on.out{background:#fde2e2;color:#8a1c1c;border-color:#d64545}
.seg button.on.cur{background:#dce8fb;color:#1a3f8a;border-color:#2f6fd6}
.prev{font-size:15px;font-weight:700;color:#2b3a67;margin:-4px 0 8px;direction:rtl;min-height:1.2em}
.tx{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eee;cursor:pointer}
.tx:last-child{border:0}
.tx .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tx .ic.in{background:#d8f0e1;color:#1f9d55}
.tx .ic.out{background:#fde2e2;color:#d64545}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:12px;color:#777}
.tx .am{font-weight:700;direction:ltr;white-space:nowrap;font-size:15px}
.tx .am.in{color:#1f9d55}
.tx .am.out{color:#d64545}
.tx .ic.adv{background:#ffe9c7;color:#b26a00}
.tx .am.adv{color:#b26a00}
.seg button.on.adv{background:#ffe9c7;color:#7a4b00;border-color:#e08a00}
.bseg{display:flex;flex-wrap:wrap;gap:6px;flex:1}.bseg button{padding:10px 14px;background:#eef1f6;border:2px solid transparent;font-weight:600;min-width:52px}.bseg button.on{background:#e6dcfb;color:#4b2a8a;border-color:#7a4fd6}
.adv-btn{background:#e08a00;color:#fff}
.wk{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer}
.wk b{font-size:15px}.wk span{font-size:12px;color:#777}.wk .t{direction:ltr;text-align:left;font-weight:700;color:#b26a00;font-size:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-top:8px}
.sum div{background:#f3f6fb;border-radius:8px;padding:6px 8px}
.sum b{direction:ltr;display:inline-block}
.warnbar{background:#fff4e0;border:1px solid #e08a00;color:#7a4b00;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .in{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}
.kv b{direction:ltr}
#printArea{display:none}

/* ===== print sheet (A4 landscape) ===== */
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  header.top,main,.modal,#updBar{display:none!important}
  #printArea{display:block}
}
.sheet{font-family:Arial,Tahoma,sans-serif;color:#000;width:100%;font-size:12px;direction:rtl}
.sheet .hdr{display:flex;align-items:stretch;border:1px solid #1f2a5a;margin-bottom:6px}
.sheet .logo{background:#2b3a67;color:#fff;font-size:20px;letter-spacing:4px;font-weight:300;padding:0 18px;display:flex;align-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{flex:1;text-align:center;padding:6px}
.sheet .ttl b{font-size:18px;display:block}
.sheet .ttl span{font-size:13px}
.sheet .per{padding:6px 12px;font-size:13px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid #1f2a5a;min-width:200px;text-align:center}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #1f2a5a;padding:2px 4px;text-align:center;vertical-align:middle;overflow:hidden}
.sheet th{background:#5b9bd5;font-weight:700;font-size:11px;height:28px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet th.iq{background:#9cc2e5}
.sheet th.us{background:#a9d18e}
.sheet td.n{direction:ltr;font-size:12px;white-space:nowrap}
.sheet td.ds{text-align:right;font-size:12px;line-height:15px}
.sheet td.ds div{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet td.bl{font-weight:700;background:#f2f2f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .neg{color:#c00}
.sheet tr.cf td{background:#fff2cc;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet tr.tot td{background:#dde6f3;font-weight:700;height:26px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ft{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
@media print{
  .pp{width:733px;height:1062px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .sheet.page{position:absolute;top:0;left:0;height:733px;transform-origin:top left;transform:translateX(733px) rotate(90deg)}
}
</style>
</head>
<body>
<header class="top"><h1 id="hdP">الصندوق</h1><div class="d" id="hdDate"></div></header>
<main id="app"></main>
<div id="printArea"></div>
<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>
<script>
(function(){
"use strict";
/* All storage keys start with satcon_sandoq_ so this app never touches the
   daily report or attendance data (they share the same site in the browser). */
var KEY="satcon_sandoq_v1";
var CUR={IQD:{n:"دينار",s:"د.ع"},USD:{n:"دولار",s:"$"}};
var S=load();
function blank(){return{v:1,project:"",open:{IQD:0,USD:0},tx:[],seq:1,lastBackup:0,lastCur:"IQD",blds:[]}}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!s.tx)s=blank();
  var b=blank(),k;for(k in b)if(s[k]===undefined)s[k]=b[k];
  if(!s.open)s.open={IQD:0,USD:0};
  return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("ما قدر يحفظ! الذاكرة ممتلئة؟")}}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return(n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return isoDate(new Date())}
function fmtDate(iso){if(!iso)return"";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function r2(x){return Math.round(x*100)/100}
/* Arabic-Indic digits and separators typed on an Arabic keyboard -> plain digits */
function normDigits(s){return String(s||"").replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/٫/g,".").replace(/[٬،]/g,",")}
function parseAmt(s){s=normDigits(s).replace(/[,\s]/g,"");if(!/^\d*\.?\d*$/.test(s)||s===""||s===".")return NaN;return parseFloat(s)}
function fmtAmt(n,cur){
  var neg=n<0;n=Math.abs(n);
  var t=cur==="USD"?n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2}):Math.round(n).toLocaleString("en-US");
  return(neg?"-":"")+t}
function normRcpt(s){return normDigits(s).trim().replace(/\s+/g," ")}
function byOrder(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id}
function sorted(){return S.tx.slice().sort(byOrder)}
function txById(id){for(var i=0;i<S.tx.length;i++)if(S.tx[i].id===id)return S.tx[i];return null}
function sign(t){return t.type==="in"?t.amount:-t.amount}
/* an advance (سلفة) leaves the box like any expense but is kept apart and tied to a worker */
var TL={in:"وارد",out:"صادر",adv:"سلفة"};
/* each expense (صادر) belongs to a building, or to "عام" when it is for the whole site */
var GEN="عام";
function byName(a,b){return a.localeCompare(b,"ar",{numeric:true})}
function bldLabel(b){return!b||b===GEN?"عام":(/^[0-9٠-٩]/.test(b)?"بناية "+b:b)}
function bldList(){var m={};(S.blds||[]).forEach(function(b){m[b]=1});S.tx.forEach(function(t){if(t.type==="out"&&t.bld&&t.bld!==GEN)m[t.bld]=1});return Object.keys(m).sort(byName)}
function bldSummary(from,to){var m={},keys=bldList().concat([GEN]);keys.forEach(function(k){m[k]={n:0,IQD:0,USD:0}});
  S.tx.forEach(function(t){if(t.type!=="out")return;if((from&&t.date<from)||(to&&t.date>to))return;var r=m[t.bld||GEN];r.n++;r[t.cur]=r2(r[t.cur]+t.amount)});
  return keys.filter(function(k){return k!==GEN||m[k].n}).map(function(k){return{b:k,n:m[k].n,IQD:m[k].IQD,USD:m[k].USD}})}
function txDesc(t){return t.type==="adv"?"سلفة - "+(t.worker||"")+(t.desc?" - "+t.desc:""):(t.desc||"")+(t.type==="out"&&t.bld?(t.desc?" - ":"")+bldLabel(t.bld):"")}
function workers(){var m={};S.tx.forEach(function(t){if(t.type!=="adv"||!t.worker)return;var w=m[t.worker]||(m[t.worker]={name:t.worker,n:0,IQD:0,USD:0,last:""});w.n++;w[t.cur]=r2(w[t.cur]+t.amount);if(t.date>w.last)w.last=t.date});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.name.localeCompare(b.name,"ar")})}

/* balance = opening + every in - every out, worked out from the movements each time */
function balances(beforeDate){
  var b={IQD:S.open.IQD||0,USD:S.open.USD||0};
  S.tx.forEach(function(t){if(beforeDate&&t.date>=beforeDate)return;b[t.cur]=r2(b[t.cur]+sign(t))});
  return b}
/* rows between two dates, each with the running balance of its own currency */
function ledger(from,to){
  var cf=balances(from),run={IQD:cf.IQD,USD:cf.USD},tot={IQD:{in:0,out:0},USD:{in:0,out:0}},rows=[];
  sorted().forEach(function(t){if(t.date<from||t.date>to)return;
    run[t.cur]=r2(run[t.cur]+sign(t));var tk=t.type==="in"?"in":"out";tot[t.cur][tk]=r2(tot[t.cur][tk]+t.amount);
    rows.push({t:t,bal:run[t.cur]})});
  return{cf:cf,rows:rows,tot:tot,end:{IQD:run.IQD,USD:run.USD}}}
function rcptUsed(r,exceptId){r=normRcpt(r);if(!r)return null;for(var i=0;i<S.tx.length;i++){var t=S.tx[i];if(t.id!==exceptId&&normRcpt(t.rcpt)===r)return t}return null}

/* ---------- modal ---------- */
var modal=document.getElementById("modal"),modalIn=document.getElementById("modalIn");
function openModal(h){modalIn.innerHTML=h;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show");modalIn.innerHTML=""}
function info(title,body){openModal('<h3>'+title+'</h3>'+(body?'<p>'+body+'</p>':'')+'<div class="acts"><button id="mN">تمام</button></div>');document.getElementById("mN").onclick=closeModal}

/* ---------- navigation: each screen is a #hash so the phone's back button works ---------- */
function go(h){location.hash=h}
window.addEventListener("hashchange",function(){closeModal();render();scrollTo(0,0)});
var app=document.getElementById("app");
function render(){
  document.getElementById("hdP").textContent=S.project?"الصندوق - "+S.project:"الصندوق";
  document.getElementById("hdDate").textContent=fmtDate(today());
  var h=location.hash.replace(/^#/,"");
  if(h==="new-in")return formView(null,"in");
  if(h==="new-out")return formView(null,"out");
  if(h==="new-adv")return formView(null,"adv");
  if(/^edit-\d+$/.test(h)){var t=txById(+h.slice(5));if(t)return formView(t);}
  if(h==="day")return dayView();
  if(h==="blds")return bldsView();
  if(h==="worker")return workerView();
  if(h==="log")return logView();
  if(h==="print")return printView();
  if(h==="settings")return settingsView();
  mainView();
}
function balBox(b){
  return'<div class="bal">'+["IQD","USD"].map(function(c){
    return'<div class="'+(b[c]<0?"neg":"")+'"><span>رصيد ال'+CUR[c].n+'</span><b>'+fmtAmt(b[c],c)+' '+CUR[c].s+'</b></div>'}).join("")+'</div>'}
function txRow(t){
  var title=t.type==="adv"?esc(t.worker)+(t.desc?' · '+esc(t.desc):''):esc(t.desc||TL[t.type]);
  return'<div class="tx" data-id="'+t.id+'"><div class="ic '+t.type+'">'+(t.type==="in"?"+":t.type==="adv"?"س":"−")+'</div>'+
    '<div class="mid"><b>'+title+'</b><span>'+fmtDate(t.date)+(t.type==="out"&&t.bld?' · '+esc(bldLabel(t.bld)):'')+(t.rcpt?' · وصل '+esc(t.rcpt):'')+(t.inv?' · فاتورة '+esc(t.inv):'')+'</span></div>'+
    '<div class="am '+t.type+'">'+(t.type==="in"?"+":"-")+fmtAmt(t.amount,t.cur)+' '+CUR[t.cur].s+'</div></div>'}
function bindRows(){Array.prototype.forEach.call(app.querySelectorAll(".tx"),function(el){el.onclick=function(){go("edit-"+el.getAttribute("data-id"))}})}

/* in and out are always shown apart; TAB remembers which one is open */
var TAB="out";
function tabBar(id){return'<div class="seg" style="margin-bottom:10px;grid-template-columns:1fr 1fr 1fr"><button id="'+id+'Out" class="out'+(TAB==="out"?" on":"")+'">− الصادر</button><button id="'+id+'In" class="in'+(TAB==="in"?" on":"")+'">+ الوارد</button><button id="'+id+'Adv" class="adv'+(TAB==="adv"?" on":"")+'">السلف</button></div>'}
function bindTabs(id,cb){document.getElementById(id+"Out").onclick=function(){TAB="out";cb()};document.getElementById(id+"In").onclick=function(){TAB="in";cb()};document.getElementById(id+"Adv").onclick=function(){TAB="adv";cb()}}
function workersBox(){var ws=workers();if(!ws.length)return'';
  return'<h2 style="color:#b26a00">السلف حسب العامل</h2><input type="text" id="wkQ" placeholder="🔍 ابحث عن اسم العامل" style="width:100%;margin-bottom:4px">'+ws.map(function(w){var a=[];if(w.IQD)a.push(fmtAmt(w.IQD,"IQD")+' د.ع');if(w.USD)a.push(fmtAmt(w.USD,"USD")+' $');
    return'<div class="wk" data-name="'+esc(w.name)+'"><div><b>'+esc(w.name)+'</b><br><span>'+w.n+' سلفة · آخر وحدة '+fmtDate(w.last)+'</span></div><div class="t">'+a.join('<br>')+'</div></div>'}).join("")+'<h2 style="margin-top:14px">آخر السلف</h2>'}
function bindWorkers(){Array.prototype.forEach.call(app.querySelectorAll(".wk"),function(el){el.onclick=function(){WK=el.getAttribute("data-name");go("worker")}});
  var q=document.getElementById("wkQ");if(q)q.oninput=function(){var v=q.value.trim().replace(/\s+/g," ");
    Array.prototype.forEach.call(app.querySelectorAll(".wk"),function(el){el.style.display=!v||el.getAttribute("data-name").indexOf(v)>=0?"":"none"})}}
/* ---------- one worker: everything he took ---------- */
var WK="";
function workerView(){
  var list=sorted().reverse().filter(function(t){return t.type==="adv"&&t.worker===WK}),s=curTotals(list);
  if(!WK||!list.length){go("");return}
  app.innerHTML='<div class="box"><h2 style="color:#b26a00">سلف '+esc(WK)+'</h2>'+
    '<div class="bal"><div><span>مجموع السلف دينار</span><b>'+fmtAmt(s.IQD,"IQD")+' د.ع</b></div><div><span>مجموع السلف دولار</span><b>'+fmtAmt(s.USD,"USD")+' $</b></div></div>'+
    '<p class="hint">'+list.length+' سلفة · أول وحدة '+fmtDate(list[list.length-1].date)+' · آخر وحدة '+fmtDate(list[0].date)+'</p></div>'+
    '<div class="box">'+list.map(txRow).join("")+'</div>'+
    '<button class="big pri" id="wPr">🖨 طباعة سلف '+esc(WK)+'</button><button class="big" id="wBack" style="margin-top:8px">رجوع</button>';
  bindRows();
  document.getElementById("wPr").onclick=function(){PF.kind="adv";PF.worker=WK;PF.from=list[list.length-1].date;PF.to=list[0].date>today()?list[0].date:today();go("print")};
  document.getElementById("wBack").onclick=function(){history.back()};
}
function mainView(){
  var b=balances(),h="";
  var last=sorted().reverse().filter(function(t){return t.type===TAB}).slice(0,15);
  var days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(S.tx.length&&(days===null||days>=7))
    h+='<div class="warnbar"><span>'+(days===null?'ما سويت نسخة احتياطية لهلأ.':'آخر نسخة احتياطية من '+days+' يوم.')+'</span><button class="small" id="bkNow">نسخة الآن</button></div>';
  h+='<div class="box">'+balBox(b)+'</div>'+
    '<div class="three" style="margin-bottom:12px"><button class="big ok" id="bIn">+ وارد</button><button class="big dan" id="bOut">− صادر</button><button class="big adv-btn" id="bAdv">سلفة</button></div>'+
    '<div class="box">'+tabBar("mt")+(TAB==="adv"?workersBox():'')+(last.length?last.map(txRow).join(""):'<p class="muted">ما في '+(TAB==="adv"?'سلف':TL[TAB])+' لهلأ.</p>')+'</div>'+
    '<div class="three" style="margin-bottom:8px"><button id="bDay">📅 كل يوم بيومو</button><button id="bBl">🏢 البنايات</button><button id="bLog">📋 السجل</button></div>'+
    '<div class="two"><button id="bPr">🖨 الطباعة</button><button id="bSet">⚙ الإعدادات</button></div>';
  app.innerHTML=h;bindRows();bindWorkers();bindTabs("mt",mainView);
  document.getElementById("bAdv").onclick=function(){go("new-adv")};
  document.getElementById("bIn").onclick=function(){go("new-in")};
  document.getElementById("bOut").onclick=function(){go("new-out")};
  document.getElementById("bDay").onclick=function(){DAY=today();go("day")};
  document.getElementById("bLog").onclick=function(){LF.bld="";go("log")};
  document.getElementById("bBl").onclick=function(){go("blds")};
  document.getElementById("bPr").onclick=function(){PF.worker="";PF.bld="";go("print")};
  document.getElementById("bSet").onclick=function(){go("settings")};
  var bk=document.getElementById("bkNow");if(bk)bk.onclick=backup;
}

/* ---------- one day at a time ---------- */
var DAY="";
function addDays(iso,n){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return isoDate(d)}
function curTotals(list){var s={IQD:0,USD:0};list.forEach(function(t){s[t.cur]=r2(s[t.cur]+t.amount)});return s}
function totLine(s){var a=[];if(s.IQD)a.push(fmtAmt(s.IQD,"IQD")+' دينار');if(s.USD)a.push(fmtAmt(s.USD,"USD")+' دولار');return a.length?a.join(' · '):'0'}
function dayView(){
  if(!DAY)DAY=today();
  var d=DAY,list=sorted().filter(function(t){return t.date===d}),ins=list.filter(function(t){return t.type==="in"}),outs=list.filter(function(t){return t.type==="out"}),advs=list.filter(function(t){return t.type==="adv"});
  var start=balances(d),end=balances(addDays(d,1)),prev=null,next=null;
  S.tx.forEach(function(t){if(t.date<d&&(!prev||t.date>prev))prev=t.date;if(t.date>d&&(!next||t.date<next))next=t.date});
  var wd=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)).getDay()];
  function sec(title,cls,arr){return'<div class="box"><h2 style="color:'+({in:'#1f9d55',out:'#d64545',adv:'#b26a00'})[cls]+'">'+title+' ('+arr.length+')</h2>'+
    (arr.length?arr.map(txRow).join(""):'<p class="muted">ما في.</p>')+
    '<div class="kv" style="border:0;margin-top:6px"><span>المجموع</span><b>'+totLine(curTotals(arr))+'</b></div></div>'}
  app.innerHTML='<div class="box"><div class="two" style="margin-bottom:8px"><button class="small" id="dPrev" '+(prev?'':'disabled style="opacity:.4"')+'>→ اليوم السابق</button><button class="small" id="dNext" '+(next?'':'disabled style="opacity:.4"')+'>اليوم التالي ←</button></div>'+
    '<div class="row" style="margin:0"><label style="min-width:0">'+wd+'</label><input type="date" id="dDate" value="'+d+'"><button class="small" id="dToday">اليوم</button></div></div>'+
    '<div class="box"><h2>رصيد أول اليوم</h2>'+balBox(start)+'</div>'+
    sec("+ الوارد","in",ins)+sec("− الصادر","out",outs)+(advs.length?sec("السلف","adv",advs):'')+
    '<div class="box"><h2>رصيد آخر اليوم</h2>'+balBox(end)+'</div>'+
    '<button class="big pri" id="dPr">🖨 طباعة هاليوم</button><button class="big" id="dBack" style="margin-top:8px">رجوع</button>';
  bindRows();
  function to(x){DAY=x;dayView();scrollTo(0,0)}
  if(prev)document.getElementById("dPrev").onclick=function(){to(prev)};
  if(next)document.getElementById("dNext").onclick=function(){to(next)};
  document.getElementById("dDate").onchange=function(){if(this.value)to(this.value)};
  document.getElementById("dToday").onclick=function(){to(today())};
  document.getElementById("dPr").onclick=function(){PF.from=d;PF.to=d;go("print")};
  document.getElementById("dBack").onclick=function(){history.back()};
}

/* ---------- add / edit a movement ---------- */
function formView(t,newType){
  var ed=!!t,f=ed?{type:t.type,cur:t.cur,amount:String(t.amount),date:t.date,desc:t.desc,inv:t.inv,rcpt:t.rcpt,worker:t.worker||"",bld:t.bld||""}
    :{worker:"",bld:"",type:newType,cur:S.lastCur||"IQD",amount:"",date:today(),desc:newType==="in"?"من صاحب العمل":"",inv:"",rcpt:""};
  var descs={};sorted().reverse().forEach(function(x){if(x.desc&&Object.keys(descs).length<60)descs[x.desc]=1});
  var wks=workers().map(function(w){return'<option value="'+esc(w.name)+'">'}).join("");

    '<div class="row" id="wkRow"><label>اسم العامل</label><input type="text" id="fWk" list="wl" autocomplete="off" value="'+esc(f.worker)+'"></div>'+
    '<datalist id="wl">'+wks+'</datalist>'+
    '<div class="row" id="bRow"><label>البناية</label>'+(bldList().length?'<div class="bseg" id="fB">'+bldList().concat([GEN]).map(function(b){return'<button data-b="'+esc(b)+'">'+esc(b)+'</button>'}).join("")+'</div>':'<span class="hint" style="flex:1">ضيف أرقام البنايات من ⚙ الإعدادات</span>')+'</div>'+
    '<div class="row"><label>العملة</label><div class="seg"><button id="cIQD" class="cur">دينار</button><button id="cUSD" class="cur">دولار</button></div></div>'+
    '<div class="row"><label>المبلغ</label><input type="text" id="fAmt" inputmode="decimal" autocomplete="off" value="'+esc(f.amount)+'"></div>'+
    '<div class="prev" id="fPrev"></div>'+
    '<div class="row"><label>التاريخ</label><input type="date" id="fDate" value="'+esc(f.date)+'"></div>'+
    '<div class="row"><label>الشرح</label><input type="text" id="fDesc" list="dl" value="'+esc(f.desc)+'"></div>'+
    '<datalist id="dl">'+Object.keys(descs).map(function(d){return'<option value="'+esc(d)+'">'}).join("")+'</datalist>'+
    '<div class="row"><label>رقم الوصل</label><input type="text" id="fRc" inputmode="numeric" autocomplete="off" placeholder="اختياري" value="'+esc(f.rcpt)+'"></div>'+
    '<div class="row"><label>رقم الفاتورة</label><input type="text" id="fInv" autocomplete="off" placeholder="اختياري" value="'+esc(f.inv)+'"></div>'+
    '<p class="err" id="fErr"></p>'+
    '<button class="big pri" id="fSave">حفظ</button>'+
    '<div class="two" style="margin-top:8px"><button id="fCancel">رجوع</button>'+(ed?'<button class="dan" id="fDel">حذف</button>':'<span></span>')+'</div>'+
    '</div>';
  function paint(){
    document.getElementById("tIn").className="in"+(f.type==="in"?" on":"");
    document.getElementById("tOut").className="out"+(f.type==="out"?" on":"");
    document.getElementById("tAdv").className="adv"+(f.type==="adv"?" on":"");
    document.getElementById("wkRow").style.display=f.type==="adv"?"":"none";
    document.getElementById("bRow").style.display=f.type==="out"?"":"none";
    Array.prototype.forEach.call(document.querySelectorAll("#fB button"),function(x){x.className=x.getAttribute("data-b")===f.bld?"on":""});
    document.getElementById("cIQD").className="cur"+(f.cur==="IQD"?" on":"");
    document.getElementById("cUSD").className="cur"+(f.cur==="USD"?" on":"");
    var a=parseAmt(document.getElementById("fAmt").value);
    document.getElementById("fPrev").textContent=isNaN(a)||!a?"":"= "+fmtAmt(a,f.cur)+" "+CUR[f.cur].n;
  }
  document.getElementById("tIn").onclick=function(){if(!ed&&f.type!=="in"&&!document.getElementById("fDesc").value)document.getElementById("fDesc").value="من صاحب العمل";f.type="in";paint()};
  document.getElementById("tOut").onclick=function(){var d=document.getElementById("fDesc");if(!ed&&d.value==="من صاحب العمل")d.value="";f.type="out";paint()};
  document.getElementById("tAdv").onclick=function(){var d=document.getElementById("fDesc");if(!ed&&d.value==="من صاحب العمل")d.value="";f.type="adv";paint()};
  Array.prototype.forEach.call(document.querySelectorAll("#fB button"),function(x){x.onclick=function(){f.bld=x.getAttribute("data-b");paint()}});
  document.getElementById("cIQD").onclick=function(){f.cur="IQD";paint()};
  document.getElementById("cUSD").onclick=function(){f.cur="USD";paint()};
  document.getElementById("fAmt").oninput=paint;
  document.getElementById("fCancel").onclick=function(){history.back()};
  paint();
  if(!ed)setTimeout(function(){document.getElementById("fAmt").focus()},50);
  document.getElementById("fSave").onclick=function(){
    var err=document.getElementById("fErr");err.textContent="";
    ["fAmt","fRc","fDate","fWk"].forEach(function(id){document.getElementById(id).classList.remove("bad")});
    var amt=parseAmt(document.getElementById("fAmt").value),date=document.getElementById("fDate").value,
        rc=normRcpt(document.getElementById("fRc").value),inv=normDigits(document.getElementById("fInv").value).trim(),
        desc=document.getElementById("fDesc").value.trim();
    function bad(id,m){document.getElementById(id).classList.add("bad");err.textContent=m}
    if(isNaN(amt)||amt<=0)return bad("fAmt","اكتب المبلغ.");
    if(f.cur==="IQD"&&amt!==Math.round(amt))return bad("fAmt","مبلغ الدينار بدون فواصل عشرية.");
    if(!date)return bad("fDate","اختار التاريخ.");
    var wk=document.getElementById("fWk").value.trim().replace(/\s+/g," ");
    if(f.type==="adv"&&!wk)return bad("fWk","اكتب اسم العامل.");
    if(f.type==="out"&&bldList().length&&!f.bld){err.textContent="اختار البناية (أو عام إذا للموقع كله).";return}
    var u=rc?rcptUsed(rc,ed?t.id:-1):null;
    if(u)return bad("fRc","رقم الوصل "+rc+" مستعمل قبل ("+fmtDate(u.date)+" · "+(u.desc||"")+" · "+fmtAmt(u.amount,u.cur)+" "+CUR[u.cur].s+").");
    var o=ed?t:{id:S.seq++,at:Date.now()};
    o.type=f.type;o.cur=f.cur;o.amount=f.cur==="USD"?r2(amt):Math.round(amt);o.date=date;o.desc=desc;o.inv=inv;o.rcpt=rc;
    if(f.type==="adv")o.worker=wk;else delete o.worker;
    if(f.type==="out"&&f.bld)o.bld=f.bld;else delete o.bld;
    if(ed)o.edited=Date.now();else S.tx.push(o);
    S.lastCur=f.cur;TAB=f.type;save();history.back();
  };
  if(ed)document.getElementById("fDel").onclick=function(){
    openModal('<h3>حذف الحركة؟</h3><div class="kv"><span>الوصل</span><b>'+esc(t.rcpt)+'</b></div><div class="kv"><span>المبلغ</span><b>'+fmtAmt(t.amount,t.cur)+' '+CUR[t.cur].s+'</b></div><div class="kv"><span>الشرح</span><span>'+esc(t.desc)+'</span></div>'+
      '<div class="acts"><button id="mY" class="dan">حذف</button><button id="mN">إلغاء</button></div>');
    document.getElementById("mN").onclick=closeModal;
    document.getElementById("mY").onclick=function(){S.tx=S.tx.filter(function(x){return x.id!==t.id});save();closeModal();history.back()};
  };
}

/* ---------- log with filters ---------- */
var LF={from:"",to:"",cur:"",q:"",bld:""};
function logView(){
  app.innerHTML='<div class="box"><h2>السجل</h2>'+tabBar("lt")+
    '<div class="row"><input type="text" id="lQ" placeholder="بحث: رقم وصل، فاتورة، شرح، اسم عامل" value="'+esc(LF.q)+'"></div>'+
    '<div class="two" style="margin-bottom:8px"><input type="date" id="lF" value="'+LF.from+'"><input type="date" id="lT" value="'+LF.to+'"></div>'+
    '<div class="'+(TAB==="out"?'two':'')+'"><select id="lC" style="width:100%"><option value="">كل العملات</option><option value="IQD">دينار</option><option value="USD">دولار</option></select>'+
    (TAB==="out"?'<select id="lB" style="width:100%"><option value="">كل البنايات</option>'+bldList().concat([GEN]).map(function(b){return'<option value="'+esc(b)+'"'+(b===LF.bld?' selected':'')+'>'+esc(bldLabel(b))+'</option>'}).join("")+'</select>':'')+'</div>'+
    '<div id="lSum"></div></div><div class="box" id="lList"></div><button class="big" id="lBack">رجوع</button>';
  document.getElementById("lC").value=LF.cur;
  bindTabs("lt",logView);
  function upd(){
    LF.q=document.getElementById("lQ").value;LF.from=document.getElementById("lF").value;LF.to=document.getElementById("lT").value;
    LF.cur=document.getElementById("lC").value;var lb=document.getElementById("lB");LF.bld=lb?lb.value:"";
    var q=normDigits(LF.q).trim().toLowerCase();
    var list=sorted().reverse().filter(function(t){
      if(t.type!==TAB)return false;
      if(LF.from&&t.date<LF.from)return false;if(LF.to&&t.date>LF.to)return false;
      if(LF.cur&&t.cur!==LF.cur)return false;
      if(TAB==="out"&&LF.bld&&(t.bld||GEN)!==LF.bld)return false;
      if(q&&(normRcpt(t.rcpt)+" "+(t.inv||"")+" "+(t.desc||"")+" "+(t.worker||"")+" "+(t.bld||"")).toLowerCase().indexOf(q)<0)return false;
      return true});
    var tot=curTotals(list);
    document.getElementById("lSum").innerHTML='<div class="sum">'+["IQD","USD"].map(function(c){
      return'<div>مجموع '+({in:'الوارد',out:'الصادر',adv:'السلف'})[TAB]+' '+CUR[c].n+': <b>'+fmtAmt(tot[c],c)+'</b></div>'}).join("")+'</div>'+
      '<p class="hint">'+list.length+' حركة</p>';
    var L=document.getElementById("lList");
    L.innerHTML=list.length?list.slice(0,300).map(txRow).join("")+(list.length>300?'<p class="muted">عم يعرض أول 300. ضيّق البحث.</p>':''):'<p class="muted">ما في نتائج.</p>';
    bindRows();
  }
  /* the search box redraws on typing only; redrawing on its "change" (fired when it loses focus)
     would replace the list under the finger and swallow the tap on a result */
  document.getElementById("lQ").oninput=upd;
  ["lF","lT","lC","lB"].forEach(function(id){var e=document.getElementById(id);if(e)e.onchange=upd});
  document.getElementById("lBack").onclick=function(){history.back()};
  upd();
}

    '<div class="box">'+(L.length?L.map(function(r){var a=[];a.push(fmtAmt(r.IQD,"IQD")+' د.ع');if(r.USD)a.push(fmtAmt(r.USD,"USD")+' $');

      '<div class="kv" style="border:0;margin-top:6px"><span><b>المجموع</b> ('+t.n+')</span><b>'+fmtAmt(t.IQD,"IQD")+' د.ع'+(t.USD?' · '+fmtAmt(t.USD,"USD")+' $':'')+'</b></div>'
      :'<p class="muted">ضيف أرقام البنايات من ⚙ الإعدادات، وبعدين اختار البناية لما تسجل صادر.</p>')+'</div>'+
    '<button class="big pri" id="bPrint">🖨 طباعة ملخص البنايات</button><button class="big" id="bBack" style="margin-top:8px">رجوع</button>';
  Array.prototype.forEach.call(app.querySelectorAll(".wk"),function(el){el.onclick=function(){TAB="out";LF={from:BF.from,to:BF.to,cur:"",q:"",bld:el.getAttribute("data-b")};go("log")}});
  function set(a,b){BF.from=a;BF.to=b;bldsView()}
  document.getElementById("bF").onchange=function(){set(this.value,BF.to)};
  document.getElementById("bT").onchange=function(){set(BF.from,this.value)};
  document.getElementById("b0").onclick=function(){var m=monthRange(0);set(m[0],today())};
  document.getElementById("b1").onclick=function(){var m=monthRange(-1);set(m[0],m[1])};
  document.getElementById("bA").onclick=function(){set("","")};
  document.getElementById("bPrint").onclick=function(){var s=sorted();PF.kind="bld";PF.from=BF.from||(s.length?s[0].date:today());PF.to=BF.to||today();go("print")};
  document.getElementById("bBack").onclick=function(){history.back()};
}

    b.style.fontWeight="600"});document.getElementById("pDw").style.display=PF.kind==="all"||PF.kind==="bld"?"none":"";document.getElementById("pBr").style.display=PF.kind==="out"?"":"none";document.getElementById("pWr").style.display=PF.kind==="adv"?"":"none"}

  document.getElementById("sIn").onchange=function(e){var f=e.target.files[0];if(f)restore(f);e.target.value=""};
  document.getElementById("sBack").onclick=function(){history.back()};
}

window.__updateReady=function(){
  if(document.getElementById("updBar"))return;
  var b=document.createElement("div");b.id="updBar";
  b.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#1f9d55;color:#fff;padding:12px;display:flex;align-items:center;justify-content:space-between;z-index:60;font-size:15px";
  b.innerHTML='<span>في نسخة جديدة من التطبيق</span><button style="background:#fff;color:#1f9d55;font-weight:700">تحديث الآن</button>';
  b.querySelector("button").onclick=function(){location.reload()};document.body.appendChild(b);
};
render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!NATIVE){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})}
})();
</script>
