<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3a67">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Cash Box - SATCON</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#eef1f6;color:#1d2433;font-size:16px}
header.top{background:#2b3a67;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0}
header.top .d{font-size:14px;opacity:.85}
main{padding:12px;max-width:680px;margin:0 auto;padding-bottom:40px}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:16px;margin:0 0 10px;color:#2b3a67}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row label{min-width:96px;font-size:14px;color:#555}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{font:inherit;padding:10px;border:1px solid #c8cfdb;border-radius:8px;flex:1;min-width:0;background:#fff}
input.bad{border-color:#d64545;background:#fff5f5}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:#dfe5f0;color:#1d2433}
button:active{transform:scale(.97)}
.big{width:100%;padding:16px;font-size:18px;font-weight:600}
.pri{background:#2f6fd6;color:#fff}
.ok{background:#1f9d55;color:#fff}
.dan{background:#d64545;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.small{padding:8px 10px;font-size:14px}
.muted{color:#888;font-size:13px}
.hint{font-size:12px;color:#777;margin:4px 0 0}
.err{color:#d64545;font-size:13px;margin:4px 0 0;min-height:1em}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.bal div{background:#f3f6fb;border-radius:10px;padding:12px 4px}
.bal span{display:block;font-size:13px;color:#666}
.bal b{display:block;font-size:24px;color:#2b3a67;direction:ltr;margin-top:4px}
.bal .neg{background:#fde2e2}
.bal .neg b{color:#c62828}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.seg button{padding:12px 6px;font-weight:600;background:#eef1f6;color:#555;border:2px solid transparent}
.seg button.on.in{background:#d8f0e1;color:#14532d;border-color:#1f9d55}
.seg button.on.out{background:#fde2e2;color:#8a1c1c;border-color:#d64545}
.seg button.on.cur{background:#dce8fb;color:#1a3f8a;border-color:#2f6fd6}
.prev{font-size:15px;font-weight:700;color:#2b3a67;margin:-4px 0 8px;min-height:1.2em}
.tx{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eee;cursor:pointer}
.tx:last-child{border:0}
.tx .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tx .ic.in{background:#d8f0e1;color:#1f9d55}
.tx .ic.out{background:#fde2e2;color:#d64545}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:12px;color:#777}
.tx .am{font-weight:700;direction:ltr;white-space:nowrap;font-size:15px}
.tx .am.in{color:#1f9d55}
.tx .am.out{color:#d64545}
.tx .ic.adv{background:#ffe9c7;color:#b26a00}
.tx .am.adv{color:#b26a00}
.seg button.on.adv{background:#ffe9c7;color:#7a4b00;border-color:#e08a00}
.bseg{display:flex;flex-wrap:wrap;gap:6px;flex:1}.bseg button{padding:10px 14px;background:#eef1f6;border:2px solid transparent;font-weight:600;min-width:52px}.bseg button.on{background:#e6dcfb;color:#4b2a8a;border-color:#7a4fd6}
.adv-btn{background:#e08a00;color:#fff}
.wk{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer}
.wk b{font-size:15px}.wk span{font-size:12px;color:#777}.wk .t{direction:ltr;text-align:right;font-weight:700;color:#b26a00;font-size:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-top:8px}
.sum div{background:#f3f6fb;border-radius:8px;padding:6px 8px}
.sum b{direction:ltr;display:inline-block}
.warnbar{background:#fff4e0;border:1px solid #e08a00;color:#7a4b00;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .in{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}
.kv b{direction:ltr}
#printArea{display:none}

/* ===== print sheet (A4 landscape) ===== */
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  header.top,main,.modal,#updBar{display:none!important}
  #printArea{display:block}
}
.sheet{font-family:Arial,Tahoma,sans-serif;color:#000;width:100%;font-size:12px;direction:ltr}
.sheet .hdr{display:flex;align-items:stretch;border:1px solid #1f2a5a;margin-bottom:6px}
.sheet .logo{background:#2b3a67;color:#fff;font-size:20px;letter-spacing:4px;font-weight:300;padding:0 18px;display:flex;align-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{flex:1;text-align:center;padding:6px}
.sheet .ttl b{font-size:18px;display:block}
.sheet .ttl span{font-size:13px}
.sheet .per{padding:6px 12px;font-size:13px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid #1f2a5a;min-width:200px;text-align:center}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #1f2a5a;padding:2px 4px;text-align:center;vertical-align:middle;overflow:hidden}
.sheet th{background:#5b9bd5;font-weight:700;font-size:11px;height:28px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet th.iq{background:#9cc2e5}
.sheet th.us{background:#a9d18e}
.sheet td.n{direction:ltr;font-size:12px;white-space:nowrap}
.sheet td.ds{text-align:left;font-size:12px;line-height:15px}
.sheet td.ds div{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet td.bl{font-weight:700;background:#f2f2f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .neg{color:#c00}
.sheet tr.cf td{background:#fff2cc;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet tr.tot td{background:#dde6f3;font-weight:700;height:26px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ft{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
@media print{
  .pp{width:733px;height:1062px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .sheet.page{position:absolute;top:0;left:0;height:733px;transform-origin:top left;transform:translateX(733px) rotate(90deg)}
}
</style>
</head>
<body>
<header class="top"><h1 id="hdP" style="cursor:pointer">Cash Box</h1><div class="d"><span id="syncB" style="cursor:pointer"></span> <span id="hdDate"></span></div></header>
<main id="app"></main>
<div id="printArea"></div>
<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>
<script>
(function(){
"use strict";
/* All storage keys start with satcon_sandoq_ so this app never touches the
   daily report or attendance data (they share the same site in the browser). */
/* ---------- sites: several separate boxes in one app ----------
   site 1 keeps the original storage key, so the data already on the phone is site 1;
   every other site lives under its own key and shares nothing with the others */
var BASEKEY="satcon_sandoq_v1",IDX_KEY="satcon_sandoq_sites";
var COPY=1;try{var _id=window.AndroidBridge&&window.AndroidBridge.appId&&window.AndroidBridge.appId(),_m=/sandoq(\d+)$/.exec(_id||"");if(_m)COPY=+_m[1]}catch(e){}
var APPNAME=COPY>1?"Cash Box "+COPY:"Cash Box";
var SITE_COLORS=["#2b3a67","#0f6b5c","#7a2e5a","#6b4a12","#1f5f8b","#5b3a8a"];
function siteKey(id){return id==="1"?BASEKEY:BASEKEY+"_s"+id}
function loadSites(){var x=null;try{x=JSON.parse(localStorage.getItem(IDX_KEY))}catch(e){}
  if(!x||!Array.isArray(x.ids)||!x.ids.length)x={cur:"1",ids:["1"],next:2};
  if(x.ids.indexOf(x.cur)<0)x.cur=x.ids[0];if(!x.next)x.next=2;return x}
function saveSites(){try{localStorage.setItem(IDX_KEY,JSON.stringify(SITES))}catch(e){}}
var SITES=loadSites(),KEY=siteKey(SITES.cur);
function siteState(id){if(id===SITES.cur)return S;var s=null;try{s=JSON.parse(localStorage.getItem(siteKey(id)))}catch(e){}return s||{project:"",open:{IQD:0,USD:0},tx:[]}}
function siteName(id,st){st=st||siteState(id);return st.project||("Site "+(SITES.ids.indexOf(id)+1))}
function siteColor(id){return SITE_COLORS[SITES.ids.indexOf(id)%SITE_COLORS.length]}
function balOf(st){var b={IQD:(st.open&&st.open.IQD)||0,USD:(st.open&&st.open.USD)||0};(st.tx||[]).forEach(function(t){b[t.cur]=r2(b[t.cur]+(t.type==="in"?t.amount:-t.amount))});return b}
function resetViews(){TAB="out";LF={from:"",to:"",cur:"",q:"",bld:""};PF={from:"",to:"",kind:"out",daily:false,worker:"",bld:""};BF={from:"",to:""};WK="";DAY=""}
function switchSite(id){SITES.cur=id;saveSites();KEY=siteKey(id);S=load();if(SY.on)shadowInit();resetViews();closeModal();if(location.hash&&location.hash!=="#")go("");else render();scrollTo(0,0)}
function sitePicker(){
  var h='<h3>Sites</h3>'+SITES.ids.map(function(id){var st=siteState(id),b=balOf(st),on=id===SITES.cur;
    return'<div class="wk" data-site="'+id+'" style="border-left:6px solid '+siteColor(id)+';padding-left:10px'+(on?';background:#f3f6fb':'')+'"><div><b>'+(on?'✓ ':'')+esc(siteName(id,st))+'</b><br><span>'+(st.tx||[]).length+' transactions</span></div>'+
      '<div class="t" style="color:#2b3a67"><span class="'+(b.IQD<0?'neg':'')+'" style="color:'+(b.IQD<0?'#c62828':'inherit')+'">'+fmtAmt(b.IQD,"IQD")+' IQD</span><br><span style="color:'+(b.USD<0?'#c62828':'inherit')+'">'+fmtAmt(b.USD,"USD")+' $</span></div></div>'}).join("")+
    '<div class="row" style="margin-top:12px"><input type="text" id="nsName" placeholder="New site name" dir="auto"><button class="ok small" id="nsAdd">+ Add site</button></div><p class="err" id="nsErr"></p>'+
    '<div class="acts"><button id="mN">Close</button></div>';
  openModal(h);
  Array.prototype.forEach.call(modalIn.querySelectorAll("[data-site]"),function(el){el.onclick=function(){var id=el.getAttribute("data-site");if(id===SITES.cur)closeModal();else switchSite(id)}});
  document.getElementById("mN").onclick=closeModal;
  document.getElementById("nsAdd").onclick=function(){
    var nm=document.getElementById("nsName").value.trim().replace(/\s+/g," ");
    if(!nm){document.getElementById("nsErr").textContent="Enter the site name.";return}
    if(SITES.ids.some(function(id){return siteName(id)===nm})){document.getElementById("nsErr").textContent="A site with this name already exists.";return}
    var id=newId("s"),st=blank();st.project=nm;
    try{localStorage.setItem(siteKey(id),JSON.stringify(st))}catch(e){document.getElementById("nsErr").textContent="Could not save.";return}
    SITES.ids.push(id);saveSites();syncSiteCreated(id);switchSite(id);go("settings")};
}
function deleteSite(){
  var id=SITES.cur,nm=siteName(id),n=S.tx.length,b=balances();
  openModal('<h3>🗑 Delete site "'+esc(nm)+'"?</h3><p>All of its transactions ('+n+') and its balances (IQD '+fmtAmt(b.IQD,"IQD")+', USD '+fmtAmt(b.USD,"USD")+') will be deleted. They can only be recovered from a backup.</p>'+
    '<p class="hint">Type the site name to confirm:</p><input type="text" id="dsN" style="width:100%"><p class="err" id="dsE"></p>'+
    '<div class="acts"><button id="mY" class="dan">Delete</button><button id="mN">Cancel</button></div>');
  document.getElementById("mN").onclick=closeModal;
  document.getElementById("mY").onclick=function(){
    if(document.getElementById("dsN").value.trim().replace(/\s+/g," ")!==nm){document.getElementById("dsE").textContent="The name does not match.";return}
    syncSiteDeleting(id,S);try{localStorage.removeItem(siteKey(id))}catch(e){}
    SITES.ids=SITES.ids.filter(function(x){return x!==id});saveSites();switchSite(SITES.ids[0]);setTimeout(flush,300)};
}
var CUR={IQD:{n:"IQD",s:"IQD"},USD:{n:"USD",s:"$"}};
var S=load();
if(S.__fixB){delete S.__fixB;S.blds=splitBlds(S.blds.join(","));save()}
function blank(){return{v:1,project:"",open:{IQD:0,USD:0},tx:[],seq:1,lastBackup:0,lastCur:"IQD",blds:[]}}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!s.tx)s=blank();
  var b=blank(),k;for(k in b)if(s[k]===undefined)s[k]=b[k];
  if(!s.open)s.open={IQD:0,USD:0};
  s.tx.forEach(function(t){if(typeof t.id!=="string")t.id=String(t.id)});
  if(s.blds&&s.blds.length)s.__fixB=1;
  return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Could not save. The device storage may be full.")}syncChanged()}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return(n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return isoDate(new Date())}
function fmtDate(iso){if(!iso)return"";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function r2(x){return Math.round(x*100)/100}
/* Arabic-Indic digits and separators typed on an Arabic keyboard -> plain digits */
function normDigits(s){return String(s||"").replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/٫/g,".").replace(/[٬،]/g,",")}
function parseAmt(s){s=normDigits(s).replace(/[,\s]/g,"");if(!/^\d*\.?\d*$/.test(s)||s===""||s===".")return NaN;return parseFloat(s)}
function fmtAmt(n,cur){
  var neg=n<0;n=Math.abs(n);
  var t=cur==="USD"?n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2}):Math.round(n).toLocaleString("en-US");
  return(neg?"-":"")+t}
function normRcpt(s){return normDigits(s).trim().replace(/\s+/g," ")}
/* ids are text and unique across devices (a phone and a laptop never pick the same one) */
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function byOrder(a,b){if(a.date!==b.date)return a.date<b.date?-1:1;var x=a.at||0,y=b.at||0;if(x!==y)return x-y;var i=+a.id,j=+b.id;if(!isNaN(i)&&!isNaN(j))return i-j;return String(a.id)<String(b.id)?-1:1}
function sorted(){return S.tx.slice().sort(byOrder)}
function txById(id){id=String(id);for(var i=0;i<S.tx.length;i++)if(S.tx[i].id===id)return S.tx[i];return null}
function sign(t){return t.type==="in"?t.amount:-t.amount}
/* an advance leaves the box like any expense but is kept apart and tied to a worker */
var TL={in:"Income",out:"Expense",adv:"Advance"};
/* each expense belongs to a building, or to GEN (stored as "عام", shown as "General") when it is for the whole site */
var GEN="عام";
/* building list typed in settings: commas, Arabic commas, dots, semicolons or new lines all separate names */
function splitBlds(txt){var bs=[];normDigits(txt).split(/[,،.؛;\n]+/).forEach(function(x){x=x.trim().replace(/\s+/g," ");if(x&&x!==GEN&&bs.indexOf(x)<0)bs.push(x)});return bs.sort(byName)}
function byName(a,b){return a.localeCompare(b,"ar",{numeric:true})}
function bldLabel(b){return!b||b===GEN?"General":(/^[0-9٠-٩]/.test(b)?"Building "+b:b)}
function bldList(){var m={};(S.blds||[]).forEach(function(b){m[b]=1});S.tx.forEach(function(t){if(t.type==="out"&&t.bld&&t.bld!==GEN)m[t.bld]=1});return Object.keys(m).sort(byName)}
function bldSummary(from,to){var m={},keys=bldList().concat([GEN]);keys.forEach(function(k){m[k]={n:0,IQD:0,USD:0}});
  S.tx.forEach(function(t){if(t.type!=="out")return;if((from&&t.date<from)||(to&&t.date>to))return;var r=m[t.bld||GEN];r.n++;r[t.cur]=r2(r[t.cur]+t.amount)});
  return keys.filter(function(k){return k!==GEN||m[k].n}).map(function(k){return{b:k,n:m[k].n,IQD:m[k].IQD,USD:m[k].USD}})}
function txDesc(t){return t.type==="adv"?"Advance - "+(t.worker||"")+(t.desc?" - "+t.desc:""):(t.type==="out"&&t.bld?bldLabel(t.bld)+(t.desc?" - ":""):"")+(t.desc||"")}
function workers(){var m={};S.tx.forEach(function(t){if(t.type!=="adv"||!t.worker)return;var w=m[t.worker]||(m[t.worker]={name:t.worker,n:0,IQD:0,USD:0,last:""});w.n++;w[t.cur]=r2(w[t.cur]+t.amount);if(t.date>w.last)w.last=t.date});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.name.localeCompare(b.name,"ar")})}

/* balance = opening + every in - every out, worked out from the movements each time */
function balances(beforeDate){
  var b={IQD:S.open.IQD||0,USD:S.open.USD||0};
  S.tx.forEach(function(t){if(beforeDate&&t.date>=beforeDate)return;b[t.cur]=r2(b[t.cur]+sign(t))});
  return b}
/* rows between two dates, each with the running balance of its own currency */
function ledger(from,to){
  var cf=balances(from),run={IQD:cf.IQD,USD:cf.USD},tot={IQD:{in:0,out:0},USD:{in:0,out:0}},rows=[];
  sorted().forEach(function(t){if(t.date<from||t.date>to)return;
    run[t.cur]=r2(run[t.cur]+sign(t));var tk=t.type==="in"?"in":"out";tot[t.cur][tk]=r2(tot[t.cur][tk]+t.amount);
    rows.push({t:t,bal:run[t.cur]})});
  return{cf:cf,rows:rows,tot:tot,end:{IQD:run.IQD,USD:run.USD}}}
function rcptUsed(r,exceptId){r=normRcpt(r);if(!r)return null;for(var i=0;i<S.tx.length;i++){var t=S.tx[i];if(t.id!==exceptId&&normRcpt(t.rcpt)===r)return t}return null}

/* ---------- modal ---------- */
var modal=document.getElementById("modal"),modalIn=document.getElementById("modalIn");
function openModal(h){modalIn.innerHTML=h;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show");modalIn.innerHTML=""}
function info(title,body){openModal('<h3>'+title+'</h3>'+(body?'<p>'+body+'</p>':'')+'<div class="acts"><button id="mN">OK</button></div>');document.getElementById("mN").onclick=closeModal}

/* ---------- navigation: each screen is a #hash so the phone's back button works ---------- */
function go(h){location.hash=h}
window.addEventListener("hashchange",function(){closeModal();render();scrollTo(0,0)});
var app=document.getElementById("app");
function render(){
  updBadge();document.getElementById("syncB").onclick=function(){go("settings")};
  var hp=document.getElementById("hdP");hp.textContent=APPNAME+" - "+siteName(SITES.cur)+" ▾";hp.onclick=sitePicker;
  var col=siteColor(SITES.cur);document.querySelector("header.top").style.background=col;var tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=col;
  document.getElementById("hdDate").textContent=fmtDate(today());
  var h=location.hash.replace(/^#/,"");
  if(h==="new-in")return formView(null,"in");
  if(h==="new-out")return formView(null,"out");
  if(h==="new-adv")return formView(null,"adv");
  if(/^edit-.+$/.test(h)){var t=txById(h.slice(5));if(t)return formView(t);}
  if(h==="day")return dayView();
  if(h==="blds")return bldsView();
  if(h==="worker")return workerView();
  if(h==="log")return logView();
  if(h==="print")return printView();
  if(h==="settings")return settingsView();
  mainView();
}
function balBox(b){
  return'<div class="bal">'+["IQD","USD"].map(function(c){
    return'<div class="'+(b[c]<0?"neg":"")+'"><span>'+CUR[c].n+' balance</span><b>'+fmtAmt(b[c],c)+' '+CUR[c].s+'</b></div>'}).join("")+'</div>'}
function txRow(t){
  var dup=t.rcpt&&rcptUsed(t.rcpt,t.id);
  var title=t.type==="adv"?esc(t.worker)+(t.desc?' · '+esc(t.desc):''):esc(t.desc||TL[t.type]);

/* ---------- one day at a time ---------- */
var DAY="";
function addDays(iso,n){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return isoDate(d)}
function curTotals(list){var s={IQD:0,USD:0};list.forEach(function(t){s[t.cur]=r2(s[t.cur]+t.amount)});return s}
function totLine(s){var a=[];if(s.IQD)a.push(fmtAmt(s.IQD,"IQD")+' IQD');if(s.USD)a.push(fmtAmt(s.USD,"USD")+' USD');return a.length?a.join(' · '):'0'}
function dayView(){
  if(!DAY)DAY=today();
  var d=DAY,list=sorted().filter(function(t){return t.date===d}),ins=list.filter(function(t){return t.type==="in"}),outs=list.filter(function(t){return t.type==="out"}),advs=list.filter(function(t){return t.type==="adv"});
  var start=balances(d),end=balances(addDays(d,1)),prev=null,next=null;
  S.tx.forEach(function(t){if(t.date<d&&(!prev||t.date>prev))prev=t.date;if(t.date>d&&(!next||t.date<next))next=t.date});
  var wd=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)).getDay()];
  function sec(title,cls,arr){return'<div class="box"><h2 style="color:'+({in:'#1f9d55',out:'#d64545',adv:'#b26a00'})[cls]+'">'+title+' ('+arr.length+')</h2>'+
    (arr.length?arr.map(txRow).join(""):'<p class="muted">None.</p>')+
    '<div class="kv" style="border:0;margin-top:6px"><span>Total</span><b>'+totLine(curTotals(arr))+'</b></div></div>'}
  app.innerHTML='<div class="box"><div class="two" style="margin-bottom:8px"><button class="small" id="dPrev" '+(prev?'':'disabled style="opacity:.4"')+'>← Previous day</button><button class="small" id="dNext" '+(next?'':'disabled style="opacity:.4"')+'>Next day →</button></div>'+
    '<div class="row" style="margin:0"><label style="min-width:0">'+wd+'</label><input type="date" id="dDate" value="'+d+'"><button class="small" id="dToday">Today</button></div></div>'+
    '<div class="box"><h2>Opening Balance of the Day</h2>'+balBox(start)+'</div>'+
    sec("+ Income","in",ins)+sec("− Expenses","out",outs)+(advs.length?sec("Advances","adv",advs):'')+
    '<div class="box"><h2>Closing Balance of the Day</h2>'+balBox(end)+'</div>'+
    '<button class="big pri" id="dPr">🖨 Print this day</button><button class="big" id="dBack" style="margin-top:8px">Back</button>';
  bindRows();
  function to(x){DAY=x;dayView();scrollTo(0,0)}
  if(prev)document.getElementById("dPrev").onclick=function(){to(prev)};
  if(next)document.getElementById("dNext").onclick=function(){to(next)};
  document.getElementById("dDate").onchange=function(){if(this.value)to(this.value)};
  document.getElementById("dToday").onclick=function(){to(today())};
  document.getElementById("dPr").onclick=function(){PF.from=d;PF.to=d;go("print")};
  document.getElementById("dBack").onclick=function(){history.back()};
}

  function paint(){
    document.getElementById("tIn").className="in"+(f.type==="in"?" on":"");

    document.getElementById("cUSD").className="cur"+(f.cur==="USD"?" on":"");
    var a=parseAmt(document.getElementById("fAmt").value);
    document.getElementById("fPrev").textContent=isNaN(a)||!a?"":"= "+fmtAmt(a,f.cur)+" "+CUR[f.cur].n;
  }
  document.getElementById("tIn").onclick=function(){f.type="in";paint()};
  document.getElementById("tOut").onclick=function(){f.type="out";paint()};
  document.getElementById("tAdv").onclick=function(){f.type="adv";paint()};
  Array.prototype.forEach.call(document.querySelectorAll("#fB button"),function(x){x.onclick=function(){f.bld=x.getAttribute("data-b");paint()}});

    if(!date)return bad("fDate","Select the date.");
    var wk=document.getElementById("fWk").value.trim().replace(/\s+/g," ");

    var o=ed?(txById(t.id)||t):{id:newId("t"),at:Date.now()};
    o.type=f.type;o.cur=f.cur;o.amount=f.cur==="USD"?r2(amt):Math.round(amt);o.date=date;o.desc=desc;o.inv=inv;o.rcpt=rc;
    if(f.type==="adv")o.worker=wk;else delete o.worker;
    if(f.type==="out"&&f.bld)o.bld=f.bld;else delete o.bld;
    if(ed){o.edited=Date.now();if(!txById(o.id))S.tx.push(o)}else S.tx.push(o);

  };

    openModal('<h3>Delete this transaction?</h3><div class="kv"><span>Receipt No.</span><b>'+esc(t.rcpt)+'</b></div><div class="kv"><span>Amount</span><b>'+fmtAmt(t.amount,t.cur)+' '+CUR[t.cur].s+'</b></div><div class="kv"><span>Description</span><span dir="auto">'+esc(t.desc)+'</span></div>'+

  ["lF","lT","lC","lB"].forEach(function(id){var e=document.getElementById(id);if(e)e.onchange=upd});

/* lays rows out on landscape pages: the column header repeats on every page,
   "first" rows open page 1 and "last" rows (totals) stay together on the last page */
function paginate(o){
  var cap=PAGE_H-TOP_H-TH_H-FT_H,pages=[],cur=[],used=0;
  o.first.forEach(function(r){cur.push(r);used+=r.h});
  o.rows.forEach(function(r){if(used+r.h>cap&&cur.length){pages.push(cur);cur=[];used=0}cur.push(r);used+=r.h});
  var lastH=o.last.reduce(function(a,r){return a+r.h},0);
  if(used+lastH>cap&&cur.length){pages.push(cur);cur=[];used=0}
  o.last.forEach(function(r){cur.push(r)});pages.push(cur);
  var N=pages.length,printed=fmtDate(today());
  var per=o.from===o.to?'Date: <b>'+fmtDate(o.from)+'</b>':'From <b>'+fmtDate(o.from)+'</b> to <b>'+fmtDate(o.to)+'</b>';
  return pages.map(function(pg,pi){
    return'<div class="sheet page" style="width:'+PAGE_W+'px">'+
      '<div class="hdr" style="height:'+(TOP_H-8)+'px"><div class="logo">SATCON</div><div class="ttl"><b>'+o.title+'</b><span>'+esc(S.project||"")+'</span></div>'+
      '<div class="per"><div>'+per+'</div></div></div>'+
      '<table>'+o.colg+o.head+pg.map(function(r){return r.html}).join("")+'</table>'+
      '<div class="ft"><span>Printed on: '+printed+'</span><span>Page '+(pi+1)+' of '+N+'</span></div></div>'});
}

  var list=kindRows(kind,from,to),rows=[],tot={IQD:0,USD:0},day={IQD:0,USD:0},isAdv=kind==="adv",name={in:"income",out:"expenses",adv:"advances"}[kind];

      nCell(t.cur==="IQD"?t.amount:"","IQD")+nCell(t.cur==="USD"?t.amount:"","USD")+'</tr>'});
    tot[t.cur]=r2(tot[t.cur]+t.amount);day[t.cur]=r2(day[t.cur]+t.amount);

      rows.push({h:22,html:'<tr class="cf" style="height:22px"><td colspan="'+nc+'">Subtotal for '+fmtDate(t.date)+'</td>'+nCell(day.IQD||"","IQD")+nCell(day.USD||"","USD")+'</tr>'});

  function groupRows(title,keyOf,label,disp){
    var m={};list.forEach(function(t){var k=keyOf(t),w=m[k]||(m[k]={n:0,IQD:0,USD:0});w.n++;w[t.cur]=r2(w[t.cur]+t.amount)});
    rows.push({h:26,html:'<tr class="tot"><td colspan="'+(nc+2)+'">'+title+'</td></tr>'});

      rows.push({h:22,html:'<tr class="cf" style="height:22px"><td colspan="2">'+m[k].n+' '+label+(m[k].n===1?'':'s')+'</td><td colspan="'+(nc-2)+'"><b>'+esc(disp?disp(k):k)+'</b></td>'+nCell(m[k].IQD||"","IQD")+nCell(m[k].USD||"","USD")+'</tr>'})});
  }

  if(showB&&list.length)groupRows("Totals by Building",function(t){return t.bld||GEN},"invoice",bldLabel);
  var last=[],who=isAdv&&PF.worker?' '+esc(PF.worker):kind==="out"&&PF.bld?' '+esc(bldLabel(PF.bld)):'';
  if(!list.length)last.push({h:30,html:'<tr><td colspan="'+(nc+2)+'" style="height:30px">No '+name+' in this period</td></tr>'});
  last.push({h:28,html:'<tr class="tot"><td colspan="'+nc+'">Total '+name+who+'</td>'+nCell(tot.IQD,"IQD")+nCell(tot.USD,"USD")+'</tr>'});
  var c=' style="background:'+({in:"#a9d18e",out:"#f4b183",adv:"#ffd966"})[kind]+'"';
  return paginate({title:KINDS[kind]+(who?' -'+who:''),from:from,to:to,first:[],rows:rows,last:last,
    colg:'<colgroup><col style="width:40px"><col style="width:90px">'+(isAdv?'<col style="width:170px"><col>':(showB?'<col style="width:90px">':'')+'<col><col style="width:110px">')+'<col style="width:100px"><col style="width:150px"><col style="width:130px"></colgroup>',
    head:'<tr><th'+c+'>No.</th><th'+c+'>Date</th>'+(isAdv?'<th'+c+'>Worker</th><th'+c+'>Description</th>':(showB?'<th'+c+'>Building</th>':'')+'<th'+c+'>Description</th><th'+c+'>Invoice No.</th>')+'<th'+c+'>Receipt No.</th><th class="iq">Amount (IQD)</th><th class="us">Amount (USD)</th></tr>'});
}
/* one line per building: how much went out for it */
function bldPages(from,to){

/* full statement: in and out side by side with the running balance of each currency */
function ledgerPages(from,to){

      nCell(iq&&t.type==="in"?t.amount:"","IQD")+nCell(iq&&t.type!=="in"?t.amount:"","IQD")+nCell(iq?r.bal:"","IQD","bl")+
      nCell(!iq&&t.type==="in"?t.amount:"","USD")+nCell(!iq&&t.type!=="in"?t.amount:"","USD")+nCell(!iq?r.bal:"","USD","bl")+'</tr>'})});

      '<col style="width:82px"><col style="width:82px"><col style="width:86px"><col style="width:76px"><col style="width:76px"><col style="width:80px"></colgroup>',
    head:'<tr><th>No.</th><th>Date</th><th>Description</th><th>Invoice No.</th><th>Receipt No.</th>'+

var NATIVE=!!(window.AndroidBridge&&window.AndroidBridge.isNative);
if(NATIVE){var st=document.createElement("style");st.textContent="@page{size:A4 landscape;margin:8mm}";document.head.appendChild(st)}
function printPages(pages,title,fallback){

var LIBS=["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"];
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function pdfPages(makePages,name,title){
  openModal('<h3 style="text-align:center">Preparing PDF...</h3>');
  var p=window.jspdf&&window.html2canvas?Promise.resolve():Promise.all(LIBS.map(loadScript));
  p.then(function(){
    var pages=makePages(),pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"}),chain=Promise.resolve();
    pages.forEach(function(html,idx){chain=chain.then(function(){
      var box=document.createElement("div");
      box.style.cssText="position:fixed;left:-20000px;top:0;width:"+PAGE_W+"px;height:"+PAGE_H+"px;background:#fff;overflow:hidden";
      box.innerHTML=html;document.body.appendChild(box);
      return window.html2canvas(box,{scale:2,backgroundColor:"#fff",width:PAGE_W,height:PAGE_H}).then(function(cv){
        document.body.removeChild(box);if(idx>0)pdf.addPage("a4","landscape");
        pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",8,8,281,281*PAGE_H/PAGE_W)})})});
    return chain.then(function(){
      if(NATIVE){closeModal();window.AndroidBridge.sharePdf(pdf.output("datauristring").split(",")[1],name);return}
      var blob=pdf.output("blob"),file=new File([blob],name,{type:"application/pdf"});closeModal();
      if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:title}).catch(function(){});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()});
  }).catch(function(){
    openModal('<h3>Could not prepare the PDF</h3><p>'+(window.jspdf?'An error occurred while preparing the file. Please try again.':'An internet connection is required the first time, to download the PDF tools.')+'</p><div class="acts"><button id="mN">OK</button></div>');
    document.getElementById("mN").onclick=closeModal});

/* ---------- settings, backup / restore ---------- */
function utf8b64(str){var bytes=new TextEncoder().encode(str),bin="";for(var i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(bin)}
function shareText(text,name,mime,title){
  if(NATIVE&&window.AndroidBridge.shareFile){var r=window.AndroidBridge.shareFile(utf8b64(text),name,mime);return!r}
  if(NATIVE){window.AndroidBridge.sharePdf(utf8b64(text),name);return true}
  var blob=new Blob([text],{type:mime}),file=new File([blob],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:title}).catch(function(){});return true}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true;
}
function saveText(text,name,mime){
  if(NATIVE&&window.AndroidBridge.saveDownload)return window.AndroidBridge.saveDownload(utf8b64(text),name,mime)==="OK";
  if(!NATIVE){var blob=new Blob([text],{type:mime}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
  return false}
function backup(){
  var text=JSON.stringify({app:"satcon-sandoq",v:1,copy:COPY,at:Date.now(),state:S}),name="sandoq"+(COPY>1?COPY:"")+"_"+siteName(SITES.cur).replace(/[\\\/:*?"<>|\s]+/g,"_")+"_"+today()+".json";
  var canSave=!NATIVE||!!(window.AndroidBridge&&window.AndroidBridge.saveDownload);
  openModal('<h3>💾 Backup</h3><p class="muted" style="margin-top:0">'+S.tx.length+' transactions · File: '+esc(name)+'</p>'+
    '<div class="acts" style="flex-direction:column"><button id="bS" class="pri">📤 Share (WhatsApp, ...)</button>'+(canSave?'<button id="bD">💾 Save to Downloads</button>':'')+'<button id="mN">Close</button></div><p class="hint" id="bMsg"></p>');
  function msg(t,c){var m=document.getElementById("bMsg");if(m){m.textContent=t;m.style.color=c||""}}
  function done(){S.lastBackup=Date.now();save()}
  window.__shareFailed=function(){msg("The share menu did not open. Try saving to Downloads.","#d64545")};
  document.getElementById("bS").onclick=function(){if(shareText(text,name,"application/json","Cash Box backup")){done();msg("✓ Once sent, the backup is safe with you.","#1f9d55")}else msg("Sharing failed.","#d64545")};
  var d=document.getElementById("bD");if(d)d.onclick=function(){if(saveText(text,name,"application/json")){done();msg("✓ Saved to the Download folder as "+name,"#1f9d55")}else msg("Could not save. Use Share instead.","#d64545")};
  document.getElementById("mN").onclick=function(){closeModal();render()};
}
function restore(file){
  file.text().then(function(t){var d=JSON.parse(t);if(!d||d.app!=="satcon-sandoq"||!d.state||!Array.isArray(d.state.tx))throw 0;return d}).then(function(d){
    var inc=d.state,b0=blank(),k;for(k in b0)if(inc[k]===undefined)inc[k]=b0[k];
    var mine=S;S=inc;var bi=balances(),ni=inc.tx.length;S=mine;var bm=balances();
    var fromCopy=d.copy||1,other=fromCopy!==COPY||((inc.project||"")!==(S.project||"")&&S.tx.length);

/* ---------- sync between devices (Firebase) ----------
   Each site is a document s/{siteId}; each movement is s/{siteId}/t/{id}.
   The phone and the laptop keep their own copy in localStorage and work without internet.
   Every local change is noted in PEND until the server confirms it, so nothing is lost
   if the app closes while offline. Changes from the server never overwrite a movement that
   still has an unsent local change. */
var FB_CFG={apiKey:"AIzaSyDuQOZFZbkyk85wOZNrzNDDuRAceHnmJuk",authDomain:"satcon-assad.firebaseapp.com",projectId:"satcon-assad",
  storageBucket:"satcon-assad.firebasestorage.app",messagingSenderId:"606771906756",appId:"1:606771906756:web:726c48ee040eb73fbda191"};
var SY_KEY="satcon_sandoq_sync",PEND_KEY="satcon_sandoq_pend";
var SY=(function(){try{return JSON.parse(localStorage.getItem(SY_KEY))||{}}catch(e){return{}}})();
var PEND=(function(){try{return JSON.parse(localStorage.getItem(PEND_KEY))||{}}catch(e){return{}}})();
var SST={ready:false,cache:true,err:"",lastOk:0,flushing:false};
var fbx=null,fauth=null,fdb=null,fbP=null,unsubSites=null,txSubs={},SHADOW=null,needRender=false;
function saveSY(){try{localStorage.setItem(SY_KEY,JSON.stringify(SY))}catch(e){}}
function savePend(){try{localStorage.setItem(PEND_KEY,JSON.stringify(PEND))}catch(e){}}
function pendN(){var n=0;for(var s in PEND)n+=Object.keys(PEND[s]).length;return n}
function mark(sid,key){(PEND[sid]||(PEND[sid]={}))[key]=Date.now()+Math.random()}
var TXF=["id","type","cur","amount","date","desc","inv","rcpt","worker","bld","at","edited"];
function canonTx(t){var o={};TXF.forEach(function(k){if(t[k]!==undefined&&t[k]!==null)o[k]=t[k]});o.id=String(o.id);return o}
function canonMeta(st){return{project:st.project||"",open:{IQD:+((st.open&&st.open.IQD)||0),USD:+((st.open&&st.open.USD)||0)},blds:(st.blds||[]).slice()}}
function readSite(sid){if(sid===SITES.cur)return S;var s=null;try{s=JSON.parse(localStorage.getItem(siteKey(sid)))}catch(e){}
  if(!s)s=blank();var b=blank(),k;for(k in b)if(s[k]===undefined)s[k]=b[k];return s}
function writeSite(sid,st){try{localStorage.setItem(siteKey(sid),JSON.stringify(st))}catch(e){}}
/* what this device last sent or received for the open site; save() compares against it */
function shadowInit(){var m={};S.tx.forEach(function(t){m[t.id]=JSON.stringify(canonTx(t))});SHADOW={sid:SITES.cur,meta:JSON.stringify(canonMeta(S)),tx:m}}
function syncChanged(){
  if(typeof SY==="undefined"||!SY||!SY.on)return;
  if(!SHADOW||SHADOW.sid!==SITES.cur){shadowInit();return}
  var sid=SITES.cur,ch=false,meta=JSON.stringify(canonMeta(S)),seen={};
  if(meta!==SHADOW.meta){mark(sid,"__site");SHADOW.meta=meta;ch=true}
  S.tx.forEach(function(t){var j=JSON.stringify(canonTx(t));seen[t.id]=1;if(SHADOW.tx[t.id]!==j){mark(sid,t.id);SHADOW.tx[t.id]=j;ch=true}});
  for(var id in SHADOW.tx)if(!seen[id]){mark(sid,id);delete SHADOW.tx[id];ch=true}
  if(ch){savePend();updBadge();setTimeout(flush,300)}
}
function syncSiteCreated(sid){if(!SY.on)return;mark(sid,"__site");savePend();setTimeout(flush,300)}
function syncSiteDeleting(sid,st){if(!SY.on)return;mark(sid,"__site");st.tx.forEach(function(t){mark(sid,t.id)});savePend()}
function withNet(p){return Promise.race([p,new Promise(function(r,j){setTimeout(function(){j(new Error("timeout"))},25000)})])}
function ensureFb(){if(fbP)return fbP;
  fbP=(window.FBS?Promise.resolve():loadScript("fb.js")).then(function(){fbx=window.FBS;
    var app=fbx.initializeApp(FB_CFG);
    try{fauth=fbx.initializeAuth(app,{persistence:[fbx.indexedDBLocalPersistence,fbx.browserLocalPersistence]})}catch(e){fauth=fbx.initializeAuth(app,{persistence:fbx.inMemoryPersistence})}
    try{fdb=fbx.initializeFirestore(app,{localCache:fbx.persistentLocalCache({tabManager:fbx.persistentMultipleTabManager()})})}catch(e){fdb=fbx.initializeFirestore(app,{localCache:fbx.memoryLocalCache()})}
  });
  fbP.catch(function(){fbP=null;SST.err="nofb";updBadge()});
  return fbP}
function authUser(){return new Promise(function(res){var done=false,un=fbx.onAuthStateChanged(fauth,function(u){if(done)return;done=true;res(u);setTimeout(function(){try{un()}catch(e){}},0)})})}
function startSync(){
  if(!SY.on)return;
  ensureFb().then(authUser).then(function(u){
    if(!u){SST.err="out";updBadge();return}
    SST.err="";SST.ready=true;listen();flush();updBadge();
  });
}
function stopListen(){if(unsubSites){try{unsubSites()}catch(e){}unsubSites=null}for(var k in txSubs){try{txSubs[k]()}catch(e){}}txSubs={}}
function listen(){
  stopListen();
  unsubSites=fbx.onSnapshot(fbx.collection(fdb,"s"),{includeMetadataChanges:true},function(snap){
    SST.cache=snap.metadata.fromCache;if(!SST.cache)SST.lastOk=Date.now();
    var sitesChanged=false;
    snap.docs.forEach(function(d){var sid=d.id,data=d.data()||{},pend=PEND[sid]||{},have=SITES.ids.indexOf(sid)>=0;
      if(pend.__site)return; /* this device has an unsent change to this site */
      if(data.deleted){ /* deleted on the other device */
        if(txSubs[sid]){try{txSubs[sid]()}catch(e){}delete txSubs[sid]}
        if(!have||SITES.ids.length<=1)return;
        try{localStorage.removeItem(siteKey(sid))}catch(e){}
        SITES.ids=SITES.ids.filter(function(x){return x!==sid});sitesChanged=true;
        if(SITES.cur===sid){saveSites();switchSite(SITES.ids[0])}
        return}
      var m=canonMeta(data);
      if(!have){var st=blank();st.project=m.project;st.open=m.open;st.blds=m.blds;writeSite(sid,st);SITES.ids.push(sid);sitesChanged=true}
      else{var st2=readSite(sid);
        if(JSON.stringify(canonMeta(st2))!==JSON.stringify(m)){st2.project=m.project;st2.open=m.open;st2.blds=m.blds;writeSite(sid,st2);
          if(sid===SITES.cur&&SHADOW&&SHADOW.sid===sid)SHADOW.meta=JSON.stringify(m);sitesChanged=true}}
      if(!txSubs[sid])listenTx(sid);
    });
    if(sitesChanged){saveSites();needRender=true}
    updBadge();
  },function(e){SST.err=String(e&&e.code||e);updBadge()});
}
function listenTx(sid){
  txSubs[sid]=fbx.onSnapshot(fbx.collection(fdb,"s",sid,"t"),{includeMetadataChanges:true},function(snap){
    if(SITES.ids.indexOf(sid)<0)return;
    var st=readSite(sid),pend=PEND[sid]||{},byId={},ch=false,cur=sid===SITES.cur&&SHADOW&&SHADOW.sid===sid,gone={};
    st.tx.forEach(function(t,i){byId[t.id]=i});
    snap.docs.forEach(function(d){var id=d.id,data=d.data()||{};if(pend[id])return;
      if(data.deleted){if(byId[id]!==undefined){gone[id]=1;ch=true;if(cur)delete SHADOW.tx[id]}return}
      var nt=canonTx(Object.assign({},data,{id:id})),j=JSON.stringify(nt);
      if(byId[id]===undefined){st.tx.push(nt);byId[id]=st.tx.length-1;ch=true}
      else if(JSON.stringify(canonTx(st.tx[byId[id]]))!==j){st.tx[byId[id]]=nt;ch=true}else return;
      if(cur)SHADOW.tx[id]=j});
    if(Object.keys(gone).length){var keep=st.tx.filter(function(t){return!gone[t.id]});st.tx.length=0;Array.prototype.push.apply(st.tx,keep)}
    if(ch){writeSite(sid,st);if(sid===SITES.cur)needRender=true}
  },function(e){SST.err=String(e&&e.code||e);updBadge()});
}
/* send what is in PEND; a change made while sending stays in PEND for the next round */
function flush(){
  if(!SY.on||!SST.ready||SST.flushing||!pendN())return;
  SST.flushing=true;
  var b=fbx.writeBatch(fdb),taken=[],n=0;
  for(var sid in PEND){if(n>=400)break;
    var exists=SITES.ids.indexOf(sid)>=0,st=exists?readSite(sid):null,map={};
    if(st)st.tx.forEach(function(t){map[t.id]=t});
    for(var key in PEND[sid]){if(n>=400)break;
      if(key==="__site"){if(exists)b.set(fbx.doc(fdb,"s",sid),canonMeta(st));else b.set(fbx.doc(fdb,"s",sid),{deleted:true,at:Date.now()})}
      else if(map[key])b.set(fbx.doc(fdb,"s",sid,"t",key),canonTx(map[key]));
      else b.set(fbx.doc(fdb,"s",sid,"t",key),{id:key,deleted:true,at:Date.now()});
      taken.push([sid,key,PEND[sid][key]]);n++}}
  b.commit().then(function(){
    taken.forEach(function(x){var p=PEND[x[0]];if(p&&p[x[1]]===x[2]){delete p[x[1]];if(!Object.keys(p).length)delete PEND[x[0]]}});
    savePend();SST.flushing=false;SST.lastOk=Date.now();SST.err="";updBadge();if(pendN())setTimeout(flush,200);
  },function(e){SST.flushing=false;SST.err=String(e&&e.code||e);updBadge();setTimeout(flush,15000)});
}
setInterval(function(){if(SY.on&&SST.ready&&pendN()&&!SST.flushing)flush()},20000);
/* redraw lists when the other device changed something, but never under the user's fingers */
setInterval(function(){if(!needRender)return;
  var h=location.hash.replace(/^#/,""),busy=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(modal.classList.contains("show")||busy)return;
  if(h===""||h==="log"||h==="day"||h==="blds"||h==="worker"){needRender=false;render()}
},1500);
function badgeTxt(){if(!SY.on)return"";var n=pendN();
  if(SST.err==="out")return"🔴";if(SST.err==="nofb")return"⚪";
  if(!SST.ready||SST.cache)return"🟠"+(n?" "+n:"");return n?"🟠 "+n:"🟢"}
function updBadge(){var b=document.getElementById("syncB");if(b)b.textContent=badgeTxt();var x=document.getElementById("syS");if(x)x.innerHTML=syncStatus()}
function hm(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())+" "+fmtDate(isoDate(d))}
function syncStatus(){var n=pendN();
  if(SST.err==="nofb")return"⚪ Sync components are missing from this version. Install the latest APK.";
  if(SST.err==="out")return"🔴 Please sign in again.";
  if(!SST.ready)return"🟠 Connecting...";
  return(SST.cache?"🟠 Offline. Changes will sync automatically when the connection returns.":"🟢 Connected")+
    (n?"<br>Pending upload: <b>"+n+"</b>":"<br>All changes uploaded ✓")+(SST.lastOk?"<br><span class='muted'>Last connection: "+hm(SST.lastOk)+"</span>":"")}
function authMsg(e){var c=String(e&&e.code||e&&e.message||e);
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return"Incorrect email or password.";
  if(/network|timeout|unavailable/.test(c))return"No internet connection, or the connection is weak. Please try again.";
  if(/too-many/.test(c))return"Too many attempts. Please wait a moment and try again.";
  return"Error: "+c}
function syncBox(){
  var form='<div class="row"><input type="email" id="syE" dir="ltr" autocomplete="username" placeholder="Email" value="'+esc(SY.email||"")+'"></div>'+
    '<div class="row"><input type="password" id="syP" dir="ltr" autocomplete="current-password" placeholder="Password"></div><p class="err" id="syErr"></p>';
  if(!SY.on)return'<div class="box"><h2>☁ Device Sync</h2><p class="muted" style="margin-top:0">Sign in with the same account on the phone and the laptop to keep both in sync. The app works offline and syncs when the connection returns.</p>'+
    form+'<button class="big pri" id="syIn">Sign In and Connect</button></div>';
  if(SST.err==="out")return'<div class="box"><h2>☁ Sync</h2><p id="syS">'+syncStatus()+'</p>'+form+'<button class="big pri" id="syIn">Sign In</button></div>';
  return'<div class="box"><h2>☁ Sync</h2><p style="margin-top:0">Account: <b dir="ltr">'+esc(SY.email||"")+'</b></p><p id="syS">'+syncStatus()+'</p>'+
    '<div class="two"><button id="syNow">🔄 Sync Now</button><button class="dan" id="syOut">Sign Out</button></div></div>'}
function bindSyncBox(){
  var bIn=document.getElementById("syIn");
  if(bIn)bIn.onclick=function(){
    var em=document.getElementById("syE").value.trim(),pw=document.getElementById("syP").value,er=document.getElementById("syErr");

        if(q.empty)return firstUpload();

          '<div class="acts" style="flex-direction:column"><button id="mBk">💾 Create Backup First</button><button id="mY" class="dan">Continue and Load Server Data</button><button id="mN">Cancel</button></div>');

/* first device: send every site and movement on this device */
function firstUpload(){
  SITES.ids.forEach(function(sid){mark(sid,"__site");readSite(sid).tx.forEach(function(t){mark(sid,t.id)})});
  savePend();SY.on=true;saveSY();SST.ready=true;shadowInit();listen();flush();
  info("✓ Connected","Uploading this device's data ("+pendN()+" items). Keep the app open and online until the indicator turns 🟢, then sign in on the other device.");render()}
/* other devices: take the server's data in place of this device's */
function download(){
  openModal('<h3 style="text-align:center">Downloading data...</h3>');
  withNet(fbx.getDocsFromServer(fbx.collection(fdb,"s"))).then(function(q){
    var sites=q.docs.filter(function(d){return!(d.data()||{}).deleted}).map(function(d){return{id:d.id,data:d.data()}});
    if(!sites.length)throw{code:"empty"};
    return Promise.all(sites.map(function(s){return withNet(fbx.getDocsFromServer(fbx.collection(fdb,"s",s.id,"t"))).then(function(tq){s.tx=tq.docs.filter(function(d){return!(d.data()||{}).deleted}).map(function(d){return canonTx(Object.assign({},d.data(),{id:d.id}))});return s})}));
  }).then(function(sites){
    SITES.ids.forEach(function(id){try{localStorage.removeItem(siteKey(id))}catch(e){}});
    sites.sort(function(a,b){return a.id==="1"?-1:b.id==="1"?1:0});
    sites.forEach(function(s){var st=blank(),m=canonMeta(s.data||{});st.project=m.project;st.open=m.open;st.blds=m.blds;st.tx=s.tx;writeSite(s.id,st)});
    SITES={cur:sites[0].id,ids:sites.map(function(s){return s.id}),next:2};saveSites();
    KEY=siteKey(SITES.cur);S=load();resetViews();PEND={};savePend();SY.on=true;saveSY();SST.ready=true;shadowInit();listen();
    closeModal();go("");render();
    setTimeout(function(){info("✓ Connected",sites.length+" site(s) downloaded. Anything recorded here will appear on the other device.")},150);
  }).catch(function(e){closeModal();info("Download failed",authMsg(e));try{fbx.signOut(fauth)}catch(x){}});
}
