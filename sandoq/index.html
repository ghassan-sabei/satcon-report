<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3a67">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Cash Box - SATCON</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#eef1f6;color:#1d2433;font-size:16px}
header.top{background:#2b3a67;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0}
header.top .d{font-size:14px;opacity:.85}
main{padding:12px;max-width:680px;margin:0 auto;padding-bottom:40px}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:16px;margin:0 0 10px;color:#2b3a67}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row label{min-width:96px;font-size:14px;color:#555}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{font:inherit;padding:10px;border:1px solid #c8cfdb;border-radius:8px;flex:1;min-width:0;background:#fff}
input[inputmode],input[type=date],input[type=email],input[type=password]{direction:ltr}
input.bad{border-color:#d64545;background:#fff5f5}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:#dfe5f0;color:#1d2433}
button:active{transform:scale(.97)}
.big{width:100%;padding:16px;font-size:18px;font-weight:600}
.pri{background:#2f6fd6;color:#fff}
.ok{background:#1f9d55;color:#fff}
.dan{background:#d64545;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.small{padding:8px 10px;font-size:14px}
.muted{color:#888;font-size:13px}
.hint{font-size:12px;color:#777;margin:4px 0 0}
.err{color:#d64545;font-size:13px;margin:4px 0 0;min-height:1em}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.bal div{background:#f3f6fb;border-radius:10px;padding:12px 4px}
.bal span{display:block;font-size:13px;color:#666}
.bal b{display:block;font-size:24px;color:#2b3a67;direction:ltr;margin-top:4px}
.bal .neg{background:#fde2e2}
.bal .neg b{color:#c62828}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.seg button{padding:12px 6px;font-weight:600;background:#eef1f6;color:#555;border:2px solid transparent}
.seg button.on.in{background:#d8f0e1;color:#14532d;border-color:#1f9d55}
.seg button.on.out{background:#fde2e2;color:#8a1c1c;border-color:#d64545}
.seg button.on.cur{background:#dce8fb;color:#1a3f8a;border-color:#2f6fd6}
.seg button.on.lg{background:#dce8fb;color:#1a3f8a;border-color:#2f6fd6}
.prev{font-size:15px;font-weight:700;color:#2b3a67;margin:-4px 0 8px;min-height:1.2em}
.tx{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eee;cursor:pointer}
.tx:last-child{border:0}
.tx .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tx .ic.in{background:#d8f0e1;color:#1f9d55}
.tx .ic.out{background:#fde2e2;color:#d64545}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:12px;color:#777}
.tx .am{font-weight:700;direction:ltr;white-space:nowrap;font-size:15px}
.tx .am.in{color:#1f9d55}
.tx .am.out{color:#d64545}
.tx .ic.adv{background:#ffe9c7;color:#b26a00}
.tx .am.adv{color:#b26a00}
.seg button.on.adv{background:#ffe9c7;color:#7a4b00;border-color:#e08a00}
.bseg{display:flex;flex-wrap:wrap;gap:6px;flex:1}.bseg button{padding:10px 14px;background:#eef1f6;border:2px solid transparent;font-weight:600;min-width:52px}.bseg button.on{background:#e6dcfb;color:#4b2a8a;border-color:#7a4fd6}
.adv-btn{background:#e08a00;color:#fff}
.wk{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer}
.wk b{font-size:15px}.wk span{font-size:12px;color:#777}.wk .t{direction:ltr;text-align:end;font-weight:700;color:#b26a00;font-size:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-top:8px}
.sum div{background:#f3f6fb;border-radius:8px;padding:6px 8px}
.sum b{direction:ltr;display:inline-block}
.warnbar{background:#fff4e0;border:1px solid #e08a00;color:#7a4b00;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .in{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}
.kv b{direction:ltr}
#printArea{display:none}

/* ===== print sheet (A4 landscape) ===== */
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  header.top,main,.modal,#updBar{display:none!important}
  #printArea{display:block}
}
.sheet{font-family:Arial,Tahoma,sans-serif;color:#000;width:100%;font-size:12px}
.sheet .hdr{display:flex;align-items:stretch;border:1px solid #1f2a5a;margin-bottom:6px}
.sheet .logo{background:#2b3a67;color:#fff;font-size:20px;letter-spacing:4px;font-weight:300;padding:0 18px;display:flex;align-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{flex:1;text-align:center;padding:6px}
.sheet .ttl b{font-size:18px;display:block}
.sheet .ttl span{font-size:13px}
.sheet .per{padding:6px 12px;font-size:13px;display:flex;flex-direction:column;justify-content:center;border-inline-start:1px solid #1f2a5a;min-width:200px;text-align:center}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #1f2a5a;padding:2px 4px;text-align:center;vertical-align:middle;overflow:hidden}
.sheet th{background:#5b9bd5;font-weight:700;font-size:11px;height:28px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet th.iq{background:#9cc2e5}
.sheet th.us{background:#a9d18e}
.sheet td.n{direction:ltr;font-size:12px;white-space:nowrap}
.sheet td.ds{text-align:start;font-size:12px;line-height:15px}
.sheet td.ds div{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet td.bl{font-weight:700;background:#f2f2f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .neg{color:#c00}
.sheet tr.cf td{background:#fff2cc;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet tr.tot td{background:#dde6f3;font-weight:700;height:26px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ft{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
@media print{
  .pp{width:733px;height:1062px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp .sheet.page{position:absolute;top:0;left:0;height:733px;transform-origin:top left;transform:translateX(733px) rotate(90deg)}
}
</style>
</head>

/* t("English text", {name: value}) -> text in the chosen language; {name} is replaced by value */
function t(k,v){var e=STR[k],s=(e&&e[isAr()?1:0])||k;if(v)for(var x in v)s=s.split("{"+x+"}").join(v[x]);return s}
/* the one-word count labels: "1 invoice", "3 invoices" */

/* All storage keys start with satcon_sandoq_ so this app never touches the
   daily report or attendance data (they share the same site in the browser). */
/* ---------- sites: several separate boxes in one app ----------
   site 1 keeps the original storage key, so the data already on the phone is site 1;
   every other site lives under its own key and shares nothing with the others */
var BASEKEY="satcon_sandoq_v1",IDX_KEY="satcon_sandoq_sites";
var COPY=1;try{var _id=window.AndroidBridge&&window.AndroidBridge.appId&&window.AndroidBridge.appId(),_m=/sandoq(\d+)$/.exec(_id||"");if(_m)COPY=+_m[1]}catch(e){}
function appName(){var n=t("Cash Box");return COPY>1?n+" "+COPY:n}
var SITE_COLORS=["#2b3a67","#0f6b5c","#7a2e5a","#6b4a12","#1f5f8b","#5b3a8a"];
function siteKey(id){return id==="1"?BASEKEY:BASEKEY+"_s"+id}
function loadSites(){var x=null;try{x=JSON.parse(localStorage.getItem(IDX_KEY))}catch(e){}
  if(!x||!Array.isArray(x.ids)||!x.ids.length)x={cur:"1",ids:["1"],next:2};
  if(x.ids.indexOf(x.cur)<0)x.cur=x.ids[0];if(!x.next)x.next=2;return x}
function saveSites(){try{localStorage.setItem(IDX_KEY,JSON.stringify(SITES))}catch(e){}}
var SITES=loadSites(),KEY=siteKey(SITES.cur);
function siteState(id){if(id===SITES.cur)return S;var s=null;try{s=JSON.parse(localStorage.getItem(siteKey(id)))}catch(e){}return s||{project:"",open:{IQD:0,USD:0},tx:[]}}
function siteName(id,st){st=st||siteState(id);return st.project||(t("Site ")+(SITES.ids.indexOf(id)+1))}
function siteColor(id){return SITE_COLORS[SITES.ids.indexOf(id)%SITE_COLORS.length]}
function balOf(st){var b={IQD:(st.open&&st.open.IQD)||0,USD:(st.open&&st.open.USD)||0};(st.tx||[]).forEach(function(t){b[t.cur]=r2(b[t.cur]+(t.type==="in"?t.amount:-t.amount))});return b}
function resetViews(){TAB="out";LF={from:"",to:"",cur:"",q:"",bld:""};PF={from:"",to:"",kind:"out",daily:false,worker:"",bld:""};BF={from:"",to:""};WK="";DAY=""}
function switchSite(id){SITES.cur=id;saveSites();KEY=siteKey(id);S=load();if(SY.on)shadowInit();resetViews();closeModal();if(location.hash&&location.hash!=="#")go("");else render();scrollTo(0,0)}
function sitePicker(){
  var h='<h3>'+t("Sites")+'</h3>'+SITES.ids.map(function(id){var st=siteState(id),b=balOf(st),on=id===SITES.cur;
    return'<div class="wk" data-site="'+id+'" style="border-left:6px solid '+siteColor(id)+';padding-left:10px'+(on?';background:#f3f6fb':'')+'"><div><b>'+(on?'✓ ':'')+esc(siteName(id,st))+'</b><br><span>'+cnt((st.tx||[]).length,"{n} transaction","{n} transactions")+'</span></div>'+
      '<div class="t" style="color:#2b3a67"><span class="'+(b.IQD<0?'neg':'')+'" style="color:'+(b.IQD<0?'#c62828':'inherit')+'">'+fmtAmt(b.IQD,"IQD")+' IQD</span><br><span style="color:'+(b.USD<0?'#c62828':'inherit')+'">'+fmtAmt(b.USD,"USD")+' $</span></div></div>'}).join("")+
    '<div class="row" style="margin-top:12px"><input type="text" id="nsName" placeholder="'+t("New site name")+'" dir="auto"><button class="ok small" id="nsAdd">'+t("+ Add site")+'</button></div><p class="err" id="nsErr"></p>'+
    '<div class="acts"><button id="mN">'+t("Close")+'</button></div>';
  openModal(h);
  Array.prototype.forEach.call(modalIn.querySelectorAll("[data-site]"),function(el){el.onclick=function(){var id=el.getAttribute("data-site");if(id===SITES.cur)closeModal();else switchSite(id)}});
  document.getElementById("mN").onclick=closeModal;
  document.getElementById("nsAdd").onclick=function(){
    var nm=document.getElementById("nsName").value.trim().replace(/\s+/g," ");
    if(!nm){document.getElementById("nsErr").textContent=t("Enter the site name.");return}
    if(SITES.ids.some(function(id){return siteName(id)===nm})){document.getElementById("nsErr").textContent=t("A site with this name already exists.");return}
    var id=newId("s"),st=blank();st.project=nm;
    try{localStorage.setItem(siteKey(id),JSON.stringify(st))}catch(e){document.getElementById("nsErr").textContent=t("Could not save.");return}
    SITES.ids.push(id);saveSites();syncSiteCreated(id);switchSite(id);go("settings")};
}
function deleteSite(){
  var id=SITES.cur,nm=siteName(id),n=S.tx.length,b=balances();
  openModal('<h3>🗑 '+esc(t('Delete site "{name}"?',{name:nm}))+'</h3><p>'+t("All of its transactions ({n}) and its balances (IQD {iqd}, USD {usd}) will be deleted. They can only be recovered from a backup.",{n:n,iqd:fmtAmt(b.IQD,"IQD"),usd:fmtAmt(b.USD,"USD")})+'</p>'+
    '<p class="hint">'+t("Type the site name to confirm:")+'</p><input type="text" id="dsN" style="width:100%"><p class="err" id="dsE"></p>'+
    '<div class="acts"><button id="mY" class="dan">'+t("Delete")+'</button><button id="mN">'+t("Cancel")+'</button></div>');
  document.getElementById("mN").onclick=closeModal;
  document.getElementById("mY").onclick=function(){
    if(document.getElementById("dsN").value.trim().replace(/\s+/g," ")!==nm){document.getElementById("dsE").textContent=t("The name does not match.");return}
    syncSiteDeleting(id,S);try{localStorage.removeItem(siteKey(id))}catch(e){}
    SITES.ids=SITES.ids.filter(function(x){return x!==id});saveSites();switchSite(SITES.ids[0]);setTimeout(flush,300)};
}
var CUR={IQD:{n:"IQD",s:"IQD"},USD:{n:"USD",s:"$"}};
var S=load();
if(S.__fixB){delete S.__fixB;S.blds=splitBlds(S.blds.join(","));save()}
function blank(){return{v:1,project:"",open:{IQD:0,USD:0},tx:[],seq:1,lastBackup:0,lastCur:"IQD",blds:[]}}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!s.tx)s=blank();
  var b=blank(),k;for(k in b)if(s[k]===undefined)s[k]=b[k];
  if(!s.open)s.open={IQD:0,USD:0};
  s.tx.forEach(function(t){if(typeof t.id!=="string")t.id=String(t.id)});
  if(s.blds&&s.blds.length)s.__fixB=1;
  return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert(t("Could not save. The device storage may be full."))}syncChanged()}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return(n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return isoDate(new Date())}
function fmtDate(iso){if(!iso)return"";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function r2(x){return Math.round(x*100)/100}
/* Arabic-Indic digits and separators typed on an Arabic keyboard -> plain digits */
function normDigits(s){return String(s||"").replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/٫/g,".").replace(/[٬،]/g,",")}
function parseAmt(s){s=normDigits(s).replace(/[,\s]/g,"");if(!/^\d*\.?\d*$/.test(s)||s===""||s===".")return NaN;return parseFloat(s)}
function fmtAmt(n,cur){
  var neg=n<0;n=Math.abs(n);
  var t=n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
  return(neg?"-":"")+t}
function normRcpt(s){return normDigits(s).trim().replace(/\s+/g," ")}
/* ids are text and unique across devices (a phone and a laptop never pick the same one) */
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function byOrder(a,b){if(a.date!==b.date)return a.date<b.date?-1:1;var x=a.at||0,y=b.at||0;if(x!==y)return x-y;var i=+a.id,j=+b.id;if(!isNaN(i)&&!isNaN(j))return i-j;return String(a.id)<String(b.id)?-1:1}
function sorted(){return S.tx.slice().sort(byOrder)}
function txById(id){id=String(id);for(var i=0;i<S.tx.length;i++)if(S.tx[i].id===id)return S.tx[i];return null}
function sign(t){return t.type==="in"?t.amount:-t.amount}
/* an advance leaves the box like any expense but is kept apart and tied to a worker */
var TL={in:"Income",out:"Expense",adv:"Advance"};
/* each expense belongs to a building, or to GEN (stored as "عام", shown as "General") when it is for the whole site */
var GEN="عام";
/* building list typed in settings: commas, Arabic commas, dots, semicolons or new lines all separate names */
function splitBlds(txt){var bs=[];normDigits(txt).split(/[,،.؛;\n]+/).forEach(function(x){x=x.trim().replace(/\s+/g," ");if(x&&x!==GEN&&bs.indexOf(x)<0)bs.push(x)});return bs.sort(byName)}
function byName(a,b){return a.localeCompare(b,LANG,{numeric:true})}
function bldLabel(b){return!b||b===GEN?t("General"):(/^[0-9٠-٩]/.test(b)?t("Building")+" "+b:b)}
function bldList(){var m={};(S.blds||[]).forEach(function(b){m[b]=1});S.tx.forEach(function(t){if(t.type==="out"&&t.bld&&t.bld!==GEN)m[t.bld]=1});return Object.keys(m).sort(byName)}
function bldSummary(from,to){var m={},keys=bldList().concat([GEN]);keys.forEach(function(k){m[k]={n:0,IQD:0,USD:0}});
  S.tx.forEach(function(t){if(t.type!=="out")return;if((from&&t.date<from)||(to&&t.date>to))return;var r=m[t.bld||GEN];r.n++;r[t.cur]=r2(r[t.cur]+t.amount)});
  return keys.filter(function(k){return k!==GEN||m[k].n}).map(function(k){return{b:k,n:m[k].n,IQD:m[k].IQD,USD:m[k].USD}})}
function txDesc(tx){return tx.type==="adv"?t("Advance")+" - "+(tx.worker||"")+(tx.desc?" - "+tx.desc:""):(tx.type==="out"&&tx.bld?bldLabel(tx.bld)+(tx.desc?" - ":""):"")+(tx.desc||"")}
function workers(){var m={};S.tx.forEach(function(t){if(t.type!=="adv"||!t.worker)return;var w=m[t.worker]||(m[t.worker]={name:t.worker,n:0,IQD:0,USD:0,last:""});w.n++;w[t.cur]=r2(w[t.cur]+t.amount);if(t.date>w.last)w.last=t.date});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.name.localeCompare(b.name,LANG)})}

/* balance = opening + every in - every out, worked out from the movements each time */
function balances(beforeDate){
  var b={IQD:S.open.IQD||0,USD:S.open.USD||0};
  S.tx.forEach(function(t){if(beforeDate&&t.date>=beforeDate)return;b[t.cur]=r2(b[t.cur]+sign(t))});
  return b}
/* rows between two dates, each with the running balance of its own currency */
function ledger(from,to){
  var cf=balances(from),run={IQD:cf.IQD,USD:cf.USD},tot={IQD:{in:0,out:0},USD:{in:0,out:0}},rows=[];
  sorted().forEach(function(t){if(t.date<from||t.date>to)return;
    run[t.cur]=r2(run[t.cur]+sign(t));var tk=t.type==="in"?"in":"out";tot[t.cur][tk]=r2(tot[t.cur][tk]+t.amount);
    rows.push({t:t,bal:run[t.cur]})});
  return{cf:cf,rows:rows,tot:tot,end:{IQD:run.IQD,USD:run.USD}}}
function rcptUsed(r,exceptId){r=normRcpt(r).toLowerCase();if(!r)return null;for(var i=0;i<S.tx.length;i++){var t=S.tx[i];if(t.id!==exceptId&&normRcpt(t.rcpt).toLowerCase()===r)return t}return null}

function txRow(tx){
  var dup=tx.rcpt&&rcptUsed(tx.rcpt,tx.id);
  var title=tx.type==="adv"?esc(tx.worker)+(tx.desc?' · '+esc(tx.desc):''):esc(tx.desc||t(TL[tx.type]));
  return'<div class="tx" data-id="'+tx.id+'"'+(dup?' style="background:#fde2e2"':'')+'><div class="ic '+tx.type+'">'+(tx.type==="in"?"+":tx.type==="adv"?"A":"−")+'</div>'+
    '<div class="mid"><b dir="auto">'+title+'</b><span>'+fmtDate(tx.date)+(tx.type==="out"&&tx.bld?' · '+esc(bldLabel(tx.bld)):'')+(tx.rcpt?' · '+t("Rcpt")+' '+esc(tx.rcpt)+(dup?' <b style="color:#c62828">'+t("⚠ Duplicate")+'</b>':''):'')+(tx.inv?' · '+t("Inv")+' '+esc(tx.inv):'')+'</span></div>'+
    '<div class="am '+tx.type+'">'+(tx.type==="in"?"+":"-")+fmtAmt(tx.amount,tx.cur)+' '+CUR[tx.cur].s+'</div></div>'}
function bindRows(){Array.prototype.forEach.call(app.querySelectorAll(".tx"),function(el){el.onclick=function(){go("edit-"+el.getAttribute("data-id"))}})}

function bindTabs(id,cb){document.getElementById(id+"Out").onclick=function(){TAB="out";cb()};document.getElementById(id+"In").onclick=function(){TAB="in";cb()};document.getElementById(id+"Adv").onclick=function(){TAB="adv";cb()}}

/* ---------- one day at a time ---------- */
var DAY="";
function addDays(iso,n){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return isoDate(d)}
function curTotals(list){var s={IQD:0,USD:0};list.forEach(function(t){s[t.cur]=r2(s[t.cur]+t.amount)});return s}
function totLine(s){var a=[];if(s.IQD)a.push(fmtAmt(s.IQD,"IQD")+' IQD');if(s.USD)a.push(fmtAmt(s.USD,"USD")+' USD');return a.length?a.join(' · '):'0'}
function dayView(){
  if(!DAY)DAY=today();
  var d=DAY,list=sorted().filter(function(t){return t.date===d}),ins=list.filter(function(t){return t.type==="in"}),outs=list.filter(function(t){return t.type==="out"}),advs=list.filter(function(t){return t.type==="adv"});
  var start=balances(d),end=balances(addDays(d,1)),prev=null,next=null;
  S.tx.forEach(function(t){if(t.date<d&&(!prev||t.date>prev))prev=t.date;if(t.date>d&&(!next||t.date<next))next=t.date});
  var wd=WD[LANG][new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)).getDay()];
  function sec(title,cls,arr){return'<div class="box"><h2 style="color:'+({in:'#1f9d55',out:'#d64545',adv:'#b26a00'})[cls]+'">'+title+' ('+arr.length+')</h2>'+
    (arr.length?arr.map(txRow).join(""):'<p class="muted">'+t("None.")+'</p>')+
    '<div class="kv" style="border:0;margin-top:6px"><span>'+t("Total")+'</span><b>'+totLine(curTotals(arr))+'</b></div></div>'}
  app.innerHTML='<div class="box"><div class="two" style="margin-bottom:8px"><button class="small" id="dPrev" '+(prev?'':'disabled style="opacity:.4"')+'>'+t("← Previous day")+'</button><button class="small" id="dNext" '+(next?'':'disabled style="opacity:.4"')+'>'+t("Next day →")+'</button></div>'+
    '<div class="row" style="margin:0"><label style="min-width:0">'+wd+'</label><input type="date" id="dDate" value="'+d+'"><button class="small" id="dToday">'+t("Today")+'</button></div></div>'+
    '<div class="box"><h2>'+t("Opening Balance of the Day")+'</h2>'+balBox(start)+'</div>'+
    sec(t("+ Income"),"in",ins)+sec(t("− Expenses"),"out",outs)+(advs.length?sec(t("Advances"),"adv",advs):'')+
    '<div class="box"><h2>'+t("Closing Balance of the Day")+'</h2>'+balBox(end)+'</div>'+
    '<button class="big pri" id="dPr">'+t("🖨 Print this day")+'</button><button class="big" id="dBack" style="margin-top:8px">'+t("Back")+'</button>';
  bindRows();
  function to(x){DAY=x;dayView();scrollTo(0,0)}
  if(prev)document.getElementById("dPrev").onclick=function(){to(prev)};
  if(next)document.getElementById("dNext").onclick=function(){to(next)};
  document.getElementById("dDate").onchange=function(){if(this.value)to(this.value)};
  document.getElementById("dToday").onclick=function(){to(today())};
  document.getElementById("dPr").onclick=function(){PF.from=d;PF.to=d;go("print")};
  document.getElementById("dBack").onclick=function(){history.back()};
}

/* ---------- add / edit a movement ---------- */
function formView(tx,newType){
  var ed=!!tx,f=ed?{type:tx.type,cur:tx.cur,amount:String(tx.amount),date:tx.date,desc:tx.desc,inv:tx.inv,rcpt:tx.rcpt,worker:tx.worker||"",bld:tx.bld||""}
    :{worker:"",bld:"",type:newType,cur:S.lastCur||"IQD",amount:"",date:today(),desc:"",inv:"",rcpt:""};
  var descs={};sorted().reverse().forEach(function(x){if(x.desc&&Object.keys(descs).length<60)descs[x.desc]=1});

  app.innerHTML='<div class="box"><h2 id="fTtl"></h2>'+
    '<div class="row"><label>'+t("Type")+'</label><div class="seg" style="grid-template-columns:1fr 1fr 1fr"><button id="tIn" class="in">'+t("+ Income")+'</button><button id="tOut" class="out">'+t("− Expense")+'</button><button id="tAdv" class="adv">'+t("Advance")+'</button></div></div>'+
    '<div class="row" id="wkRow"><label>'+t("Worker")+'</label><input type="text" id="fWk" dir="auto" list="wl" autocomplete="off" value="'+esc(f.worker)+'"></div>'+
    '<datalist id="wl">'+wks+'</datalist>'+
    '<div class="row" id="bRow"><label>'+t("Building")+'</label>'+(bldList().length?'<div class="bseg" id="fB">'+bldList().concat([GEN]).map(function(b){return'<button data-b="'+esc(b)+'">'+esc(b===GEN?t("General"):b)+'</button>'}).join("")+'</div>':'<span class="hint" style="flex:1">'+t("Add the building numbers under ⚙ Settings.")+'</span>')+'</div>'+
    '<div class="row"><label>'+t("Currency")+'</label><div class="seg"><button id="cIQD" class="cur">IQD</button><button id="cUSD" class="cur">USD</button></div></div>'+
    '<div class="row"><label>'+t("Amount")+'</label><input type="text" id="fAmt" inputmode="decimal" autocomplete="off" value="'+esc(f.amount)+'"></div>'+
    '<div class="prev" id="fPrev"></div>'+
    '<div class="row"><label>'+t("Date")+'</label><input type="date" id="fDate" value="'+esc(f.date)+'"></div>'+
    '<div class="row"><label>'+t("Description")+'</label><input type="text" id="fDesc" dir="auto" list="dl" value="'+esc(f.desc)+'"></div>'+
    '<datalist id="dl">'+Object.keys(descs).map(function(d){return'<option value="'+esc(d)+'">'}).join("")+'</datalist>'+
    '<div class="row"><label>'+t("Receipt No.")+'</label><input type="text" id="fRc" autocomplete="off" placeholder="'+t("Optional")+'" value="'+esc(f.rcpt)+'"></div>'+
    '<div class="row"><label>'+t("Invoice No.")+'</label><input type="text" id="fInv" autocomplete="off" placeholder="'+t("Optional")+'" value="'+esc(f.inv)+'"></div>'+
    '<p class="err" id="fErr"></p>'+
    '<button class="big pri" id="fSave">'+t("Save")+'</button>'+
    '<div class="two" style="margin-top:8px"><button id="fCancel">'+t("Back")+'</button>'+(ed?'<button class="dan" id="fDel">'+t("Delete")+'</button>':'<span></span>')+'</div>'+
    '</div>';
  function paint(){
    document.getElementById("tIn").className="in"+(f.type==="in"?" on":"");
    document.getElementById("tOut").className="out"+(f.type==="out"?" on":"");
    document.getElementById("tAdv").className="adv"+(f.type==="adv"?" on":"");
    document.getElementById("fTtl").textContent=ed?t("Edit Transaction"):t({in:"New Income",out:"New Expense",adv:"New Advance"}[f.type]);
    document.getElementById("wkRow").style.display=f.type==="adv"?"":"none";
    document.getElementById("bRow").style.display=f.type==="out"?"":"none";
    Array.prototype.forEach.call(document.querySelectorAll("#fB button"),function(x){x.className=x.getAttribute("data-b")===f.bld?"on":""});
    document.getElementById("cIQD").className="cur"+(f.cur==="IQD"?" on":"");
    document.getElementById("cUSD").className="cur"+(f.cur==="USD"?" on":"");
    var a=parseAmt(document.getElementById("fAmt").value);
    document.getElementById("fPrev").textContent=isNaN(a)||!a?"":"= "+fmtAmt(a,f.cur)+" "+CUR[f.cur].n;
  }
  document.getElementById("tIn").onclick=function(){f.type="in";paint()};
  document.getElementById("tOut").onclick=function(){f.type="out";paint()};
  document.getElementById("tAdv").onclick=function(){f.type="adv";paint()};
  Array.prototype.forEach.call(document.querySelectorAll("#fB button"),function(x){x.onclick=function(){f.bld=x.getAttribute("data-b");paint()}});
  document.getElementById("cIQD").onclick=function(){f.cur="IQD";paint()};
  document.getElementById("cUSD").onclick=function(){f.cur="USD";paint()};
  document.getElementById("fAmt").oninput=paint;
  document.getElementById("fCancel").onclick=function(){history.back()};
  paint();
  if(!ed)setTimeout(function(){document.getElementById("fAmt").focus()},50);
  document.getElementById("fSave").onclick=function(){
    var err=document.getElementById("fErr");err.textContent="";
    ["fAmt","fRc","fDate","fWk"].forEach(function(id){document.getElementById(id).classList.remove("bad")});
    var amt=parseAmt(document.getElementById("fAmt").value),date=document.getElementById("fDate").value,
        rc=normRcpt(document.getElementById("fRc").value),inv=normDigits(document.getElementById("fInv").value).trim(),
        desc=document.getElementById("fDesc").value.trim();
    function bad(id,m){document.getElementById(id).classList.add("bad");err.textContent=m}
    if(isNaN(amt)||amt<=0)return bad("fAmt",t("Enter the amount."));
    if(!date)return bad("fDate",t("Select the date."));
    var wk=document.getElementById("fWk").value.trim().replace(/\s+/g," ");
    if(f.type==="adv"&&!wk)return bad("fWk",t("Enter the worker's name."));
    if(f.type==="out"&&bldList().length&&!f.bld){err.textContent=t("Select the building (or General for site-wide expenses).");return}
    var u=rc?rcptUsed(rc,ed?tx.id:null):null;
    if(u)return bad("fRc",t("Receipt No. {rc} is already used ({d} · {desc} · {amt} {sym}).",{rc:rc,d:fmtDate(u.date),desc:u.desc||"",amt:fmtAmt(u.amount,u.cur),sym:CUR[u.cur].s}));
    var o=ed?(txById(tx.id)||tx):{id:newId("t"),at:Date.now()};
    o.type=f.type;o.cur=f.cur;o.amount=r2(amt);o.date=date;o.desc=desc;o.inv=inv;o.rcpt=rc;
    if(f.type==="adv")o.worker=wk;else delete o.worker;
    if(f.type==="out"&&f.bld)o.bld=f.bld;else delete o.bld;
    if(ed){o.edited=Date.now();if(!txById(o.id))S.tx.push(o)}else S.tx.push(o);
    S.lastCur=f.cur;TAB=f.type;save();history.back();
  };
  if(ed)document.getElementById("fDel").onclick=function(){
    openModal('<h3>'+t("Delete this transaction?")+'</h3><div class="kv"><span>'+t("Receipt No.")+'</span><b>'+esc(tx.rcpt)+'</b></div><div class="kv"><span>'+t("Amount")+'</span><b>'+fmtAmt(tx.amount,tx.cur)+' '+CUR[tx.cur].s+'</b></div><div class="kv"><span>'+t("Description")+'</span><span dir="auto">'+esc(tx.desc)+'</span></div>'+
      '<div class="acts"><button id="mY" class="dan">'+t("Delete")+'</button><button id="mN">'+t("Cancel")+'</button></div>');
    document.getElementById("mN").onclick=closeModal;
    document.getElementById("mY").onclick=function(){S.tx=S.tx.filter(function(x){return x.id!==tx.id});save();closeModal();history.back()};
  };
}

/* ---------- log with filters ---------- */
var LF={from:"",to:"",cur:"",q:"",bld:""};
var WHAT={in:"income",out:"expenses",adv:"advances"};
function logView(){
  app.innerHTML='<div class="box"><h2>'+t("Records")+'</h2>'+tabBar("lt")+
    '<div class="row"><input type="text" id="lQ" dir="auto" placeholder="'+t("Search: receipt, invoice, description, worker")+'" value="'+esc(LF.q)+'"></div>'+
    '<div class="two" style="margin-bottom:8px"><input type="date" id="lF" value="'+LF.from+'"><input type="date" id="lT" value="'+LF.to+'"></div>'+
    '<div class="'+(TAB==="out"?'two':'')+'"><select id="lC" style="width:100%"><option value="">'+t("All currencies")+'</option><option value="IQD">IQD</option><option value="USD">USD</option></select>'+
    (TAB==="out"?'<select id="lB" style="width:100%"><option value="">'+t("All buildings")+'</option>'+bldList().concat([GEN]).map(function(b){return'<option value="'+esc(b)+'"'+(b===LF.bld?' selected':'')+'>'+esc(bldLabel(b))+'</option>'}).join("")+'</select>':'')+'</div>'+
    '<div id="lSum"></div></div><div class="box" id="lList"></div><button class="big" id="lBack">'+t("Back")+'</button>';
  document.getElementById("lC").value=LF.cur;
  bindTabs("lt",logView);
  function upd(){
    LF.q=document.getElementById("lQ").value;LF.from=document.getElementById("lF").value;LF.to=document.getElementById("lT").value;
    LF.cur=document.getElementById("lC").value;var lb=document.getElementById("lB");LF.bld=lb?lb.value:"";
    var q=normDigits(LF.q).trim().toLowerCase();
    var list=sorted().reverse().filter(function(tx){
      if(tx.type!==TAB)return false;
      if(LF.from&&tx.date<LF.from)return false;if(LF.to&&tx.date>LF.to)return false;
      if(LF.cur&&tx.cur!==LF.cur)return false;
      if(TAB==="out"&&LF.bld&&(tx.bld||GEN)!==LF.bld)return false;
      if(q&&(normRcpt(tx.rcpt)+" "+(tx.inv||"")+" "+(tx.desc||"")+" "+(tx.worker||"")+" "+(tx.bld||"")).toLowerCase().indexOf(q)<0)return false;
      return true});
    var tot=curTotals(list);
    document.getElementById("lSum").innerHTML='<div class="sum">'+["IQD","USD"].map(function(c){
      return'<div>'+t("Total {what} ({c})",{what:t(WHAT[TAB]),c:CUR[c].n})+': <b>'+fmtAmt(tot[c],c)+'</b></div>'}).join("")+'</div>'+
      '<p class="hint">'+cnt(list.length,"{n} transaction","{n} transactions")+'</p>';
    var L=document.getElementById("lList");
    L.innerHTML=list.length?list.slice(0,300).map(txRow).join("")+(list.length>300?'<p class="muted">'+t("Showing the first 300. Narrow the search.")+'</p>':''):'<p class="muted">'+t("No results.")+'</p>';
    bindRows();
  }
  /* the search box redraws on typing only; redrawing on its "change" (fired when it loses focus)
     would replace the list under the finger and swallow the tap on a result */
  document.getElementById("lQ").oninput=upd;
  ["lF","lT","lC","lB"].forEach(function(id){var e=document.getElementById(id);if(e)e.onchange=upd});
  document.getElementById("lBack").onclick=function(){history.back()};
  upd();
}

    b.style.fontWeight="600"});document.getElementById("pDw").style.display=PF.kind==="all"||PF.kind==="bld"?"none":"";document.getElementById("pBr").style.display=PF.kind==="out"?"":"none";document.getElementById("pWr").style.display=PF.kind==="adv"?"":"none"}

/* the same pages that print and go into the PDF, shrunk to the screen width, one under the other */
var PZ=1; /* preview zoom: 1 = page fits the screen width; up to 4 times that */
function previewView(){
  if(!PF.from||!PF.to||PF.from>PF.to){go("print");return}
  var pages=makePages(),n=pages.length,bar=function(id){return'<div class="three" style="margin:0 0 10px"><button class="pri" id="'+id+'Pr">'+t("🖨 Print")+'</button><button class="ok" id="'+id+'Pdf">📄 PDF</button><button id="'+id+'Bk">'+t("Back")+'</button></div>'};
  app.style.maxWidth="1120px";
  app.innerHTML='<div class="box" style="margin-bottom:10px"><h2 style="margin:0">'+t("Print Preview")+' · '+KT(PF.kind)+'</h2><p class="hint">'+t("Pages")+': '+n+'</p></div>'+bar("v1")+
    '<div id="zBar" style="position:sticky;top:48px;z-index:4;display:flex;gap:6px;align-items:center;justify-content:center;background:#eef1f6;padding:6px 0;margin-bottom:6px;direction:ltr">'+
      '<button class="small" id="zOut" style="min-width:48px;font-size:20px;padding:4px 10px">−</button><b id="zPct" style="min-width:64px;text-align:center"></b>'+
      '<button class="small" id="zIn" style="min-width:48px;font-size:20px;padding:4px 10px">+</button><button class="small" id="zFit">'+t("Fit")+'</button></div>'+
    '<div id="pvAll" style="touch-action:pan-x pan-y">'+pages.map(function(pg,i){return'<p class="muted" style="text-align:center;margin:6px 0">'+t("Page {i} of {n}",{i:i+1,n:n})+'</p>'+
      '<div class="pvs" style="overflow:auto;direction:ltr;margin-bottom:14px"><div class="pvw" style="position:relative;overflow:hidden;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);margin:0 auto">'+
      '<div class="pvi" dir="'+(isAr()?"rtl":"ltr")+'" style="position:absolute;left:0;top:0;width:'+PAGE_W+'px;height:'+PAGE_H+'px;padding:0;transform-origin:top left;background:#fff">'+pg+'</div></div></div>'}).join("")+'</div>'+bar("v2");
  var base=1;
  function fit(){base=Math.min(1,(app.clientWidth-24)/PAGE_W);var k=base*PZ;
    Array.prototype.forEach.call(app.querySelectorAll(".pvw"),function(el){el.style.width=Math.floor(PAGE_W*k)+"px";el.style.height=Math.ceil(PAGE_H*k)+"px";el.firstChild.style.transform="scale("+k+")"});
    document.getElementById("zPct").textContent=Math.round(k*100)+"%"}
  /* zoom keeps the same spot of the page in view: each page box scrolls sideways, the screen scrolls down */
  function zoom(z,cx,cy){z=Math.max(1,Math.min(4,z));if(Math.abs(z-PZ)<0.001)return;
    var r=z/PZ,sx=cx==null?innerWidth/2:cx,sy=cy==null?innerHeight/2:cy,boxes=app.querySelectorAll(".pvs"),keep=[];
    Array.prototype.forEach.call(boxes,function(el){var b=el.getBoundingClientRect();keep.push((el.scrollLeft+sx-b.left)*r-(sx-b.left))});
    var y=(scrollY+sy)*r-sy;PZ=z;fit();
    Array.prototype.forEach.call(boxes,function(el,i){el.scrollLeft=keep[i]});scrollTo(0,y)}
  fit();window.onresize=function(){if(location.hash==="#preview")fit()};
  document.getElementById("zIn").onclick=function(){zoom(PZ*1.25)};
  document.getElementById("zOut").onclick=function(){zoom(PZ/1.25)};
  document.getElementById("zFit").onclick=function(){zoom(1)};
  /* two-finger pinch on the pages */
  var pv=document.getElementById("pvAll"),p0=0,z0=1;
  function dist(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
  pv.addEventListener("touchstart",function(e){if(e.touches.length===2){p0=dist(e);z0=PZ}},{passive:true});
  pv.addEventListener("touchmove",function(e){if(e.touches.length!==2||!p0)return;e.preventDefault();
    var a=e.touches[0],b=e.touches[1];zoom(z0*dist(e)/p0,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2)},{passive:false});
  pv.addEventListener("touchend",function(e){if(e.touches.length<2)p0=0},{passive:true});
  ["v1","v2"].forEach(function(id){
    document.getElementById(id+"Pr").onclick=function(){printPages(makePages(),KT(PF.kind),function(){doPdf()})};
    document.getElementById(id+"Pdf").onclick=function(){doPdf()};
    document.getElementById(id+"Bk").onclick=function(){history.back()}});
}
function makePages(){return PF.kind==="all"?ledgerPages(PF.from,PF.to):PF.kind==="bld"?bldPages(PF.from,PF.to):kindPages(PF.kind,PF.from,PF.to,PF.daily)}
function doPdf(){var nm={out:"sadir",in:"warid",adv:"sulaf",bld:"binayat",all:"sandoq"}[PF.kind];pdfPages(makePages,nm+"_"+PF.from+(PF.to!==PF.from?"_"+PF.to:"")+".pdf",KT(PF.kind))}
function nCell(v,cur,cls){if(v===""||v==null)return'<td class="n'+(cls?" "+cls:"")+'"></td>';return'<td class="n'+(cls?" "+cls:"")+(v<0?" neg":"")+'">'+fmtAmt(v,cur)+'</td>'}
function descH(tx,perLine){var n=(tx.desc||"").length,lines=Math.max(1,Math.min(3,Math.ceil(n/perLine)));return 22+(lines-1)*15}
/* lays rows out on landscape pages: the column header repeats on every page,
   "first" rows open page 1 and "last" rows (totals) stay together on the last page */
function paginate(o){
  var cap=PAGE_H-TOP_H-TH_H-FT_H,pages=[],cur=[],used=0;
  o.first.forEach(function(r){cur.push(r);used+=r.h});
  o.rows.forEach(function(r){if(used+r.h>cap&&cur.length){pages.push(cur);cur=[];used=0}cur.push(r);used+=r.h});
  var lastH=o.last.reduce(function(a,r){return a+r.h},0);
  if(used+lastH>cap&&cur.length){pages.push(cur);cur=[];used=0}
  o.last.forEach(function(r){cur.push(r)});pages.push(cur);
  var N=pages.length,printed=fmtDate(today());
  var per=o.from===o.to?t("Date: {d}",{d:'<b>'+fmtDate(o.from)+'</b>'}):t("From {a} to {b}",{a:'<b>'+fmtDate(o.from)+'</b>',b:'<b>'+fmtDate(o.to)+'</b>'});
  return pages.map(function(pg,pi){
    return'<div class="sheet page" style="width:'+PAGE_W+'px">'+
      '<div class="hdr" style="height:'+(TOP_H-8)+'px"><div class="logo">SATCON</div><div class="ttl"><b>'+o.title+'</b><span>'+esc(S.project||"")+'</span></div>'+
      '<div class="per"><div>'+per+'</div></div></div>'+
      '<table>'+o.colg+o.head+pg.map(function(r){return r.html}).join("")+'</table>'+
      '<div class="ft"><span>'+t("Printed on: {d}",{d:printed})+'</span><span>'+t("Page {i} of {n}",{i:pi+1,n:N})+'</span></div></div>'});
}
function kindRows(kind,from,to){var w=kind==="adv"?PF.worker:"",bl=kind==="out"?PF.bld:"";return sorted().filter(function(tx){return tx.type===kind&&tx.date>=from&&tx.date<=to&&(!w||tx.worker===w)&&(!bl||(tx.bld||GEN)===bl)})}
/* in-only or out-only sheet: amount columns per currency, optional total under each day */
function kindPages(kind,from,to,daily){
  var list=kindRows(kind,from,to),rows=[],tot={IQD:0,USD:0},day={IQD:0,USD:0},isAdv=kind==="adv",name=t(WHAT[kind]);
  var showB=kind==="out"&&!PF.bld,nc=showB?6:5;
  /* advances: the worker's name takes the invoice column's place; expenses for all buildings get a building column */
  list.forEach(function(tx,i){
    var h=descH(tx,showB?62:72);
    rows.push({h:h,html:'<tr style="height:'+h+'px"><td>'+(i+1)+'</td><td>'+fmtDate(tx.date)+'</td>'+(isAdv?'<td dir="auto"><b>'+esc(tx.worker)+'</b></td>':'')+(showB?'<td><b>'+esc(tx.bld&&tx.bld!==GEN?tx.bld:t("General"))+'</b></td>':'')+'<td class="ds"><div dir="auto">'+esc(tx.desc)+'</div></td>'+(isAdv?'':'<td>'+esc(tx.inv)+'</td>')+'<td>'+esc(tx.rcpt)+'</td>'+
      nCell(tx.cur==="IQD"?tx.amount:"","IQD")+nCell(tx.cur==="USD"?tx.amount:"","USD")+'</tr>'});
    tot[tx.cur]=r2(tot[tx.cur]+tx.amount);day[tx.cur]=r2(day[tx.cur]+tx.amount);
    var nx=list[i+1];
    if(daily&&(!nx||nx.date!==tx.date)){
      rows.push({h:22,html:'<tr class="cf" style="height:22px"><td colspan="'+nc+'">'+t("Subtotal for {d}",{d:fmtDate(tx.date)})+'</td>'+nCell(day.IQD||"","IQD")+nCell(day.USD||"","USD")+'</tr>'});
      day={IQD:0,USD:0}}
  });
  function groupRows(title,keyOf,one,many,disp){
    var m={};list.forEach(function(tx){var k=keyOf(tx),w=m[k]||(m[k]={n:0,IQD:0,USD:0});w.n++;w[tx.cur]=r2(w[tx.cur]+tx.amount)});
    rows.push({h:26,html:'<tr class="tot"><td colspan="'+(nc+2)+'">'+t(title)+'</td></tr>'});
    Object.keys(m).sort(byName).forEach(function(k){
      rows.push({h:22,html:'<tr class="cf" style="height:22px"><td colspan="2">'+cnt(m[k].n,one,many)+'</td><td colspan="'+(nc-2)+'"><b>'+esc(disp?disp(k):k)+'</b></td>'+nCell(m[k].IQD||"","IQD")+nCell(m[k].USD||"","USD")+'</tr>'})});
  }
  if(isAdv&&list.length&&!PF.worker)groupRows("Totals by Worker",function(tx){return tx.worker},"{n} advance","{n} advances");
  if(showB&&list.length)groupRows("Totals by Building",function(tx){return tx.bld||GEN},"{n} invoice","{n} invoices",bldLabel);
  var last=[],who=isAdv&&PF.worker?' '+esc(PF.worker):kind==="out"&&PF.bld?' '+esc(bldLabel(PF.bld)):'';
  if(!list.length)last.push({h:30,html:'<tr><td colspan="'+(nc+2)+'" style="height:30px">'+t("No {x} in this period",{x:name})+'</td></tr>'});
  last.push({h:28,html:'<tr class="tot"><td colspan="'+nc+'">'+t("Total {x}",{x:name})+who+'</td>'+nCell(tot.IQD,"IQD")+nCell(tot.USD,"USD")+'</tr>'});
  var c=' style="background:'+({in:"#a9d18e",out:"#f4b183",adv:"#ffd966"})[kind]+'"';
  return paginate({title:KT(kind)+(who?' -'+who:''),from:from,to:to,first:[],rows:rows,last:last,
    colg:'<colgroup><col style="width:40px"><col style="width:90px">'+(isAdv?'<col style="width:170px"><col>':(showB?'<col style="width:90px">':'')+'<col><col style="width:110px">')+'<col style="width:100px"><col style="width:150px"><col style="width:130px"></colgroup>',
    head:'<tr><th'+c+'>'+t("No.")+'</th><th'+c+'>'+t("Date")+'</th>'+(isAdv?'<th'+c+'>'+t("Worker")+'</th><th'+c+'>'+t("Description")+'</th>':(showB?'<th'+c+'>'+t("Building")+'</th>':'')+'<th'+c+'>'+t("Description")+'</th><th'+c+'>'+t("Invoice No.")+'</th>')+'<th'+c+'>'+t("Receipt No.")+'</th><th class="iq">'+t("Amount (IQD)")+'</th><th class="us">'+t("Amount (USD)")+'</th></tr>'});
}
/* one line per building: how much went out for it */
function bldPages(from,to){

function badgeTxt(){if(!SY.on)return"";var n=pendN();
  if(SST.err==="out")return"🔴";if(SST.err==="nofb")return"⚪";
  if(!SST.ready||SST.cache)return"🟠"+(n?" "+n:"");return n?"🟠 "+n:"🟢"}
function updBadge(){var b=document.getElementById("syncB");if(b)b.textContent=badgeTxt();var x=document.getElementById("syS");if(x)x.innerHTML=syncStatus()}
function hm(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())+" "+fmtDate(isoDate(d))}
function syncStatus(){var n=pendN();
  if(SST.err==="nofb")return t("⚪ Sync components are missing from this version. Install the latest APK.");
  if(SST.err==="out")return t("🔴 Please sign in again.");
  if(!SST.ready)return t("🟠 Connecting...");
  return(SST.cache?t("🟠 Offline. Changes will sync automatically when the connection returns."):t("🟢 Connected"))+
    (n?"<br>"+t("Pending upload: <b>{n}</b>",{n:n}):"<br>"+t("All changes uploaded ✓"))+(SST.lastOk?"<br><span class='muted'>"+t("Last connection: {t}",{t:hm(SST.lastOk)})+"</span>":"")}
function authMsg(e){var c=String(e&&e.code||e&&e.message||e);
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return t("Incorrect email or password.");
  if(/network|timeout|unavailable/.test(c))return t("No internet connection, or the connection is weak. Please try again.");
  if(/too-many/.test(c))return t("Too many attempts. Please wait a moment and try again.");
  return t("Error: {c}",{c:c})}
function syncBox(){
  var form='<div class="row"><input type="email" id="syE" dir="ltr" autocomplete="username" placeholder="'+t("Email")+'" value="'+esc(SY.email||"")+'"></div>'+
    '<div class="row"><input type="password" id="syP" dir="ltr" autocomplete="current-password" placeholder="'+t("Password")+'"></div><p class="err" id="syErr"></p>';
  if(!SY.on)return'<div class="box"><h2>'+t("☁ Device Sync")+'</h2><p class="muted" style="margin-top:0">'+t("Sign in with the same account on the phone and the laptop to keep both in sync. The app works offline and syncs when the connection returns.")+'</p>'+
    form+'<button class="big pri" id="syIn">'+t("Sign In and Connect")+'</button></div>';
  if(SST.err==="out")return'<div class="box"><h2>'+t("☁ Sync")+'</h2><p id="syS">'+syncStatus()+'</p>'+form+'<button class="big pri" id="syIn">'+t("Sign In")+'</button></div>';
  return'<div class="box"><h2>'+t("☁ Sync")+'</h2><p style="margin-top:0">'+t("Account:")+' <b dir="ltr">'+esc(SY.email||"")+'</b></p><p id="syS">'+syncStatus()+'</p>'+
    '<div class="two"><button id="syNow">'+t("🔄 Sync Now")+'</button><button class="dan" id="syOut">'+t("Sign Out")+'</button></div></div>'}
function bindSyncBox(){
  var bIn=document.getElementById("syIn");
  if(bIn)bIn.onclick=function(){
    var em=document.getElementById("syE").value.trim(),pw=document.getElementById("syP").value,er=document.getElementById("syErr");
    if(!em||!pw){er.textContent=t("Enter the email and password.");return}
    bIn.disabled=true;er.style.color="#555";er.textContent=t("Connecting...");
    withNet(ensureFb().then(function(){return fbx.signInWithEmailAndPassword(fauth,em,pw)})).then(function(cred){
      SY.email=em;SY.uid=cred.user.uid;saveSY();
      if(SY.on){SST.err="";SST.ready=true;shadowInit();listen();flush();render();return}
      return withNet(fbx.getDocsFromServer(fbx.query(fbx.collection(fdb,"s"),fbx.limit(1)))).then(function(q){
        if(q.empty)return firstUpload();
        var local=SITES.ids.reduce(function(a,id){return a+readSite(id).tx.length},0);
        if(!local)return download();
        openModal('<h3>'+t("Data found on the server")+'</h3><p>'+t("This device will load the server data, and <b>the data on this device ({n} transactions) will be replaced</b>.",{n:local})+'</p><p class="hint">'+t("If this device holds anything not on the server, create a backup first.")+'</p>'+
          '<div class="acts" style="flex-direction:column"><button id="mBk">'+t("💾 Create Backup First")+'</button><button id="mY" class="dan">'+t("Continue and Load Server Data")+'</button><button id="mN">'+t("Cancel")+'</button></div>');
        document.getElementById("mBk").onclick=backup;
        document.getElementById("mN").onclick=function(){closeModal();fbx.signOut(fauth);render()};
        document.getElementById("mY").onclick=function(){closeModal();download()};
      });
    }).catch(function(e){bIn.disabled=false;er.style.color="";er.textContent=authMsg(e)});
  };
  var bNow=document.getElementById("syNow");if(bNow)bNow.onclick=function(){if(!SST.ready)startSync();else flush();updBadge()};
  var bOut=document.getElementById("syOut");if(bOut)bOut.onclick=function(){var n=pendN();
    openModal('<h3>'+t("Sign out of sync?")+'</h3><p>'+t("Your data stays on this device but will no longer sync.")+'</p>'+(n?'<p class="err">'+t("{n} change(s) have not been uploaded yet and will not reach the server.",{n:n})+'</p>':'')+
      '<div class="acts"><button id="mY" class="dan">'+t("Sign Out")+'</button><button id="mN">'+t("Cancel")+'</button></div>');
    document.getElementById("mN").onclick=closeModal;
    document.getElementById("mY").onclick=function(){stopListen();try{fbx.signOut(fauth)}catch(e){}SY.on=false;saveSY();PEND={};savePend();SST.ready=false;closeModal();render()}};
}
/* first device: send every site and movement on this device */
function firstUpload(){
  SITES.ids.forEach(function(sid){mark(sid,"__site");readSite(sid).tx.forEach(function(tx){mark(sid,tx.id)})});
  savePend();SY.on=true;saveSY();SST.ready=true;shadowInit();listen();flush();
  info(t("✓ Connected"),t("Uploading this device's data ({n} items). Keep the app open and online until the indicator turns 🟢, then sign in on the other device.",{n:pendN()}));render()}
/* other devices: take the server's data in place of this device's */
function download(){
  openModal('<h3 style="text-align:center">'+t("Downloading data...")+'</h3>');
  withNet(fbx.getDocsFromServer(fbx.collection(fdb,"s"))).then(function(q){
    var sites=q.docs.filter(function(d){return!(d.data()||{}).deleted}).map(function(d){return{id:d.id,data:d.data()}});
    if(!sites.length)throw{code:"empty"};
    return Promise.all(sites.map(function(s){return withNet(fbx.getDocsFromServer(fbx.collection(fdb,"s",s.id,"t"))).then(function(tq){s.tx=tq.docs.filter(function(d){return!(d.data()||{}).deleted}).map(function(d){return canonTx(Object.assign({},d.data(),{id:d.id}))});return s})}));
  }).then(function(sites){
    SITES.ids.forEach(function(id){try{localStorage.removeItem(siteKey(id))}catch(e){}});
    sites.sort(function(a,b){return a.id==="1"?-1:b.id==="1"?1:0});
    sites.forEach(function(s){var st=blank(),m=canonMeta(s.data||{});st.project=m.project;st.open=m.open;st.blds=m.blds;st.tx=s.tx;writeSite(s.id,st)});
    SITES={cur:sites[0].id,ids:sites.map(function(s){return s.id}),next:2};saveSites();
    KEY=siteKey(SITES.cur);S=load();resetViews();PEND={};savePend();SY.on=true;saveSY();SST.ready=true;shadowInit();listen();
    closeModal();go("");render();
    setTimeout(function(){info(t("✓ Connected"),t("{n} site(s) downloaded. Anything recorded here will appear on the other device.",{n:sites.length}))},150);
  }).catch(function(e){closeModal();info(t("Download failed"),authMsg(e));try{fbx.signOut(fauth)}catch(x){}});
}

window.__updateReady=function(){
  if(document.getElementById("updBar"))return;
  var b=document.createElement("div");b.id="updBar";
  b.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#1f9d55;color:#fff;padding:12px;display:flex;align-items:center;justify-content:space-between;z-index:60;font-size:15px";
  b.innerHTML='<span>'+t("A new version of the app is available")+'</span><button style="background:#fff;color:#1f9d55;font-weight:700">'+t("Update Now")+'</button>';
  b.querySelector("button").onclick=function(){location.reload()};document.body.appendChild(b);
};
if(SY.on)shadowInit();
render();
startSync();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!NATIVE){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})}
})();
</script>
