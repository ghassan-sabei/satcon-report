name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'manifest.json', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Bundle web files
        run: |
          mkdir -p android/app/src/main/assets/web android/app/src/main/assets/lib
          cp index.html manifest.json icon-192.png icon-512.png android/app/src/main/assets/web/
          curl -fsSL -o android/app/src/main/assets/lib/html2canvas.min.js https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js
          curl -fsSL -o android/app/src/main/assets/lib/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
      - name: Build
        id: build
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk satcon-report.apk
      - name: Publish APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          make_latest: true
          files: satcon-report.apk
      - name: Save log to branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          echo "${{ job.status }} run ${{ github.run_number }}" > /tmp/out/status.txt
          [ -f satcon-report.apk ] && cp satcon-report.apk /tmp/out/ || true
          cd /tmp/out && git init -q && git checkout -q -b build-log
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
